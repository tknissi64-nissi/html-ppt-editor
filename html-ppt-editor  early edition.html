    var t = overlay.querySelector('.size-tip');
    if (!t) { t = U.el('div', { class: 'size-tip' }); overlay.appendChild(t); }
    t.textContent = text;
    t.style.left = (x * zoom + 12) + 'px';
    t.style.top = (y * zoom + 16) + 'px';
  }
  function clearTransient() {
    U.$$('.guide,.size-tip,.marquee', overlay).forEach(function (n) { n.remove(); });
  }

  /* ------------------------------------------------------------ 标尺 */
  function drawRulers() {
    if (!S.view.showRuler || !S.deck) return;
    var rh = document.getElementById('ruler-h'), rv = document.getElementById('ruler-v');
    if (!rh || !rv) return;
    var deck = S.deck;
    var pr = page.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
    var offX = pr.left - wr.left - RULER, offY = pr.top - wr.top - RULER;

    function build(el, len, off, horiz) {
      var step = 50;                       // 设计像素
      while (step * zoom < 34) step *= 2;
      var html = '';
      for (var v = 0; v <= len; v += step / 5) {
        var p = off + v * zoom;
        var maj = Math.abs(v % step) < .01;
        html += '<div class="tick' + (maj ? ' maj' : '') + '" style="' + (horiz ? 'left' : 'top') + ':' + p.toFixed(1) + 'px"></div>';
        if (maj) html += '<div class="lb" style="' + (horiz ? 'left' : 'top') + ':' + p.toFixed(1) + 'px">' + v + '</div>';
      }
      el.innerHTML = html;
    }
    build(rh, deck.size.w, offX, true);
    build(rv, deck.size.h, offY, false);
  }
  function rulerCursor(pt) {
    if (!S.view.showRuler) return;
    var rh = document.getElementById('ruler-h'), rv = document.getElementById('ruler-v');
    if (!rh) return;
    var pr = page.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
    function put(el, pos, horiz) {
      var c = el.querySelector('.cursor');
      if (!c) { c = U.el('div', { class: 'cursor' }); el.appendChild(c); }
      c.style[horiz ? 'left' : 'top'] = pos.toFixed(1) + 'px';
    }
    put(rh, pr.left - wr.left - RULER + pt.x * zoom, true);
    put(rv, pr.top - wr.top - RULER + pt.y * zoom, false);
  }

  /* ==================================================================
     指针交互
     ================================================================== */
  function onOverlayMove(e) {
    if (drag) return;
    var pt = toDesign(e.clientX, e.clientY);
    rulerCursor(pt);
    hoverCursor(e, pt);
  }

  /**
   * 容差要**看得见**：鼠标一进入命中容差范围，光标就该变成"可拖动"的样子，
   * 而不是非要压到边框上才变。控制点自己有 CSS 光标，且盖在上层，这里不插手。
   */
  function hoverCursor(e, pt) {
    var slide = S.curSlide();
    if (!slide || !PS.flow.objectMode(slide) || editingNode) { overlay.style.cursor = ''; return; }
    if (e.target.closest && e.target.closest('.handle')) { overlay.style.cursor = ''; return; }
    if (PS.shape.getPending()) { overlay.style.cursor = 'crosshair'; return; }
    overlay.style.cursor = PS.select.hitTest(pt.x, pt.y) ? 'move' : '';
  }

  function onOverlayDown(e) {
    if (e.button === 2) return;
    var slide = S.curSlide();
    if (!slide || !PS.flow.objectMode(slide)) return;
    var pt = toDesign(e.clientX, e.clientY);

    /* 1) 待插入形状：拖出一个新对象 */
    var pend = PS.shape.getPending();
    if (pend) { startInsert(e, pt, pend); return; }

    /* 2) 点在控制柄上 */
    var hd = e.target.closest ? e.target.closest('.handle') : null;
    if (hd) {
      var dir = hd.getAttribute('data-dir');
      if (dir === 'rot') startRotate(e, pt);
      else if (dir === 'adj') startAdjust(e, pt);
      else startResize(e, pt, dir);
      return;
    }

    /* 3) 命中对象 → 选中并准备拖动。
       同一个位置连续点击会**逐层往下**选（叠在一起时才够得到底下的东西），
       按住 Alt 也能直接往下钻一层。 */
    var hit = PS.select.hitTest(pt.x, pt.y, {
      below: (e.altKey || sameSpot(pt)) ? S.sel.elIds[S.sel.elIds.length - 1] : null
    });
    lastSpot = { x: pt.x, y: pt.y, t: Date.now() };
    if (hit) {
      /* 格式刷待命中：这一下点击是「刷格式」，不是普通选中 */
      if (S.state.formatBrush && PS.app.applyBrushTo(hit)) { S.selectElements([hit.id]); return; }
      var already = S.sel.elIds.indexOf(hit.id) >= 0;
      if (e.shiftKey || U.ctrlKey(e)) S.selectElements([hit.id], true);
      else if (!already) S.selectElements([hit.id]);
      if (hit.type === 'table') {
        var td = tdAt(pt);
        if (td) PS.table.setCursor(+td.getAttribute('data-r'), +td.getAttribute('data-c'));
      }
      if (S.sel.elIds.indexOf(hit.id) >= 0) startMove(e, pt);
      return;
    }

    /* 4) 空白处 → 框选 */
    if (!e.shiftKey && !U.ctrlKey(e)) S.clearElSelection();
    startMarquee(e, pt, e.shiftKey || U.ctrlKey(e));
  }

  /** 统一的拖拽会话骨架 */
  function session(onMove, onUp) {
    function mm(ev) { onMove(ev); }
    function mu(ev) {
      document.removeEventListener('mousemove', mm, true);
      document.removeEventListener('mouseup', mu, true);
      drag = null;
      clearTransient();
      S.history.breakMerge();
      if (onUp) onUp(ev);
      drawOverlay();
    }
    document.addEventListener('mousemove', mm, true);
    document.addEventListener('mouseup', mu, true);
  }

  function startMove(e, pt) {
    var els = S.selElements().filter(function (x) { return !x.locked; });
    if (!els.length) return;
    e.preventDefault();
    var start = els.map(function (x) { return { e: x, x: x.x, y: x.y }; });
    var box0 = U.unionBox(els);
    var tg = PS.snap.targets(els.map(function (x) { return x.id; }));
    drag = { kind: 'move' };
    var moved = false;

    session(function (ev) {
      var p = toDesign(ev.clientX, ev.clientY);
      var dx = p.x - pt.x, dy = p.y - pt.y;
      if (ev.shiftKey) { if (Math.abs(dx) > Math.abs(dy)) dy = 0; else dx = 0; }   // 约束到水平/垂直
      var res = PS.snap.resolve({ x: box0.x + dx, y: box0.y + dy, w: box0.w, h: box0.h }, tg);
      dx += res.dx; dy += res.dy;
      start.forEach(function (s) { s.e.x = U.round(s.x + dx, 1); s.e.y = U.round(s.y + dy, 1); });
      moved = true;
      S.touch('slide');
      showGuides(res.guides);
      showTip('X ' + Math.round(box0.x + dx) + '  Y ' + Math.round(box0.y + dy), box0.x + dx, box0.y + dy + box0.h);
    }, function () {
      if (moved) S.commit('移动对象');
    });
  }

  function startResize(e, pt, dir) {
    var els = S.selElements().filter(function (x) { return !x.locked; });
    if (!els.length) return;
    e.preventDefault();
    var multi = els.length > 1;
    var box0 = U.unionBox(els);
    var start = els.map(function (x) { return { e: x, x: x.x, y: x.y, w: x.w, h: x.h }; });
    var tg = PS.snap.targets(els.map(function (x) { return x.id; }));
    drag = { kind: 'resize' };
    var moved = false;
    var ratio = box0.w / Math.max(1, box0.h);

    session(function (ev) {
      var p = toDesign(ev.clientX, ev.clientY);
      var dx = p.x - pt.x, dy = p.y - pt.y;
      var nb = { x: box0.x, y: box0.y, w: box0.w, h: box0.h };
      if (dir.indexOf('w') >= 0) { nb.x = box0.x + dx; nb.w = box0.w - dx; }
      if (dir.indexOf('e') >= 0) { nb.w = box0.w + dx; }
      if (dir.indexOf('n') >= 0) { nb.y = box0.y + dy; nb.h = box0.h - dy; }
      if (dir.indexOf('s') >= 0) { nb.h = box0.h + dy; }

      /* Shift 锁定纵横比（角柄），Alt 从中心缩放 —— 同 PowerPoint */
      if (ev.shiftKey && dir.length === 2) {
        if (Math.abs(nb.w / ratio) > Math.abs(nb.h)) nb.h = nb.w / ratio; else nb.w = nb.h * ratio;
        if (dir.indexOf('n') >= 0) nb.y = box0.y + box0.h - nb.h;
        if (dir.indexOf('w') >= 0) nb.x = box0.x + box0.w - nb.w;
      }
      if (ev.altKey) {
        nb.w = box0.w + (nb.w - box0.w) * 2 * (dir.indexOf('w') >= 0 ? 1 : 1);
        nb.x = box0.x + box0.w / 2 - nb.w / 2;
        nb.h = box0.h + (nb.h - box0.h) * 2;
        nb.y = box0.y + box0.h / 2 - nb.h / 2;
      }
      var res = PS.snap.resolve(nb, tg);
      /* 只对正在拖的那条边做吸附修正 */
      if (dir.indexOf('e') >= 0) nb.w += res.dx; else if (dir.indexOf('w') >= 0) { nb.x += res.dx; nb.w -= res.dx; }
      if (dir.indexOf('s') >= 0) nb.h += res.dy; else if (dir.indexOf('n') >= 0) { nb.y += res.dy; nb.h -= res.dy; }

      nb.w = Math.max(2, nb.w);
      nb.h = Math.max(els[0].type === 'line' ? 0 : 2, nb.h);

      var sx = nb.w / Math.max(1, box0.w), sy = nb.h / Math.max(1, box0.h);
      start.forEach(function (s) {
        if (multi) {
          s.e.x = U.round(nb.x + (s.x - box0.x) * sx, 1);
          s.e.y = U.round(nb.y + (s.y - box0.y) * sy, 1);
          s.e.w = U.round(s.w * sx, 1);
          s.e.h = U.round(s.h * sy, 1);
        } else {
          s.e.x = U.round(nb.x, 1); s.e.y = U.round(nb.y, 1);
          s.e.w = U.round(nb.w, 1); s.e.h = U.round(nb.h, 1);
        }
      });
      moved = true;
      S.touch('slide');
      showGuides(res.guides);
      showTip(Math.round(nb.w) + ' × ' + Math.round(nb.h), nb.x, nb.y + nb.h);
    }, function () {
      if (moved) S.commit('调整大小');
    });
  }

  function startRotate(e, pt) {
    var els = S.selElements().filter(function (x) { return !x.locked; });
    if (!els.length) return;
    e.preventDefault();
    var b = U.unionBox(els);
    var cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    var a0 = Math.atan2(pt.y - cy, pt.x - cx) * 180 / Math.PI;
    var start = els.map(function (x) { return { e: x, rot: x.rot || 0 }; });
    drag = { kind: 'rotate' };
    var moved = false;

    session(function (ev) {
      var p = toDesign(ev.clientX, ev.clientY);
      var a = Math.atan2(p.y - cy, p.x - cx) * 180 / Math.PI;
      var d = a - a0;
      start.forEach(function (s) {
        var r = s.rot + d;
        if (ev.shiftKey) r = Math.round(r / 15) * 15;
        s.e.rot = U.round((r % 360 + 360) % 360, 1);
      });
      moved = true;
      S.touch('slide');
      showTip(Math.round(start[0].e.rot) + '°', cx, b.y + b.h);
    }, function () {
      if (moved) S.commit('旋转对象');
    });
  }

  function startAdjust(e, pt) {
    var els = S.selElements().filter(function (x) { return x.type === 'shape' && !x.locked; });
    if (!els.length) return;
    e.preventDefault();
    var el0 = els[0];
    drag = { kind: 'adjust' };
    var moved = false;
    session(function (ev) {
      var p = toDesign(ev.clientX, ev.clientY);
      var v = U.clamp((p.x - el0.x) / Math.max(1, el0.w), 0, 1);
      els.forEach(function (x) { x.adjust = U.round(v, 3); });
      moved = true;
      S.touch('slide');
      showTip('调整 ' + Math.round(v * 100) + '%', el0.x, el0.y);
    }, function () {
      if (moved) S.commit('调整形状');
    });
  }

  function startMarquee(e, pt, additive) {
    e.preventDefault();
    var node = U.el('div', { class: 'marquee' });
    overlay.appendChild(node);
    drag = { kind: 'marquee' };
    var rect = { x: pt.x, y: pt.y, w: 0, h: 0 };
    session(function (ev) {
      var p = toDesign(ev.clientX, ev.clientY);
      rect = { x: Math.min(pt.x, p.x), y: Math.min(pt.y, p.y), w: Math.abs(p.x - pt.x), h: Math.abs(p.y - pt.y) };
      css(node, rect);
    }, function () {
      if (rect.w > 3 && rect.h > 3) PS.select.marquee(rect, additive);
    });
  }

  function startInsert(e, pt, pend) {
    e.preventDefault();
    var node = U.el('div', { class: 'marquee' });
    overlay.appendChild(node);
    drag = { kind: 'insert' };
    var rect = null;
    session(function (ev) {
      var p = toDesign(ev.clientX, ev.clientY);
      var w = Math.abs(p.x - pt.x), h = Math.abs(p.y - pt.y);
      if (ev.shiftKey) { var m = Math.max(w, h); w = h = m; }
      rect = { x: Math.min(pt.x, p.x), y: Math.min(pt.y, p.y), w: w, h: h };
      css(node, rect);
      showTip(Math.round(w) + ' × ' + Math.round(h), rect.x, rect.y + rect.h);
    }, function () {
      PS.shape.clearPending();
      var spec = { type: pend.type, key: pend.key };
      if (rect && rect.w > 4 && rect.h > 4) {
        if (spec.type === 'line') rect.h = 0;
        PS.shape.place(spec, rect);
      } else {
        /* 没拖只是点了一下：按默认尺寸、以光标为中心放置。
           以前是把左上角对齐光标，形状会整体偏到右下方，
           点在画布边缘时甚至跑到视野外，让人误以为没插进去、于是反复点，
           结果堆了一摞形状把下面的对象全盖住。 */
        PS.shape.place(spec, { x: pt.x, y: pt.y, center: true });
      }
    });
  }

  /* ------------------------------------------------------ 内联文字编辑 */
  function onOverlayDblClick(e) {
    var slide = S.curSlide();
    if (!slide || !PS.flow.objectMode(slide)) return;
    var pt = toDesign(e.clientX, e.clientY);
    var hit = PS.select.hitTest(pt.x, pt.y);
    if (!hit || hit.locked) return;
    S.selectElements([hit.id]);
    if (hit.type === 'table') { beginCellEdit(hit, pt); return; }
    if (hit.type === 'chart') { PS.chart.editData(); return; }
    if (!hit.text) return;
    beginTextEdit(hit.id);
  }

  /* ---------------------------------------------------- 表格单元格编辑 */
  /** iframe 内部就是设计分辨率，所以设计坐标可以直接喂给 elementFromPoint */
  function tdAt(pt) {
    if (!fdoc) return null;
    var n = fdoc.elementFromPoint(pt.x, pt.y);
    return n && n.closest ? n.closest('td[data-r]') : null;
  }

  function beginCellEdit(el, pt) {
    var td = tdAt(pt);
    if (!td) return;
    endTextEdit(true);
    var r = +td.getAttribute('data-r'), c = +td.getAttribute('data-c');
    PS.table.setCursor(r, c);
    editingNode = td;
    editingTable = el;
    editingSlideId = (S.curSlide() || {}).id; editingElId = el.id;
    /* 顺序要紧：`setEditing` 会同步触发功能区重绘，而「字体」组是否置灰要看
       iframe 里有没有 contenteditable 宿主。先 setEditing 的话，重绘那一刻宿主还不存在，
       整组就会灰着，而且之后再没有事件来纠正它。**必须先挂 contenteditable 再 setEditing。** */
    td.setAttribute('contenteditable', 'true');
    S.setEditing(el.id);
    overlay.style.pointerEvents = 'none';
    td.focus();
    var rg = fdoc.createRange(); rg.selectNodeContents(td); rg.collapse(false);
    var sel = frame.contentWindow.getSelection();
    sel.removeAllRanges(); sel.addRange(rg);
  }

  function syncCellHTML() {
    if (!editingNode || !editingTable) return;
    var r = +editingNode.getAttribute('data-r'), c = +editingNode.getAttribute('data-c');
    /* 绑定到进入编辑时那一页，不能用"当前页"——切页后写回会落到别人身上 */
    var slide = slideById(editingSlideId) || S.curSlide();
    var e = M.findElement(slide, editingTable.id);
    if (!e || !e.cells || !e.cells[r] || !e.cells[r][c]) return;
    var html = editingNode.innerHTML;
    if (html === e.cells[r][c].html) return;
    e.cells[r][c].html = html;
    S.commit('编辑单元格', { merge: 'cell-' + e.id + '-' + r + '-' + c });
  }

  /** Tab / Shift+Tab 在单元格间跳，到行尾自动换行——和 PowerPoint 一致 */
  function moveCell(back) {
    if (!editingTable) return false;
    var e = M.findElement(S.curSlide(), editingTable.id);
    if (!e) return false;
    var cur = PS.table.getCursor();
    var idx = cur.r * e.cols + cur.c + (back ? -1 : 1);
    if (idx < 0) idx = 0;
    if (idx >= e.rows * e.cols) {
      /* 最后一格再按 Tab：与 PowerPoint 一样自动追加一行 */
      PS.table.setCursor(e.rows - 1, e.cols - 1);
      endTextEdit();
      PS.table.insertRow('below');
      idx = (e.rows) * e.cols;
      e = M.findElement(S.curSlide(), editingTable ? editingTable.id : '');
      return true;
    }
    var nr = Math.floor(idx / e.cols), nc = idx % e.cols;
    endTextEdit(true);
    PS.table.setCursor(nr, nc);
    var td = fdoc.querySelector('.ps-el[data-id="' + e.id + '"] td[data-r="' + nr + '"][data-c="' + nc + '"]');
    if (!td) return false;
    editingNode = td; editingTable = e;
    editingSlideId = (S.curSlide() || {}).id; editingElId = e.id;
    /* 同 beginCellEdit：先挂 contenteditable，再 setEditing 触发重绘 */
    td.setAttribute('contenteditable', 'true');
    S.setEditing(e.id);
    td.focus();
    var rg = fdoc.createRange(); rg.selectNodeContents(td);
    var sel = frame.contentWindow.getSelection();
    sel.removeAllRanges(); sel.addRange(rg);
    return true;
  }

  function beginTextEdit(elId) {
    var slide = S.curSlide();
    if (!slide || !PS.flow.objectMode(slide) || !fdoc) return;
    var host = fdoc.querySelector('.ps-el[data-id="' + elId + '"] .ps-tx-in');
    if (!host) return;
    endTextEdit(true);
    editingNode = host;
    editingSlideId = (S.curSlide() || {}).id; editingElId = elId;
    /* 同 beginCellEdit：先挂 contenteditable 再 setEditing。
       画布文本框这条路因为 hasTxt() 已经为 true 才侥幸没暴露，顺序照样是错的，一并理顺。 */
    host.setAttribute('contenteditable', 'true');
    S.setEditing(elId);
    overlay.style.pointerEvents = 'none';
    host.focus();
    /* 光标放到末尾 */
    var r = fdoc.createRange(); r.selectNodeContents(host); r.collapse(false);
    var sel = frame.contentWindow.getSelection();
    sel.removeAllRanges(); sel.addRange(r);
  }

  /**
   * 编辑途中把模型上的样式就地刷到 DOM 上（位置、大小、旋转、透明度、
   * 文本框的字体字号颜色对齐等），但**不碰内容**，光标因此不会跳。
   * 这样在文本框里放着光标时改字号，画布是即时变的。
   */
  function syncEditingStyle() {
    if (!fdoc || !editingNode) return;
    /* 编辑节点可能已经从文档里掉出去（换页、重建 iframe），这时应当放弃编辑态，
       让下一轮 render 正常重写内容，而不是一直卡在"正在编辑"上 */
    if (!fdoc.contains(editingNode)) {
      editingNode = null; editingTable = null; S.state.editingId = null;
      return;
    }
    var slide = S.curSlide();
    if (!slide) return;
    var id = S.state.editingId;
    var e = id && id !== 'flow' ? M.findElement(slide, id) : null;
    if (!e) return;

    var host = fdoc.querySelector('.ps-el[data-id="' + e.id + '"]');
    if (!host) return;

    /* 外框：位置 / 大小 / 旋转 / 透明度 */
    var z = (slide.elements || []).indexOf(e);
    var want = R.posStyle(e, z < 0 ? null : z);
    if (host.getAttribute('style') !== want) host.setAttribute('style', want);

    /* 表格：整表样式（字号、内边距、边框、底纹）不影响单元格里的光标 */
    if (e.type === 'table' && PS.table) {
      U.$$('td[data-r]', host).forEach(function (td) {
        if (td === editingNode) {
          /* 正在编辑的那一格只更新样式，内容原样保留 */
          td.setAttribute('style', PS.table.cellStyle(e, +td.getAttribute('data-r'), +td.getAttribute('data-c')));
        } else {
          td.setAttribute('style', PS.table.cellStyle(e, +td.getAttribute('data-r'), +td.getAttribute('data-c')));
        }
      });
      return;
    }

    /* 文本：刷 .ps-tx 的排版样式 */
    if (e.text) {
      var tx = host.querySelector('.ps-tx');
      if (tx) {
        var ws = R.textStyle(e.text);
        if (tx.getAttribute('style') !== ws) tx.setAttribute('style', ws);
      }
    }
    /* 形状/图片的填充与描边也可能在编辑途中被改 */
    var fig = host.querySelector('.ps-fig');
    if (fig && fig.tagName !== 'svg') {
      var tmp = fdoc.createElement('div');
      tmp.innerHTML = R.elementHTML(e, z < 0 ? 0 : z);
      var newFig = tmp.querySelector('.ps-fig');
      if (newFig && newFig.tagName === fig.tagName && newFig.getAttribute('style') !== fig.getAttribute('style')) {
        fig.setAttribute('style', newFig.getAttribute('style') || '');
      }
    }
  }

  function syncEditingHTML() {
    if (!editingNode) return;
    /* 同样绑定到进入编辑时那一页。以前用 S.curSlide()，靠"元素 id 不跨页重复、
       findElement 返回 null"侥幸没写错页 —— 那是巧合不是保证，一并理顺。 */
    var slide = slideById(editingSlideId) || S.curSlide();
    var e = M.findElement(slide, editingId());
    if (!e || !e.text) return;
    var html = editingNode.innerHTML;
    if (html === e.text.html) return;
    e.text.html = html;
    /* 直接改模型但不重绘 DOM（sig 会随之改变，render 里靠 editingNode 判断跳过重写） */
    S.commit('编辑文本', { merge: 'inline-' + e.id });
  }

  /**
   * 内联富文本命令（加粗/上标/字号…）改完 DOM 之后，按当前编辑上下文写回模型。
   * 三种上下文的写回口子完全不同，用错了改动就只留在 DOM 上、不进撤销栈也不导出：
   * · 表格单元格 → syncCellHTML()（写 e.cells[r][c].html）
   * · 画布文本框 → syncEditingHTML()（写 e.text.html）
   * · 流式页      → commitFlowRaw()（整页写回 slide.raw）
   */
  function syncInlineEdit() { commitEditing(); }

  /**
   * ===== 退出文字编辑的**唯一出口** =====
   * 编辑态记在两个地方（store 的 editingId、canvas 的 editingNode），
   * 谁想清编辑态都必须走这里，否则两半会脱钩，症状是：覆盖层永远 pointer-events:none
   * （框再也拖不动）、contenteditable 留着（光标还在）、写回读到半个状态直接 bail
   * （之后敲的每个字被静默丢弃）。store.js 里两处裸的 `editingId = null` 已改为调用它。
   *
   * 顺序很重要：**先写回模型，再拆编辑态**。写回绑定的是进入编辑时捕获的那一页，
   * 所以即便调用方马上要切页，这次写回也一定落在正确的页上。
   */
  function exitEdit(opt) {
    opt = opt || {};
    if (exiting) return false;
    if (!editingNode) {
      /* 只剩 store 那半个残留状态时也要收干净 */
      if (S.state.editingId) { exiting = true; S.setEditing(null); exiting = false; }
      return false;
    }
    exiting = true;
    var node = editingNode;
    try {
      commitEditing();                       // 1) 先写回（绑定到 editingSlideId）
      node.removeAttribute('contenteditable');  // 2) 摘掉编辑痕迹
    } catch (err) {
      try { node.removeAttribute('contenteditable'); } catch (e2) {}
    }
    editingNode = null; editingTable = null; editingSlideId = null; editingElId = null;
    clearTimeout(flowTimer); flowTimer = null; flowOwnerId = null;
    exiting = false;
    S.setEditing(null);                      // 3) 清 store 那半
    S.history.breakMerge();
    /* 4) 覆盖层交还给对象层，否则选中框和控制柄摸不到 */
    var slide = S.curSlide();
    overlay.style.pointerEvents = (slide && PS.flow.objectMode(slide)) ? 'auto' : 'none';
    if (!opt.silent) render(); else drawOverlay();
    return true;
  }

  /** 按当前编辑上下文写回模型，一律绑定到进入编辑时捕获的那一页 */
  function commitEditing() {
    if (!editingNode) return;
    if (editingTable) { syncCellHTML(); return; }
    var own = slideById(editingSlideId) || S.curSlide();
    if (own && !PS.flow.objectMode(own)) { commitFlowNow(editingSlideId); return; }
    syncEditingHTML();
  }

  function endTextEdit(silent) { return exitEdit({ silent: silent }); }

  /* --------------------------------------------- iframe 内的事件处理 */
  function onFrameDown(e) {
    var slide = S.curSlide();
    if (!slide) return;
    if (slide.mode === 'flow') {
      var t = e.target.closest ? e.target.closest('[data-ps-edit]') : null;
      if (t) {
        if (editingNode && editingNode !== t) endFlowEdit();
        if (!t.getAttribute('contenteditable')) {
          t.setAttribute('contenteditable', 'true');
          editingNode = t;
          editingSlideId = (S.curSlide() || {}).id; editingElId = 'flow';
          S.setEditing('flow');
        }
        return;
      }
      endFlowEdit();
      return;
    }
    /* canvas 页正在内联编辑时，点到别处就收工。
       关键：这一下点击要顺带完成选中，不能只用来"退出编辑"——
       否则用户得点两次才选得中东西，手感上就是"点不动"。 */
    if (editingNode && !editingNode.contains(e.target)) {
      endTextEdit();
      overlay.style.pointerEvents = 'auto';
      /* 注意：这个事件来自 iframe 内部，clientX/Y 已经是**设计坐标**了
         （iframe 本身就是 1280×720、内部不缩放），再套一次父文档的
         toDesign 会把坐标算错，于是这一下点击谁也选不中。 */
      var target = PS.select.hitTest(e.clientX, e.clientY);
      if (target) S.selectElements([target.id]);
      else S.clearElSelection();
    }
  }

  function onFrameDblClick(e) {
    var slide = S.curSlide();
    if (slide && PS.flow.objectMode(slide) && !editingNode) {
      var el = e.target.closest ? e.target.closest('.ps-el') : null;
      if (el) beginTextEdit(el.getAttribute('data-id'));
    }
  }

  function onFrameInput() {
    var slide = S.curSlide();
    if (!slide) return;
    if (editingTable) syncCellHTML();
    else if (PS.flow.objectMode(slide)) syncEditingHTML();
    else scheduleFlowCommit();
  }

  var flowTimer = null;
  var flowOwnerId = null;     // 待写回的那批改动属于哪一页

  /** 立刻把流式页 DOM 写回**指定的那一页**（不是"当前页"） */
  function commitFlowNow(ownerId) {
    var sec = fdoc && fdoc.querySelector('section.slide');
    if (!sec) return false;
    var own = slideById(ownerId);
    if (!own) return false;
    var ok = PS.text.commitFlowRaw(sec, null, own);
    /* 只有确实写进了这一页，签名才跟着更新；写回被归属校验挡下时不能动签名 */
    if (ok) sec.setAttribute('data-ps-sig', sig(own));
    return ok;
  }

  function scheduleFlowCommit() {
    clearTimeout(flowTimer);
    flowOwnerId = editingSlideId || (S.curSlide() && S.curSlide().id);
    var owner = flowOwnerId;
    flowTimer = setTimeout(function () {
      flowTimer = null;
      commitFlowNow(owner);      // 用排期那一刻捕获的页，不看现在是第几页
    }, 420);
  }

  /**
   * 把挂起的写回**同步执行掉**。切页之前必须调一次：
   * 单纯 clearTimeout 会把用户最后 420ms 内的编辑丢掉，
   * 而放着不管则会在切页之后用旧页的 DOM 覆盖新页的 raw（数据丢失）。
   */
  function flushPendingEdits() {
    var did = false;
    if (flowTimer) { clearTimeout(flowTimer); flowTimer = null; did = commitFlowNow(flowOwnerId) || did; }
    /* 还在编辑中的内容也要落袋，否则切页就丢 */
    if (editingNode) { commitEditing(); did = true; }
    flowOwnerId = null;
    return did;
  }

  function endFlowEdit() { return exitEdit({ silent: true }); }

  function onFrameBlur() {
    var slide = S.curSlide();
    if (slide && slide.mode === 'flow') scheduleFlowCommit();
  }

  function onFrameKey(e) {
    if (e.key === 'Tab' && editingTable) {
      e.preventDefault();
      moveCell(e.shiftKey);
      return;
    }
    if (e.key === 'Escape') {
      var slide = S.curSlide();
      if (slide && slide.mode === 'flow') endFlowEdit(); else { endTextEdit(); overlay.style.pointerEvents = 'auto'; }
      e.preventDefault();
      return;
    }
    /* iframe 里按快捷键要转发给主文档，否则 Ctrl+S / Ctrl+Z 在编辑时失灵 */
    if (U.ctrlKey(e) && 'szyxcvab'.indexOf(e.key.toLowerCase()) >= 0) {
      var slide2 = S.curSlide();
      if (slide2 && slide2.mode === 'canvas' && 'bi'.indexOf(e.key.toLowerCase()) >= 0) return;
      var ev = new KeyboardEvent('keydown', {
        key: e.key, code: e.code, ctrlKey: e.ctrlKey, metaKey: e.metaKey,
        shiftKey: e.shiftKey, altKey: e.altKey, bubbles: true, cancelable: true
      });
      if (!document.dispatchEvent(ev)) e.preventDefault();
    }
  }

  /* ---------------------------------------------------------- 右键菜单 */
  function onContextMenu(e) {
    e.preventDefault();
    var slide = S.curSlide();
    if (!slide) return;
    var pt = toDesign(e.clientX, e.clientY);
    var hit = PS.flow.objectMode(slide) ? PS.select.hitTest(pt.x, pt.y) : null;
    if (hit && S.sel.elIds.indexOf(hit.id) < 0) S.selectElements([hit.id]);
    var anchor = { getBoundingClientRect: function () { return { left: e.clientX, top: e.clientY, right: e.clientX, bottom: e.clientY, width: 0, height: 0 }; }, contains: function () { return false; } };

    var items;
    if (hit) {
      items = [
        { label: '剪切', icon: 'cut', key: 'Ctrl+X', on: PS.select.cut },
        { label: '复制', icon: 'copy', key: 'Ctrl+C', on: PS.select.copy },
        { label: '粘贴', icon: 'paste', key: 'Ctrl+V', on: PS.select.paste },
        { sep: 1 },
        { label: '编辑文字', icon: 'textbox', on: function () { beginTextEdit(hit.id); } },
        { label: '置于顶层', icon: 'front', on: function () { PS.arrange.reorder('front'); } },
        { label: '置于底层', icon: 'back', on: function () { PS.arrange.reorder('back'); } },
        { sep: 1 },
        { label: '组合', icon: 'group', on: PS.arrange.group },
        { label: '取消组合', icon: 'ungroup', on: PS.arrange.ungroup },
        { label: hit.locked ? '解除锁定' : '锁定', icon: 'lock', on: PS.arrange.toggleLock },
        { sep: 1 },
        { label: '设置形状格式…', icon: 'fill', on: function () { PS.panel.open('fill'); } },
        { label: '删除', icon: 'del', key: 'Delete', danger: true, on: PS.select.remove }
      ];
    } else {
      items = [
        { label: '粘贴', icon: 'paste', key: 'Ctrl+V', on: PS.select.paste },
        { sep: 1 },
        { label: '新建幻灯片', icon: 'newslide', key: 'Ctrl+M', on: function () { PS.thumbs.addSlide(); } },
        { label: '设置背景格式…', icon: 'background', on: function () { PS.panel.open('background'); } },
        { sep: 1 },
        { label: S.view.showGrid ? '隐藏网格线' : '显示网格线', icon: 'grid', on: function () { S.setView({ showGrid: !S.view.showGrid }); } },
        { label: S.view.showRuler ? '隐藏标尺' : '显示标尺', icon: 'ruler', on: function () { S.setView({ showRuler: !S.view.showRuler }); } }
      ];
    }
    PS.ui.menu(anchor, items, { point: { x: e.clientX, y: e.clientY } });
  }

  return {
    init: init, render: render, drawOverlay: drawOverlay,
    setZoom: setZoom, fit: fit, getZoom: getZoom, toDesign: toDesign,
    beginTextEdit: beginTextEdit, endTextEdit: endTextEdit, endFlowEdit: endFlowEdit,
    beginCellEdit: beginCellEdit, moveCell: moveCell,
    syncEditingHTML: syncEditingHTML, syncEditingStyle: syncEditingStyle, syncInlineEdit: syncInlineEdit,
    exitEdit: exitEdit, flushPendingEdits: flushPendingEdits,
    get frameDoc() { return fdoc; },
    get editing() { return !!editingNode; },
    get editingSlide() { return editingSlideId; }
  };
})();

</script>
<script>
/* ===== inlined: js/ui/thumbs.js ===== */
/* ===========================================================================
   HTML PPT Editor :: ui/thumbs.js
   左侧幻灯片窗格：缩略图、拖拽排序、右键菜单、增删改隐藏。

   缩略图同样用 iframe 渲染（和主画布同源同 CSS），所以缩略图里看到的就是真样子。
   为了 19 页也不卡，采用 IntersectionObserver 懒加载：滚到视口里才真正写内容。
   =========================================================================== */
var PS = window.PS || (window.PS = {});

PS.thumbs = (function () {
  'use strict';
  var U = PS.util, M = PS.model, S = PS.store, R = PS.render;

  var host, footEl, io = null;
  var nodes = {};      // slideId -> {row, frame, sig}

  function init() {
    host = document.getElementById('thumbs');
    footEl = document.getElementById('thumbs-foot');
    host.addEventListener('contextmenu', onContext);
    io = new IntersectionObserver(function (list) {
      list.forEach(function (en) {
        if (en.isIntersecting) paint(en.target.getAttribute('data-sid'));
      });
    }, { root: host, rootMargin: '260px' });

    S.on('deck', rebuild);
    S.on('slides', rebuild);
    S.on('slide', function () { paint(S.sel.slideId, true); });
    S.on('select', highlight);
  }

  function css() {
    var d = S.deck;
    return (d.css || (PS.template ? PS.template.css : '')) +
      '\n' + PS.serializer.themeOverrideCSS(d) + '\n' + R.CANVAS_CSS +
      /* 同画布：不给 html/body 高度，外来 deck 的页面会塌成 0 高，缩略图全黑 */
      '\nhtml,body{height:100%!important;margin:0!important;overflow:hidden!important}' +
      '\n.deck{width:100%;height:100%}' +
      '\n.slide{transition:none!important;animation:none!important;opacity:1!important;transform:none!important}' +
      '\n';
  }

  function rebuild() {
    if (!S.deck) { host.innerHTML = ''; nodes = {}; foot(); return; }
    host.innerHTML = '';
    nodes = {};
    var groups = PS.sections.list();
    var multi = groups.length > 1 || groups.some(function (g) { return g.slides[0].slide.section != null; });
    groups.forEach(function (g) {
      if (multi) host.appendChild(sectionHead(g));
      if (multi && PS.sections.isCollapsed(g.name)) return;   // 折叠的节不渲染缩略图
      g.slides.forEach(function (x) { host.appendChild(row(x.slide, x.index)); });
    });
    highlight();
    foot();
  }

  /** 节标题行：折叠箭头 + 名称 + 页数，右键出节菜单 */
  function sectionHead(g) {
    var col = PS.sections.isCollapsed(g.name);
    var n = U.el('div', { class: 'sec-head' + (col ? ' collapsed' : '') });
    n.innerHTML = '<span class="ar">' + PS.icon('caret') + '</span>' +
      '<span class="nm">' + U.escHTML(g.name) + '</span>' +
      '<span class="ct">' + g.slides.length + '</span>';
    n.addEventListener('click', function () { PS.sections.toggle(g.name); });
    n.addEventListener('contextmenu', function (e) {
      e.preventDefault(); e.stopPropagation();
      var anchor = {
        __point: { x: e.clientX, y: e.clientY },
        getBoundingClientRect: function () { return { left: e.clientX, top: e.clientY, right: e.clientX, bottom: e.clientY, width: 0, height: 0 }; },
        contains: function () { return false; }
      };
      PS.sections.menu(anchor, g.name);
    });
    return n;
  }

  function row(slide, i) {
    var r = U.el('div', { class: 'thumb', 'data-sid': slide.id, draggable: 'true' });
    r.innerHTML =
      '<div class="n">' + (i + 1) + '</div>' +
      '<div class="box">' +
      '<div class="flag">' + (slide.mode === 'flow' ? '<i title="流式组件页">流</i>' : '') + (slide.hidden ? '<i title="放映时跳过">隐</i>' : '') + '</div>' +
      '</div>';
    if (slide.hidden) r.classList.add('hidden-slide');
    if (slide.title) {
      var lbl = U.el('div', { class: 'lbl', text: slide.title });
      r.querySelector('.box').appendChild(lbl);
    }
    r.addEventListener('mousedown', function (e) {
      if (e.button === 2) return;
      if (e.shiftKey && S.sel.slideId) selectRange(slide.id);
      else S.selectSlide(slide.id);
    });
    r.addEventListener('dragstart', onDragStart);
    r.addEventListener('dragover', onDragOver);
    r.addEventListener('dragleave', onDragLeave);
    r.addEventListener('drop', onDrop);
    r.addEventListener('dragend', onDragEnd);
    nodes[slide.id] = { row: r, frame: null, sig: null };
    io.observe(r);
    return r;
  }

  /** 真正把内容写进缩略图 iframe */
  function paint(sid, force) {
    var n = nodes[sid];
    if (!n || !S.deck) return;
    var slide = M.findSlide(S.deck, sid);
    if (!slide) return;
    var s = sigOf(slide);
    if (!force && n.sig === s) return;

    var box = n.row.querySelector('.box');
    var W = S.deck.size.w, H = S.deck.size.h;
    if (!n.frame) {
      n.frame = U.el('iframe', { scrolling: 'no', tabindex: '-1' });
      n.frame.style.width = W + 'px';
      n.frame.style.height = H + 'px';
      n.frame.style.transformOrigin = '0 0';
      box.insertBefore(n.frame, box.firstChild);
      requestAnimationFrame(function () { scaleFrame(n, W, H); });
    }
    scaleFrame(n, W, H);
    var d = n.frame.contentDocument;
    d.open();
    d.write('<!DOCTYPE html><html><head><meta charset="utf-8"><style>' + css() + '</style></head><body>' +
      '<div class="deck"><section class="' + (slide.classes || ['slide']).join(' ') + ' is-active"' +
      (slide.mode === 'canvas' ? ' data-mode="canvas"' : '') + '>' +
      (slide.mode === 'canvas' ? R.canvasHTML(slide, S.deck) : (slide.raw || '')) +
      '</section></div></body></html>');
    d.close();
    if (slide.mode === 'canvas') {
      var c = d.querySelector('.ps-canvas');
      if (c) c.style.setProperty('--ps-k', 1);
    }
    n.sig = s;
  }

  function scaleFrame(n, W, H) {
    var box = n.row.querySelector('.box');
    var k = box.clientWidth / W;
    if (!k) return;
    n.frame.style.transform = 'scale(' + k + ')';
    n.frame.style.width = W + 'px';
    n.frame.style.height = H + 'px';
  }

  function sigOf(slide) {
    return slide.mode + '|' + (slide.hidden ? 1 : 0) + '|' +
      (slide.mode === 'canvas' ? JSON.stringify(slide.elements || []) : (slide.raw || '')).length + '|' +
      hash(slide.mode === 'canvas' ? JSON.stringify(slide.elements || []) : (slide.raw || ''));
  }
  function hash(s) {
    var h = 5381, i = s.length;
    while (i) h = (h * 33 ^ s.charCodeAt(--i)) >>> 0;
    return h.toString(36);
  }

  function highlight() {
    Object.keys(nodes).forEach(function (id) {
      nodes[id].row.classList.toggle('on', id === S.sel.slideId);
    });
    var n = nodes[S.sel.slideId];
    if (n && n.row.scrollIntoView) {
      var r = n.row.getBoundingClientRect(), hr = host.getBoundingClientRect();
      if (r.top < hr.top || r.bottom > hr.bottom) n.row.scrollIntoView({ block: 'nearest' });
    }
    foot();
  }

  function foot() {
    if (!footEl) return;
    if (!S.deck) { footEl.textContent = ''; return; }
    var i = S.curIndex();
    footEl.innerHTML = '共 ' + S.deck.slides.length + ' 张' +
      (i >= 0 ? ' · 当前第 ' + (i + 1) + ' 张' : '');
  }

  function selectRange(toId) {
    var a = S.curIndex(), b = M.slideIndex(S.deck, toId);
    S.selectSlide(toId);
  }

  /* ------------------------------------------------------------ 拖拽排序 */
  var dragId = null;
  function onDragStart(e) {
    dragId = this.getAttribute('data-sid');
    this.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', dragId); } catch (err) {}
  }
  function onDragOver(e) {
    if (!dragId) return;
    e.preventDefault();
    var r = this.getBoundingClientRect();
    var after = (e.clientY - r.top) > r.height / 2;
    this.classList.toggle('drop-after', after);
    this.classList.toggle('drop-before', !after);
  }
  function onDragLeave() { this.classList.remove('drop-after', 'drop-before'); }
  function onDrop(e) {
    e.preventDefault();
    if (!dragId) return;
    var after = this.classList.contains('drop-after');
    this.classList.remove('drop-after', 'drop-before');
    var toId = this.getAttribute('data-sid');
    if (toId === dragId) return;
    var list = S.deck.slides;
    var from = M.slideIndex(S.deck, dragId);
    var s = list.splice(from, 1)[0];
    var to = M.slideIndex(S.deck, toId);
    list.splice(after ? to + 1 : to, 0, s);
    S.commit('移动幻灯片', { scope: 'slides' });
  }
  function onDragEnd() {
    this.classList.remove('dragging');
    U.$$('.thumb', host).forEach(function (n) { n.classList.remove('drop-after', 'drop-before'); });
    dragId = null;
  }

  /* -------------------------------------------------------------- 命令 */
  function addSlide(opt) {
    opt = opt || {};
    var deck = S.deck; if (!deck) return;
    var s = M.newSlide({ title: opt.title || '', mode: opt.mode || 'canvas', layout: opt.layout || 'blank' });
    if (opt.layout && opt.layout !== 'blank') applyLayout(s, opt.layout);
    var at = S.curIndex() + 1;
    deck.slides.splice(at, 0, s);
    S.sel.slideId = s.id; S.sel.elIds = [];
    S.commit('新建幻灯片', { scope: 'slides' });
    return s;
  }

  /* 版式全部由默认模板提供（feature/template-default.js），这里只做转发。
     deck 可显式传入：新建文档时它还没进 store。 */
  var LAYOUTS = PS.templates.LAYOUTS.map(function (l) { return { key: l.key, name: l.name }; });
  function applyLayout(s, key, deck) {
    return PS.templates.apply(s, key, deck || S.deck);
  }

  function deleteSlide() {
    var deck = S.deck; if (!deck) return;
    if (deck.slides.length <= 1) { PS.ui.toast('至少要保留一张幻灯片', 'warn'); return; }
    var i = S.curIndex();
    deck.slides.splice(i, 1);
    var next = deck.slides[Math.min(i, deck.slides.length - 1)];
    S.sel.slideId = next.id; S.sel.elIds = [];
    S.commit('删除幻灯片', { scope: 'slides' });
  }

  function toggleHidden() {
    var s = S.curSlide(); if (!s) return;
    s.hidden = !s.hidden;
    S.commit(s.hidden ? '隐藏幻灯片' : '取消隐藏', { scope: 'slides' });
  }

  function move(dir) {
    var deck = S.deck, i = S.curIndex();

   */
  function gate(fn, items) {

<script>
/* ===== inlined: js/ui/ribbon.js ===== */
/* ===========================================================================
   HTML PPT Editor :: ui/ribbon.js
   功能区渲染器 + 各下拉菜单。内容来自 ribbon-spec.js，这里只管画和联动状态。
   =========================================================================== */
var PS = window.PS || (window.PS = {});

PS.ribbon = (function () {
  'use strict';
  var U = PS.util, M = PS.model, S = PS.store;

  var tabsEl, bodyEl, qatEl;
  var active = 'home';
  var refreshers = [];

  /* ------------------------------------------------------------ 初始化 */
  function init() {
    tabsEl = document.getElementById('ribbon-tabs');
    bodyEl = document.getElementById('ribbon');
    qatEl = document.getElementById('qat');
    buildQAT();
    buildTabs();
    build();
    /* 功能区放不下时可以横向滚动，但光能滚没用 —— 用户得知道"右边还有东西"。
       所以：竖滚轮直接转成横滚，两端加渐隐遮罩作为可滚动的提示。 */
    bodyEl.addEventListener('wheel', function (e) {
      if (e.deltaY === 0 || e.shiftKey) return;
      if (bodyEl.scrollWidth <= bodyEl.clientWidth) return;
      e.preventDefault();
      bodyEl.scrollLeft += e.deltaY;
      paintScrollHints();
    }, { passive: false });
    bodyEl.addEventListener('scroll', paintScrollHints);
    window.addEventListener('resize', paintScrollHints);
    S.on('select', function () { buildTabs(); refresh(); });
    S.on('slide', refresh);
    S.on('deck', function () { buildTabs(); build(); });
    S.on('view', refresh);
    S.history.onChange(refreshQAT);
  }

  /* --------------------------------------------------- 快速访问工具栏 */
  var qatRefresh = [];
  function buildQAT() {
    qatEl.innerHTML = '';
    qatRefresh = [];
    [
      { icon: 'save', title: '保存 (Ctrl+S)', cmd: function () { PS.exportHTML.save(); } },
      { icon: 'undo', title: '撤销 (Ctrl+Z)', cmd: function () { S.undo(); }, enabled: function () { return S.history.canUndo(); }, tip: function () { return S.history.undoLabel(); } },
      { icon: 'redo', title: '恢复 (Ctrl+Y)', cmd: function () { S.redo(); }, enabled: function () { return S.history.canRedo(); }, tip: function () { return S.history.redoLabel(); } },
      { sep: 1 },
      { icon: 'show', title: '从头开始放映 (F5)', cmd: function () { PS.slideshow.start(0); } }
    ].forEach(function (it) {
      if (it.sep) { qatEl.appendChild(U.el('span', { class: 'sep' })); return; }
      var b = U.el('button', { type: 'button', title: it.title, html: PS.icon(it.icon) });
      b.addEventListener('click', it.cmd);
      qatEl.appendChild(b);
      if (it.enabled) qatRefresh.push(function () {
        b.disabled = !it.enabled();
        var t = it.tip && it.tip();
        b.title = it.title + (t ? '：' + t : '');
      });
    });
    refreshQAT();
  }
  function refreshQAT() { qatRefresh.forEach(function (f) { f(); }); }

  /* ------------------------------------------------------------ 选项卡 */
  function allTabs() {
    var ctx = PS.ribbonSpec.CONTEXT.filter(function (c) { return c.when(); });
    return PS.ribbonSpec.TABS.concat(ctx);
  }
  function buildTabs() {
    if (!tabsEl) return;
    var list = allTabs();
    tabsEl.innerHTML = '';
    list.forEach(function (t) {
      var b = U.el('button', { type: 'button', class: (t.key === active ? 'on ' : '') + (t.label ? 'ctx' : '') });
      b.innerHTML = (t.label ? '<span class="ctx-label">' + U.escHTML(t.label) + '</span>' : '') + U.escHTML(t.name);
      b.addEventListener('click', function () { active = t.key; buildTabs(); build(); });
      b.addEventListener('dblclick', function () { bodyEl.classList.toggle('collapsed'); });
      tabsEl.appendChild(b);
    });
    if (!list.some(function (t) { return t.key === active; })) { active = 'home'; }
  }

  /* -------------------------------------------------------- 功能区主体 */
  function build() {
    if (!bodyEl) return;
    refreshers = [];
    bodyEl.innerHTML = '';
    var tab = allTabs().filter(function (t) { return t.key === active; })[0];
    if (!tab) return;
    tab.groups.forEach(function (g) {
      var box = U.el('div', { class: 'rb-group' });
      var items = U.el('div', { class: 'rb-items' });
      g.items.forEach(function (it) { var n = ctrl(it); if (n) items.appendChild(n); });
      box.appendChild(items);
      box.appendChild(U.el('div', { class: 'rb-name', text: g.name }));
      bodyEl.appendChild(box);
    });
    refresh();
  }

  function refresh() { refreshers.forEach(function (f) { try { f(); } catch (e) {} }); refreshQAT(); paintScrollHints(); }

  /** 两端渐隐提示：告诉用户功能区还能往哪边滚 */
  function paintScrollHints() {
    if (!bodyEl) return;
    var canL = bodyEl.scrollLeft > 2;
    var canR = bodyEl.scrollLeft + bodyEl.clientWidth < bodyEl.scrollWidth - 2;
    bodyEl.classList.toggle('can-scroll-l', canL);
    bodyEl.classList.toggle('can-scroll-r', canR);
  }

  function bindState(node, it) {
    if (!it.enabled && !it.active) return;
    refreshers.push(function () {
      if (it.enabled) node.disabled = !it.enabled();
      if (it.active) node.classList.toggle('on', !!it.active());
    });
  }

  function ctrl(it) {
    switch (it.t) {
      case 'big': return bigBtn(it);
      case 'sm': return smBtn(it);
      case 'ico': return icoBtn(it);
      case 'color': return colorBtn(it);
      case 'check': return checkBtn(it);
      case 'select': return selectCtrl(it);
      case 'combo': return comboCtrl(it);
      case 'numrow': return numRow(it);
      case 'col': return wrap('rb-col', it.items);
      case 'row': return wrap('rb-row', it.items);
      case 'note': return U.el('div', { class: 'f-hint', style: { maxWidth: '520px', padding: '4px 8px', whiteSpace: 'normal' }, html: it.html });
      case 'themes': return themeGallery();
      case 'quickstyles': return quickStyles();
      case 'tablestyles': return tableStyles();
      case 'charttypes': return chartTypes();
      case 'chartcolors': return chartColors();
      case 'transitions': return transitionGallery();
      default: return null;
    }
  }
  function wrap(cls, items) {
    var n = U.el('div', { class: cls });
    (items || []).forEach(function (it) { var c = ctrl(it); if (c) n.appendChild(c); });
    return n;
  }

  function bigBtn(it) {
    var b = U.el('button', { type: 'button', class: 'rb-big' + (it.label && it.label.length > 4 ? ' wide' : ''), title: (it.label || '').replace('\n', '') + (it.key ? ' (' + it.key + ')' : '') });
    b.innerHTML = '<span class="ico">' + PS.icon(it.icon) + '</span><span class="cap">' + U.escHTML(it.label || '').replace('\n', '<br>') + '</span>' +
      (it.menu ? '<span class="rb-caret">' + PS.icon('caret') + '</span>' : '');
    b.addEventListener('click', function () { it.menu ? it.menu(b) : it.cmd && it.cmd(); });
    bindState(b, it);
    return b;
  }
  function smBtn(it) {
    var b = U.el('button', { type: 'button', class: 'rb-sm', title: (it.label || '') + (it.key ? ' (' + it.key + ')' : '') });
    b.innerHTML = PS.icon(it.icon) + '<span>' + U.escHTML(it.label || '') + '</span>' + (it.menu ? '<span class="rb-caret">' + PS.icon('caret') + '</span>' : '');
    b.addEventListener('click', function () { it.menu ? it.menu(b) : it.cmd && it.cmd(); });
    bindState(b, it);
    return b;
  }
  function icoBtn(it) {
    var b = U.el('button', { type: 'button', class: 'rb-ico', title: it.title || it.label || '' });
    b.innerHTML = PS.icon(it.icon);
    b.addEventListener('click', function () { it.menu ? it.menu(b) : it.cmd && it.cmd(); });
    bindState(b, it);
    return b;
  }
  function checkBtn(it) {
    var b = U.el('button', { type: 'button', class: 'rb-sm', title: it.label });
    function paint() {
      var on = it.get();
      b.classList.toggle('on', !!on);
      b.innerHTML = PS.icon(on ? 'check' : it.icon) + '<span>' + U.escHTML(it.label) + '</span>';
    }
    b.addEventListener('click', function () { it.on(!it.get()); paint(); });
    refreshers.push(paint);
    paint();
    return b;
  }
  function colorBtn(it) {
    var b = U.el('button', { type: 'button', class: 'rb-' + (it.label ? 'sm' : 'ico') + ' rb-color', title: it.title || it.label || '' });
    function paint() {
      var c = it.color();
      var resolved = c == null ? 'transparent' : M.resolveColor(c, S.deck ? S.deck.theme : M.DEFAULT_THEME);
      b.innerHTML = PS.icon(it.icon) + (it.label ? '<span>' + U.escHTML(it.label) + '</span>' : '') +
        '<span class="rb-caret">' + PS.icon('caret') + '</span><span class="bar" style="background:' + resolved + '"></span>';
    }
    b.addEventListener('click', function () {
      PS.ui.colorPicker(b, it.color(), function (v) { it.on(v); paint(); }, { allowNone: it.allowNone });
    });
    refreshers.push(paint);
    if (it.enabled) refreshers.push(function () { b.disabled = !it.enabled(); });
    paint();
    return b;
  }
  function selectCtrl(it) {
    var s = U.el('select', { class: 'rb-select ' + (it.cls || '') });
    if (it.width) s.style.width = it.width;
    it.options.forEach(function (o) { s.appendChild(U.el('option', { value: o.v, text: o.t })); });
    function paint() {
      var v = it.value();
      if (!it.options.some(function (o) { return String(o.v) === String(v); })) {
        var extra = s.querySelector('option[data-extra]');
        if (!extra) { extra = U.el('option', { 'data-extra': '1' }); s.insertBefore(extra, s.firstChild); }
        extra.value = v; extra.textContent = v;
      }
      s.value = v;
      if (it.enabled) s.disabled = !it.enabled();
    }
    s.addEventListener('change', function () { it.on(s.value); });
    refreshers.push(paint);
    paint();
    return s;
  }
  /**
   * 可输入的组合框：input（手输 / ↑↓ 步进）+ 自绘下拉按钮（预设值列表）。
   *
   * 为什么不用死的 <select>：赋一个列表里没有的值（比如字号 26），
   * value 会变成空串，change 里 parseFloat('') 得到 NaN，然后静默落回默认值，
   * 表现就是"字号怎么改都改不动"。所以凡是本该允许任意数值的地方都用这个。
   *
   * 为什么不用 <input list=datalist>：Chrome 对它**不渲染任何下拉指示器**，
   * 唯一的键盘入口 Alt+↓ 又和这里的"步进"手势撞车，结果 25 个预设值在界面上
   * 一个都点不出来。所以右边自己画一个 caret 按钮，点了走 PS.ui.menu，
   * 与同排「字体」<select> 的观感一致。
   */
  function comboCtrl(it) {
    var wrap = U.el('span', { class: 'rb-combo ' + (it.cls || '') });
    var inp = U.el('input', { class: 'rb-num', type: 'text', inputmode: 'decimal', title: it.title || '' });
    if (it.width) inp.style.width = it.width;
    var caret = U.el('button', {
      type: 'button', class: 'rb-combo-caret',
      title: (it.title || '') + '（点击选择预设值）',
      html: PS.icon('caret')
    });

    function commit() {
      var v = parseFloat(String(inp.value).replace(/[^\d.\-]/g, ''));
      if (isNaN(v)) { paint(true); return; }     // 输入无效就还原，绝不悄悄改成别的值
      it.on(v);
      /* 强制回显模型里的真实值：命令没生效时（比如没选中对象），
         界面不能把用户敲的那个数字留在框里假装成功了。 */
      paint(true);
    }
    function openList() {
      if (inp.disabled) return;
      var cur = String(it.value());
      PS.ui.menu(wrap, it.options.map(function (o) {
        return {
          label: String(o.t == null ? o.v : o.t),
          checked: String(o.v) === cur,
          on: function () { inp.value = o.v; commit(); }
        };
      }), { align: 'left' });
    }
    caret.addEventListener('click', openList);
    inp.addEventListener('change', commit);
    inp.addEventListener('blur', commit);
    inp.addEventListener('keydown', function (e) {
      e.stopPropagation();
      if (e.key === 'Enter') { commit(); inp.blur(); }
      else if (e.key === 'Escape') { paint(true); inp.blur(); }
      else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {

        if (e.altKey) { e.preventDefault(); openList(); return; }
        e.preventDefault();
        var cur = parseFloat(inp.value) || 0;

    function paint(force) { if (force || document.activeElement !== inp) inp.value = it.value(); }
    refreshers.push(function () {
      if (it.enabled) { var ok = !!it.enabled(); inp.disabled = !ok; caret.disabled = !ok; }
      paint();
    });
    if (it.enabled) { var ok0 = !!it.enabled(); inp.disabled = !ok0; caret.disabled = !ok0; }
    paint();
    wrap.appendChild(inp); wrap.appendChild(caret);
    return wrap;
  }

  function numRow(it) {
    var box = U.el('div', { class: 'rb-row' });
    box.appendChild(U.el('span', { text: it.label, style: { fontSize: '11px', width: '14px' } }));
    var i = U.el('input', { class: 'rb-num', type: 'number' });
    i.addEventListener('change', function () { it.on(parseFloat(i.value)); });
    i.addEventListener('keydown', function (e) { e.stopPropagation(); });
    refreshers.push(function () { if (document.activeElement !== i) i.value = U.round(it.get(), 1); });
    box.appendChild(i);
    box.appendChild(U.el('span', { text: 'px', style: { fontSize: '10px', color: 'var(--ui-ink-3)' } }));
    return box;
  }

  /* ------------------------------------------------------------ 主题库 */
  var PRESETS = [
    { name: '默认蓝', t: {} },
    { name: '沉稳藏青', t: { '--ps-accent': '#1F4E79', '--ps-accent-strong': '#15385A', '--ps-accent-mid': '#2E6DA4', '--ps-accent-soft': '#BBD4E8', '--ps-accent-wash': '#F0F5FA', '--ps-accent-deep': '#0C2033' } },
    { name: '克制墨绿', t: { '--ps-accent': '#1F6F5C', '--ps-accent-strong': '#155245', '--ps-accent-mid': '#2E8F78', '--ps-accent-soft': '#BFE0D6', '--ps-accent-wash': '#EFF7F4', '--ps-accent-deep': '#0B2E26' } },
    { name: '稳重砖红', t: { '--ps-accent': '#9E2B25', '--ps-accent-strong': '#7A1F1A', '--ps-accent-mid': '#C0453E', '--ps-accent-soft': '#EBC7C4', '--ps-accent-wash': '#FBF1F0', '--ps-accent-deep': '#4A100D' } },
    { name: '典雅深紫', t: { '--ps-accent': '#5B3E96', '--ps-accent-strong': '#432D73', '--ps-accent-mid': '#7A5FB8', '--ps-accent-soft': '#D5C9EC', '--ps-accent-wash': '#F5F2FC', '--ps-accent-deep': '#251642' } },
    { name: '金融金褐', t: { '--ps-accent': '#8A6212', '--ps-accent-strong': '#66470B', '--ps-accent-mid': '#B08228', '--ps-accent-soft': '#E8D6A8', '--ps-accent-wash': '#FBF6E9', '--ps-accent-deep': '#3B2905' } },
    { name: '中性石墨', t: { '--ps-accent': '#3F4550', '--ps-accent-strong': '#2A2F37', '--ps-accent-mid': '#5C6472', '--ps-accent-soft': '#CBD0D8', '--ps-accent-wash': '#F4F5F7', '--ps-accent-deep': '#171A1F' } }
  ];

  function themeGallery() {
    var box = U.el('div', { class: 'rb-row', style: { gap: '4px' } });
    PRESETS.forEach(function (p) {
      var b = U.el('button', {
        type: 'button', class: 'rb-big', title: p.name,
        style: { width: '58px', minHeight: '62px', padding: '3px' }
      });
      var t = U.assign({}, M.DEFAULT_THEME, p.t);
      b.innerHTML =
        '<span style="display:block;width:100%;height:30px;border:1px solid var(--ui-line-2);border-radius:2px;overflow:hidden;background:' + t['--ps-canvas'] + '">' +
        '<span style="display:block;height:9px;background:' + t['--ps-accent-strong'] + '"></span>' +
        '<span style="display:flex;gap:2px;padding:3px">' +
        '<i style="flex:2;height:12px;background:' + t['--ps-accent'] + ';border-radius:1px"></i>' +
        '<i style="flex:1;height:12px;background:' + t['--ps-accent-mid'] + ';border-radius:1px"></i>' +
        '<i style="flex:1;height:12px;background:' + t['--ps-accent-soft'] + ';border-radius:1px"></i>' +
        '</span></span>' +
        '<span class="cap" style="font-size:9.5px">' + U.escHTML(p.name.replace('（默认）', '')) + '</span>';
      b.addEventListener('click', function () { PS.theme.applyPreset(p.t); });
      box.appendChild(b);
    });
    return box;
  }

  function quickStyles() {
    var box = U.el('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(5,1fr)', gap: '3px', width: '150px' } });
    PS.shape.QUICK.forEach(function (q, i) {
      var b = U.el('button', { type: 'button', title: q.name, style: { height: '28px', border: '1px solid var(--ui-line-2)', borderRadius: '3px', cursor: 'pointer' } });
      var theme = S.deck ? S.deck.theme : M.DEFAULT_THEME;
      b.style.background = q.fill ? M.resolveColor(q.fill, theme) : '#fff';
      if (!q.fill) b.style.borderColor = M.resolveColor(q.lineColor || 'theme:--ps-rule', theme);
      b.addEventListener('click', function () { PS.shape.applyQuick(i); });
      box.appendChild(b);
    });
    return box;
  }

  /* ---------------------------------------------------------- 切换效果库 */
  function transitionGallery() {
    var box = U.el('div', { class: 'rb-row', style: { gap: '4px' } });
    /* 功能区里只放常用几个 + 一个"更多"，完整效果库在弹面板里 */
    ['none', 'fade', 'push', 'wipe', 'zoom', 'flip'].forEach(function (k) {
      var t = PS.transition.byKey(k);
      var b = U.el('button', { type: 'button', class: 'rb-big', title: t.name, style: { width: '62px' } });
      b.innerHTML = '<span class="ico" style="height:26px">' +
        PS.transition.thumb(k).replace('<svg', '<svg style="width:44px;height:25px"') +
        '</span><span class="cap">' + U.escHTML(t.name) + '</span>';
      b.addEventListener('click', function () { PS.transition.set({ type: k }); });
      refreshers.push(function () { b.classList.toggle('on', PS.transition.current().type === k); });
      box.appendChild(b);
    });
    var more = U.el('button', { type: 'button', class: 'rb-big', title: '全部切换效果', style: { width: '54px' } });
    more.innerHTML = '<span class="ico">' + PS.icon('more') + '</span><span class="cap">更多</span>';
    more.addEventListener('click', function () { PS.transition.gallery(more); });
    box.appendChild(more);
    return box;
  }

  /* ---------------------------------------------------------- 表格样式库 */
  function tableStyles() {
    var box = U.el('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: '4px', width: '196px' } });
    PS.table.STYLES.forEach(function (st) {
      var b = U.el('button', { type: 'button', title: st.name, style: { padding: '0', border: '1px solid var(--ui-line-2)', borderRadius: '3px', overflow: 'hidden', background: '#fff', cursor: 'pointer' } });
      var theme = S.deck ? S.deck.theme : M.DEFAULT_THEME;
      function c(v) { return v ? M.resolveColor(v, theme) : 'transparent'; }
      b.innerHTML =
        '<span style="display:block;height:9px;background:' + c(st.header) + ';border-bottom:1px solid ' + c(st.border) + '"></span>' +
        '<span style="display:block;height:7px;background:' + c(st.body) + '"></span>' +
        '<span style="display:block;height:7px;background:' + c(st.band || st.body) + '"></span>' +
        '<span style="display:block;height:7px;background:' + c(st.body) + '"></span>';
      b.addEventListener('click', function () { PS.table.setStyle(st.key); });
      refreshers.push(function () {
        var e = sel0();
        b.style.outline = (e && e.tstyle && e.tstyle.style === st.key) ? '2px solid var(--ui-accent)' : 'none';
      });
      box.appendChild(b);
    });
    return box;
  }
  function sel0() { return S.selElements()[0]; }

  /* ---------------------------------------------------------- 图表类型库 */
  function chartTypes() {
    var box = U.el('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: '3px', width: '152px' } });
    PS.chart.TYPES.forEach(function (t) {
      var b = U.el('button', { type: 'button', class: 'rb-ico', title: t.name, style: { width: '34px', height: '30px', color: 'var(--ui-ink-2)' } });
      b.innerHTML = PS.chart.thumb(t.key).replace('<svg', '<svg style="width:22px;height:22px"');
      b.querySelectorAll && Array.prototype.forEach.call(b.querySelectorAll('.st'), function (n) {
        n.setAttribute('fill', 'none'); n.setAttribute('stroke', 'currentColor'); n.setAttribute('stroke-width', '8');
      });
      b.addEventListener('click', function () { PS.chart.setType(t.key); });
      refreshers.push(function () {
        var e = sel0();
        b.classList.toggle('on', !!(e && e.chartType === t.key));
      });
      box.appendChild(b);
    });
    return box;
  }

  /* ------------------------------------------------------- 图表系列配色 */
  function chartColors() {
    var box = U.el('div', { class: 'rb-col' });
    function paint() {
      box.innerHTML = '';
      var e = sel0();
      if (!e || e.type !== 'chart') return;
      var isPie = e.chartType === 'pie' || e.chartType === 'doughnut';
      if (isPie) {
        box.appendChild(U.el('div', { class: 'f-hint', style: { padding: '2px 4px', maxWidth: '150px' }, html: '饼图 / 环形图按<b>扇区</b>取色，用的是内置调色板。' }));
        return;
      }
      e.data.series.slice(0, 4).forEach(function (s, i) {
        var b = U.el('button', { class: 'rb-sm', type: 'button', title: '系列：' + (s.name || i + 1) });
        b.innerHTML = '<span style="width:13px;height:13px;border-radius:2px;border:1px solid rgba(0,0,0,.15);flex:none;background:' +
          M.resolveColor(s.color || PS.chart.PALETTE[i % PS.chart.PALETTE.length], S.deck.theme) + '"></span><span>' +
          U.escHTML((s.name || ('系列 ' + (i + 1))).slice(0, 8)) + '</span>';
        b.addEventListener('click', function () {
          PS.ui.colorPicker(b, s.color, function (v) { PS.chart.setSeriesColor(i, v); paint(); });
        });
        box.appendChild(b);
      });
    }
    refreshers.push(paint);
    paint();
    return box;
  }

  /* ---------------------------------------------------------- 节 / 艺术字 */
  function sectionMenu(anchor) {
    var groups = PS.sections.list();
    var cur = PS.sections.sectionOf(S.curIndex());
    var items = [
      { label: '新增节（从当前页开始）', icon: 'section', on: PS.sections.add },
      { sep: 1 },
      { label: '全部折叠', icon: 'layout', on: PS.sections.collapseAll },
      { label: '全部展开', icon: 'layout', on: PS.sections.expandAll }
    ];
    if (groups.length) {
      items.push({ sep: 1 }, { grp: '当前共 ' + groups.length + ' 节' });
      groups.forEach(function (g) {
        items.push({
          label: g.name + '（' + g.slides.length + ' 页）',
          icon: 'section',
          checked: g.name === cur,
          on: function () { S.selectSlide(g.startId); }
        });
      });
    }
    PS.ui.menu(anchor, items);
  }

  function wordArtMenu(anchor) {
    var box = U.el('div', { class: 'wa-pop' });
    var h;
    var theme = S.deck ? S.deck.theme : M.DEFAULT_THEME;
    box.appendChild(U.el('h5', { text: '文字效果（应用到选中的文本框）' }));
    var grid = U.el('div', { class: 'grid' });
    PS.text.WORDART.forEach(function (w, i) {
      var b = U.el('button', { class: 'wa', type: 'button', title: w.name });
      var st = 'font-size:26px;font-weight:800;line-height:1;';
      var s = w.set;
      if (s.gradient) {
        st += 'background-image:linear-gradient(' + (s.gradient.angle || 180) + 'deg,' +
          M.resolveColor(s.gradient.from, theme) + ',' + M.resolveColor(s.gradient.to, theme) + ');' +
          '-webkit-background-clip:text;background-clip:text;color:transparent;';
      } else {
        st += 'color:' + M.resolveColor('theme:--ps-accent-strong', theme) + ';';
      }
      if (s.outline && s.outline.width) st += '-webkit-text-stroke:' + s.outline.width + 'px ' + M.resolveColor(s.outline.color, theme) + ';paint-order:stroke fill;';
      if (s.shadowText) {
        var sh = s.shadowText;
        st += 'text-shadow:' + sh.dx + 'px ' + sh.dy + 'px ' + sh.blur + 'px ' +
          U.withAlpha(U.toHex(M.resolveColor(sh.color, theme)) || '#000000', sh.opacity) + ';';
      }
      b.innerHTML = '<span style="' + st + '">文字</span><span class="cap">' + U.escHTML(w.name) + '</span>';
      b.addEventListener('click', function () {
        h.close();
        if (!PS.text.targets().length) { PS.ui.toast('先选中一个文本框或带文字的形状', 'warn'); return; }
        PS.text.applyWordArt(i);
      });
      grid.appendChild(b);
    });
    box.appendChild(grid);
    box.appendChild(U.el('div', { class: 'f-hint', html: '这些效果全部走 CSS（阴影 / 描边 / 渐变裁切），导出后原样可见，不会变成图片。' }));
    h = PS.ui.popup(anchor, box);
    return h;
  }

  function cellFillMenu(anchor) {
    PS.ui.colorPicker(anchor, null, function (v) { PS.table.setCell({ fill: v }); },
      { allowNone: true, noneLabel: '恢复为样式底色' });
  }

  function chartTitle() {
    var e = sel0();
    if (!e || e.type !== 'chart') return;
    PS.ui.prompt('图表标题', '标题', e.copt.title || '', { hint: '留空则不显示标题。' })
      .then(function (v) { if (v != null) PS.chart.setOpt({ title: v }); });
  }

  /* ============================================================== 菜单 */
  function bulletMenu(anchor, ordered) {
    var opts = ordered
      ? [['none', '无'], ['decimal', '1. 2. 3.'], ['upper-alpha', 'A. B. C.'], ['lower-alpha', 'a. b. c.'], ['upper-roman', 'I. II. III.'], ['cjk-ideographic', '一、二、三、']]
      : [['none', '无'], ['disc', '● 实心圆'], ['circle', '○ 空心圆'], ['square', '■ 实心方块']];
    var t = PS.text.current();
    PS.ui.menu(anchor, opts.map(function (o) {
      return { label: o[1], checked: t && t.bullet === o[0], on: function () { PS.text.apply({ bullet: o[0] }, '设置项目符号'); } };
    }));
  }
  function lineSpaceMenu(anchor) {
    var t = PS.text.current();
    PS.ui.menu(anchor, [1, 1.15, 1.3, 1.5, 1.75, 2, 2.5, 3].map(function (v) {
      return { label: v.toFixed(2).replace(/\.?0+$/, '') + ' 倍行距', checked: t && Math.abs(t.lineHeight - v) < .01, on: function () { PS.text.setLineHeight(v); } };
    }).concat([
      { sep: 1 },
      { label: '段间距设置…', on: function () { PS.panel.open('text'); } }
    ]));
  }
  function spacingMenu(anchor) {
    var t = PS.text.current();
    PS.ui.menu(anchor, [['紧缩', -1], ['很紧', -0.5], ['标准', 0], ['稍松', 0.5], ['加宽', 1], ['很宽', 2], ['稀疏', 4]].map(function (o) {
      return { label: o[0] + '（' + o[1] + 'px）', checked: t && t.letterSpacing === o[1], on: function () { PS.text.setSpacing(o[1]); } };
    }));
  }
  function dirMenu(anchor) {
    var t = PS.text.current();
    PS.ui.menu(anchor, [
      { label: '横排文字', checked: t && t.direction === 'horizontal', on: function () { PS.text.setDirection('horizontal'); } },
      { label: '竖排文字（从右向左）', checked: t && t.direction === 'vertical', on: function () { PS.text.setDirection('vertical'); } }
    ]);
  }
  function effectMenu(anchor) {
    PS.ui.menu(anchor, [
      { grp: '阴影' },
      { label: '无阴影', icon: 'close', on: function () { PS.shape.setShadow(null); } },
      { label: '柔和外阴影', icon: 'effects', on: function () { PS.shape.setShadow({ color: '#000000', opacity: .28, blur: 14, dist: 6, angle: 90 }); } },
      { label: '硬边投影', icon: 'effects', on: function () { PS.shape.setShadow({ color: '#000000', opacity: .35, blur: 0, dist: 5, angle: 45 }); } },
      { label: '底部浮起', icon: 'effects', on: function () { PS.shape.setShadow({ color: '#000000', opacity: .18, blur: 24, dist: 12, angle: 90 }); } },
      { sep: 1 },
      { grp: '发光' },
      { label: '无发光', icon: 'close', on: function () { PS.shape.setGlow(null); } },
      { label: '主题色发光', icon: 'effects', on: function () { PS.shape.setGlow({ color: 'theme:--ps-accent-mid', size: 14, opacity: .6 }); } },
      { sep: 1 },
      { label: '更多效果…', icon: 'more', on: function () { PS.panel.open('effect'); } }
    ]);
  }
  function alignMenu(anchor) {
    PS.ui.menu(anchor, [
      { grp: '对齐（单选=相对幻灯片，多选=相对选区）' },
      { label: '左对齐', icon: 'align-left', on: function () { PS.arrange.align('left'); } },
      { label: '水平居中', icon: 'align-center', on: function () { PS.arrange.align('center'); } },
      { label: '右对齐', icon: 'align-right', on: function () { PS.arrange.align('right'); } },
      { sep: 1 },
      { label: '顶端对齐', icon: 'valign-top', on: function () { PS.arrange.align('top'); } },
      { label: '垂直居中', icon: 'valign-mid', on: function () { PS.arrange.align('middle'); } },
      { label: '底端对齐', icon: 'valign-bot', on: function () { PS.arrange.align('bottom'); } },
      { sep: 1 },
      { label: '横向分布', icon: 'columns', on: function () { PS.arrange.distribute('h'); } },
      { label: '纵向分布', icon: 'linespace', on: function () { PS.arrange.distribute('v'); } },
      { sep: 1 },
      { label: '统一大小', icon: 'layout', on: function () { PS.arrange.sameSize('both'); } }
    ]);
  }
  function rotateMenu(anchor) {
    PS.ui.menu(anchor, [
      { label: '向右旋转 90°', icon: 'rotate', on: function () { PS.arrange.rotate(90); } },
      { label: '向左旋转 90°', icon: 'rotate', on: function () { PS.arrange.rotate(-90); } },
      { label: '旋转 180°', icon: 'rotate', on: function () { PS.arrange.rotate(180); } },
      { sep: 1 },
      { label: '水平翻转', icon: 'flip-h', on: function () { PS.arrange.flip('h'); } },
      { label: '垂直翻转', icon: 'flip-v', on: function () { PS.arrange.flip('v'); } },
      { sep: 1 },
      { label: '其他旋转选项…', icon: 'more', on: function () { PS.panel.open('size'); } }
    ]);
  }
  function arrangeMenu(anchor) {
    PS.ui.menu(anchor, [
      { grp: '排列对象' },
      { label: '置于顶层', icon: 'front', on: function () { PS.arrange.reorder('front'); } },
      { label: '上移一层', icon: 'forward', on: function () { PS.arrange.reorder('forward'); } },
      { label: '下移一层', icon: 'backward', on: function () { PS.arrange.reorder('backward'); } },
      { label: '置于底层', icon: 'back', on: function () { PS.arrange.reorder('back'); } },
      { sep: 1 },
      { label: '对齐', icon: 'align-obj', on: function () { alignMenu(anchor); } },
      { label: '旋转', icon: 'rotate', on: function () { rotateMenu(anchor); } },
      { sep: 1 },
      { label: '组合', icon: 'group', on: function () { PS.arrange.group(); } },
      { label: '取消组合', icon: 'ungroup', on: function () { PS.arrange.ungroup(); } },
      { sep: 1 },
      { label: '选择窗格', icon: 'selectpane', on: selectPane }
    ]);
  }
  function picBorderMenu(anchor) {
    PS.ui.menu(anchor, [
      { label: '无边框', icon: 'close', on: function () { PS.shape.setLine({ width: 0, type: 'none' }); } },
      { label: '细线（1px）', icon: 'outline', on: function () { PS.shape.setLine({ width: 1, type: 'solid', color: 'theme:--ps-rule' }); } },
      { label: '中等（2px）', icon: 'outline', on: function () { PS.shape.setLine({ width: 2, type: 'solid', color: 'theme:--ps-accent' }); } },
      { label: '粗线（4px）', icon: 'outline', on: function () { PS.shape.setLine({ width: 4, type: 'solid', color: 'theme:--ps-accent' }); } },
      { sep: 1 },
      { label: '更多边框选项…', icon: 'more', on: function () { PS.panel.open('fill'); } }
    ]);
  }
  function sizeMenu(anchor) {
    PS.ui.menu(anchor, Object.keys(M.SIZES).map(function (k) {
      return {
        label: M.SIZES[k].name + '（' + M.SIZES[k].w + '×' + M.SIZES[k].h + '）',
        checked: S.deck && S.deck.sizeKey === k,
        icon: 'slidesize',
        on: function () { PS.theme.setSize(k); }
      };
    }).concat([
      { sep: 1 },
      { label: '自定义大小…', icon: 'more', on: function () { PS.theme.customSize(); } }
    ]));
  }
  function zoomMenu(anchor) {
    PS.ui.menu(anchor, [25, 50, 75, 100, 125, 150, 200, 300, 400].map(function (z) {
      return { label: z + '%', on: function () { PS.canvas.setZoom(z / 100); } };
    }).concat([
      { sep: 1 },
      { label: '适应窗口', icon: 'fit', on: function () { PS.canvas.fit(); } }
    ]));
  }

  /* ------------------------------------------------------------ 选择窗格 */
  function selectPane() {
    var slide = S.curSlide();
    if (!slide) return;
    var els = (slide.elements || []).slice().reverse();
    if (!els.length) { PS.ui.toast('这一页还没有自由对象'); return; }
    var box = U.el('div');
    els.forEach(function (e, i) {
      var r = U.el('div', { class: 'fr', style: { padding: '0 4px' } });
      var eye = U.el('button', { class: 'rb-ico', title: e.hidden ? '显示' : '隐藏', html: PS.icon(e.hidden ? 'hide' : 'check') });
      eye.addEventListener('click', function () { e.hidden = !e.hidden; S.commit('切换对象可见性'); dlg.close(); selectPane(); });
      var name = U.el('button', {
        class: 'rb-sm', style: { flex: '1', justifyContent: 'flex-start' },
        html: PS.icon(e.type === 'image' ? 'image' : e.type === 'text' ? 'textbox' : e.type === 'line' ? 'outline' : e.type === 'group' ? 'group' : 'shapes') +
          '<span>' + U.escHTML(M.defaultName(e, els.length - 1 - i)) + '</span>'
      });
      name.addEventListener('click', function () { S.selectElements([e.id]); });
      var lock = U.el('button', { class: 'rb-ico', title: e.locked ? '解除锁定' : '锁定', html: PS.icon('lock') });
      if (e.locked) lock.classList.add('on');
      lock.addEventListener('click', function () { e.locked = !e.locked; S.commit('切换锁定'); dlg.close(); selectPane(); });
      r.appendChild(eye); r.appendChild(name); r.appendChild(lock);
      box.appendChild(r);
    });
    var dlg = PS.ui.dialog({
      title: '选择窗格 · 第 ' + (S.curIndex() + 1) + ' 页（自上而下 = 由顶层到底层）',
      body: box,
      buttons: [
        { label: '全部显示', on: function () { (slide.elements || []).forEach(function (e) { e.hidden = false; }); S.commit('全部显示'); return true; } },
        { label: '关闭', primary: true }
      ]
    });
  }

  return {
    init: init, build: build, refresh: refresh, paintScrollHints: paintScrollHints,
    bulletMenu: bulletMenu, lineSpaceMenu: lineSpaceMenu, spacingMenu: spacingMenu, dirMenu: dirMenu,
    effectMenu: effectMenu, alignMenu: alignMenu, rotateMenu: rotateMenu, arrangeMenu: arrangeMenu,
    picBorderMenu: picBorderMenu, sizeMenu: sizeMenu, zoomMenu: zoomMenu, selectPane: selectPane,
    cellFillMenu: cellFillMenu, chartTitle: chartTitle,
    sectionMenu: sectionMenu, wordArtMenu: wordArtMenu,
    PRESETS: PRESETS,
    setTab: function (k) { active = k; buildTabs(); build(); }
  };
})();

</script>
