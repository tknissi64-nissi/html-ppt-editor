<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML PPT Editor</title>
<style>
/* ===== inlined: css/studio.css ===== */
/* ===========================================================================
   HTML PPT Editor :: studio.css
   编辑器外壳 —— 自有视觉语言。

   信息架构沿用大家熟悉的那套（标题栏 → 选项卡 → 功能区 → 三栏工作区 → 状态栏），
   因为那是通用的交互惯例，照着来是为了不让人重新学；但**视觉呈现完全是自己的**，
   不沿用任何办公套件的商业外观。

   这套皮肤的规则，和默认模板同源：
     · 面板是浮在浅灰场上的圆角白卡，靠间隙和极轻的投影分区，不靠边框把界面切格子
     · 层级靠字重与留白拉开，不靠颜色块
     · 全局只有一种强调色，且只用于「当前选中 / 主操作 / 焦点」这三件事
     · 圆角统一：面板 10、控件 7、胶囊全圆
     · 投影只有一档，且只给浮起来的东西（面板、浮层、画布）
   =========================================================================== */

:root{
  /* ---- 场与面 ---- */
  --ui-field:#E9EBEE;           /* 最底层的场 */
  --ui-surface:#FFFFFF;         /* 浮起来的面板 */
  --ui-surface-2:#F5F6F8;       /* 面板内的次级区域 */
  --ui-sunken:#2E3238;          /* 画布舞台（凹下去的那层） */

  /* ---- 墨 ---- */
  --ui-ink:#14171A;
  --ui-ink-2:#41464D;
  --ui-ink-3:#6B717A;
  --ui-ink-4:#9AA0A9;

  /* ---- 线 ---- */
  --ui-line:#E6E8EC;
  --ui-line-2:#D8DCE2;

  /* ---- 交互 ---- */
  --ui-hover:#EFF1F4;
  --ui-active:#E3E6EB;
  --ui-accent:#2A75AE;
  --ui-accent-ink:#1E5B8C;      /* 强调色的深版，用于浅底上的强调文字 */
  --ui-accent-deep:#1F5B88;
  --ui-accent-wash:#EAF1F8;
  --ui-sel:#DCE9F5;
  --ui-sel-line:#2A75AE;
  --ui-danger:#C4453A;
  --ui-ok:#29736F;

  /* ---- 形 ---- */
  --r-panel:10px;
  --r-ctl:7px;
  --r-pill:999px;
  --gutter:8px;

  /* ---- 影：只有这一档 ---- */
  --sh-panel:0 1px 2px rgba(20,23,26,.06), 0 4px 14px rgba(20,23,26,.06);
  --sh-pop:0 12px 40px rgba(20,23,26,.20), 0 2px 6px rgba(20,23,26,.10);

  /* ---- 尺 ---- */
  --h-title:38px;
  --h-tabs:38px;
  --h-ribbon:92px;
  --h-status:28px;
  --w-thumbs:196px;
  --w-format:296px;
  --h-notes:108px;

  --fs:12.5px;
  --font-ui:system-ui,-apple-system,'Segoe UI Variable Text','Segoe UI',
            'PingFang SC','HarmonyOS Sans SC','Microsoft YaHei',sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font:var(--fs)/1.55 var(--font-ui);
  letter-spacing:-.01em;
  color:var(--ui-ink);
  background:var(--ui-field);
  display:flex;flex-direction:column;
  overflow:hidden;
  user-select:none;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
button{font:inherit;letter-spacing:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;letter-spacing:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ui-accent);outline-offset:1px;border-radius:4px}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#C4C9D0;border:3px solid transparent;background-clip:content-box;border-radius:999px}
::-webkit-scrollbar-thumb:hover{background:#A7AEB8;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ============================== 标题栏 ==============================
   不做彩色条。整条与场同色，只靠字重和一条极浅的分隔感存在。 */
.titlebar{
  height:var(--h-title);flex:none;display:flex;align-items:center;gap:12px;
  padding:0 12px;background:var(--ui-field);color:var(--ui-ink);
}
.qat{display:flex;align-items:center;gap:2px}
.qat button{
  width:28px;height:28px;border:0;background:transparent;color:var(--ui-ink-2);
  border-radius:var(--r-ctl);display:flex;align-items:center;justify-content:center;
}
.qat button:hover:not(:disabled){background:rgba(20,23,26,.06);color:var(--ui-ink)}
.qat button:active:not(:disabled){background:rgba(20,23,26,.11)}
.qat button:disabled{opacity:.3;cursor:default}
.qat button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.qat .sep{width:1px;height:16px;background:var(--ui-line-2);margin:0 5px}

.doc-title{
  flex:1;text-align:center;font-size:12.5px;font-weight:600;color:var(--ui-ink-2);
  display:flex;align-items:center;justify-content:center;gap:6px;min-width:0;
}
.doc-title #doc-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:44vw}
.doc-sub{font-weight:400;color:var(--ui-ink-4);font-size:11.5px}
.dirty-dot{font-size:17px;line-height:1;color:var(--ui-accent)}
.titlebar-right{display:flex;gap:2px}
.tb-btn{
  width:28px;height:28px;border:0;background:transparent;color:var(--ui-ink-3);
  border-radius:var(--r-ctl);font-size:13px;
}
.tb-btn:hover{background:rgba(20,23,26,.06);color:var(--ui-ink)}

/* ============================== 选项卡 ==============================
   胶囊行。当前项用实心强调色，其余是纯文字，没有背景条、没有梯形标签页。 */
.ribbon-tabs{
  height:var(--h-tabs);flex:none;display:flex;align-items:center;gap:2px;
  padding:0 12px 4px;background:var(--ui-field);overflow-x:auto;
}
.ribbon-tabs::-webkit-scrollbar{height:0}
.ribbon-tabs button{
  border:0;background:transparent;color:var(--ui-ink-3);
  padding:0 14px;height:28px;border-radius:var(--r-pill);
  font-size:12.5px;font-weight:500;white-space:nowrap;
  transition:background .12s ease,color .12s ease;
}
.ribbon-tabs button:hover{background:rgba(20,23,26,.06);color:var(--ui-ink)}
.ribbon-tabs button.on{background:var(--ui-accent);color:#fff;font-weight:600}
.ribbon-tabs button.on:hover{background:var(--ui-accent-deep)}
/* 上下文选项卡：描边胶囊，与常驻项区分但不喧宾夺主 */
.ribbon-tabs button.ctx{
  background:transparent;color:var(--ui-accent-ink);
  box-shadow:inset 0 0 0 1px var(--ui-accent);
}
.ribbon-tabs button.ctx:hover{background:var(--ui-accent-wash)}
.ribbon-tabs button.ctx.on{background:var(--ui-accent);color:#fff;box-shadow:none}
.ribbon-tabs .ctx-label{
  font-size:10.5px;font-weight:400;opacity:.75;margin-right:6px;padding-right:6px;
  border-right:1px solid currentColor;
}

/* ============================== 功能区 ==============================
   一张浮起来的白卡。分组之间用留白，不画竖线。 */
.ribbon{
  height:var(--h-ribbon);flex:none;display:flex;align-items:stretch;gap:4px;
  margin:0 var(--gutter);padding:6px 10px 4px;
  background:var(--ui-surface);border-radius:var(--r-panel) var(--r-panel) 0 0;
  box-shadow:var(--sh-panel);
  overflow-x:auto;overflow-y:hidden;
}
.ribbon::-webkit-scrollbar{height:6px}
.ribbon.collapsed{height:0;padding:0;margin:0 var(--gutter);overflow:hidden;box-shadow:none}
.rb-group{
  display:flex;flex-direction:column;align-items:center;
  padding:0 10px;flex:none;position:relative;
}
/* 分组间隔用一道极短的浅线暗示，而不是整条竖线切格子 */
.rb-group+.rb-group::before{
  content:'';position:absolute;left:0;top:22%;bottom:30%;width:1px;background:var(--ui-line);
}
.rb-group>.rb-items{flex:1;display:flex;align-items:flex-start;gap:3px}
.rb-group>.rb-name{
  font-size:10px;color:var(--ui-ink-4);padding:2px 0 0;text-align:center;white-space:nowrap;
  letter-spacing:.02em;
}
.rb-col{display:flex;flex-direction:column;gap:2px;justify-content:flex-start}
.rb-row{display:flex;gap:2px;align-items:center}

.rb-big{
  width:58px;min-height:62px;border:0;background:transparent;border-radius:var(--r-ctl);
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 3px;
  font-size:11px;line-height:1.28;text-align:center;color:var(--ui-ink-2);
  transition:background .12s ease;
}
.rb-big .ico{height:24px;display:flex;align-items:center;justify-content:center;color:var(--ui-ink-2)}
.rb-big .cap{white-space:normal;word-break:keep-all}
.rb-big.wide{width:66px}
.rb-sm{
  height:25px;border:0;background:transparent;border-radius:var(--r-ctl);padding:0 7px;
  display:flex;align-items:center;gap:6px;font-size:11.5px;white-space:nowrap;color:var(--ui-ink-2);
  transition:background .12s ease;
}
.rb-ico{
  width:26px;height:25px;border:0;background:transparent;border-radius:var(--r-ctl);
  display:flex;align-items:center;justify-content:center;padding:0;color:var(--ui-ink-2);
  transition:background .12s ease;
}
.rb-big:hover,.rb-sm:hover,.rb-ico:hover{background:var(--ui-hover);color:var(--ui-ink)}
.rb-big:active,.rb-sm:active,.rb-ico:active{background:var(--ui-active)}
.rb-big.on,.rb-sm.on,.rb-ico.on{background:var(--ui-accent-wash);color:var(--ui-accent-ink)}
.rb-big.on .ico{color:var(--ui-accent)}
.rb-big:disabled,.rb-sm:disabled,.rb-ico:disabled{color:var(--ui-ink-4);background:transparent;cursor:default}
.rb-big:disabled svg,.rb-sm:disabled svg,.rb-ico:disabled svg{opacity:.35}
.rb-caret{width:13px;display:flex;align-items:center;justify-content:center;opacity:.5}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round;flex:none}
.rb-big svg.i{width:22px;height:22px;stroke-width:1.35}
svg.i .f{fill:currentColor;stroke:none}

.rb-select,.rb-num{
  height:25px;border:1px solid var(--ui-line-2);background:var(--ui-surface);border-radius:var(--r-ctl);
  padding:0 7px;font-size:11.5px;min-width:0;color:var(--ui-ink);
}
.rb-select:hover,.rb-num:hover{border-color:var(--ui-ink-4)}
.rb-select:focus,.rb-num:focus{outline:0;border-color:var(--ui-accent);box-shadow:0 0 0 3px var(--ui-accent-wash)}
.rb-num{width:46px;text-align:center}
.rb-combo{display:inline-flex;align-items:center}
.rb-combo .rb-num{width:54px;border-top-right-radius:0;border-bottom-right-radius:0}
/* 自绘下拉入口：Chrome 不给 input[list] 画指示器，只能自己画一个能点的箭头 */
.rb-combo-caret{
  height:25px;width:17px;padding:0;margin-left:-1px;flex:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--ui-line-2);border-top-right-radius:var(--r-ctl);border-bottom-right-radius:var(--r-ctl);
  border-top-left-radius:0;border-bottom-left-radius:0;
  background:var(--ui-surface);color:var(--ui-ink-2);
}
.rb-combo-caret:hover{background:var(--ui-hover);border-color:var(--ui-ink-4);color:var(--ui-ink)}
.rb-combo-caret:active{background:var(--ui-active)}
.rb-combo-caret svg.i{width:12px;height:12px}
.rb-combo-caret:disabled{color:var(--ui-ink-4);background:transparent;cursor:default}
.rb-combo-caret:disabled svg{opacity:.35}
.rb-num:disabled{color:var(--ui-ink-4);background:transparent;cursor:default}
.rb-select:disabled{color:var(--ui-ink-4);background:transparent;cursor:default}
.rb-font{width:138px}
.rb-color{position:relative}
.rb-color .bar{position:absolute;left:5px;right:5px;bottom:3px;height:3px;border-radius:2px}

/* ---- 窄窗口紧凑模式：省掉分组标题，按钮压扁，让更多功能挤进可视区 ---- */
body.compact .rb-group>.rb-name{display:none}
body.compact .ribbon{height:74px;padding-top:5px}
body.compact .rb-big{min-height:56px;width:52px;font-size:10.5px;padding:4px 2px}
body.compact .rb-big svg.i{width:19px;height:19px}
body.compact .rb-big .ico{height:20px}
body.compact .rb-group{padding:0 7px}
body.compact .rb-font{width:104px}

/* ---- 功能区可滚动时的两端渐隐提示 ---- */
.ribbon{position:relative}
.ribbon.can-scroll-l{
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 26px);
          mask-image:linear-gradient(to right,transparent 0,#000 26px);
}
.ribbon.can-scroll-r{
  -webkit-mask-image:linear-gradient(to left,transparent 0,#000 26px);
          mask-image:linear-gradient(to left,transparent 0,#000 26px);
}
.ribbon.can-scroll-l.can-scroll-r{
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 26px,#000 calc(100% - 26px),transparent 100%);
          mask-image:linear-gradient(to right,transparent 0,#000 26px,#000 calc(100% - 26px),transparent 100%);
}

/* ============================== 工作区 ==============================
   三栏各自是浮起来的圆角面板，中间留出场的颜色作为缝隙。 */
.main{flex:1;display:flex;min-height:0;padding:0 var(--gutter) var(--gutter);gap:0;background:var(--ui-field)}
.pane{
  background:var(--ui-surface);display:flex;flex-direction:column;min-height:0;flex:none;
  box-shadow:var(--sh-panel);
}
.pane-thumbs{width:var(--w-thumbs);border-radius:0 0 0 var(--r-panel)}
.pane-format{width:var(--w-format);border-radius:0 0 var(--r-panel) 0}
.pane-thumbs.hide,.pane-format.hide{display:none}
.thumbs-scroll{flex:1;overflow:auto;padding:10px 10px 16px}
.pane-foot{
  height:28px;border-top:1px solid var(--ui-line);display:flex;align-items:center;
  padding:0 12px;color:var(--ui-ink-4);font-size:11px;gap:6px;
}

.splitter{width:var(--gutter);flex:none;cursor:col-resize;background:transparent;position:relative}
.splitter::after{
  content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:2px;height:26px;border-radius:2px;background:transparent;transition:background .12s;
}
.splitter:hover::after,.splitter.dragging::after{background:var(--ui-accent)}
.splitter.horiz{width:auto;height:var(--gutter);cursor:row-resize}
.splitter.horiz::after{width:26px;height:2px}

.center{flex:1;display:flex;flex-direction:column;min-width:240px;min-height:0}

/* ---- 缩略图 ---- */
.thumb{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px;position:relative;cursor:pointer}
.thumb .n{width:15px;text-align:right;font-size:11px;color:var(--ui-ink-4);padding-top:3px;flex:none;font-variant-numeric:tabular-nums}
.thumb .box{
  flex:1;aspect-ratio:16/9;background:#fff;border-radius:var(--r-ctl);
  overflow:hidden;position:relative;
  box-shadow:0 0 0 1px var(--ui-line-2);
  transition:box-shadow .12s ease;
}
.thumb:hover .box{box-shadow:0 0 0 1px var(--ui-ink-4)}
.thumb.on .box{box-shadow:0 0 0 2px var(--ui-accent)}
.thumb.on .n{color:var(--ui-accent);font-weight:600}
.thumb.multi .box{box-shadow:0 0 0 2px var(--ui-sel-line)}
.thumb .box iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
.thumb .lbl{
  position:absolute;left:0;right:0;bottom:0;padding:10px 6px 3px;font-size:9px;color:#fff;
  background:linear-gradient(transparent,rgba(0,0,0,.6));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.thumb .flag{position:absolute;top:3px;right:3px;display:flex;gap:3px;z-index:2}
.thumb .flag i{
  font-style:normal;font-size:8px;background:rgba(20,23,26,.6);color:#fff;
  border-radius:var(--r-pill);padding:0 5px;line-height:13px;backdrop-filter:blur(4px);
}
.thumb.hidden-slide .box{opacity:.42}
.thumb.drop-before::before,.thumb.drop-after::after{
  content:'';position:absolute;left:22px;right:0;height:2px;background:var(--ui-accent);border-radius:2px;
}
.thumb.drop-before::before{top:-6px}
.thumb.drop-after::after{bottom:4px}
.thumb.dragging{opacity:.35}

/* ---- 节标题 ---- */
.sec-head{
  display:flex;align-items:center;gap:6px;padding:5px 6px;margin:2px 0 8px;
  font-size:11px;font-weight:600;color:var(--ui-ink-2);cursor:pointer;
  border-radius:var(--r-ctl);user-select:none;background:var(--ui-surface-2);
}
.sec-head:hover{background:var(--ui-hover)}
.sec-head .ar{display:flex;transition:transform .14s}
.sec-head.collapsed .ar{transform:rotate(-90deg)}
.sec-head .ar svg{width:12px;height:12px}
.sec-head .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec-head .ct{color:var(--ui-ink-4);font-weight:400;font-size:10px;font-variant-numeric:tabular-nums}

/* ---- 舞台 ---- */
.stage-wrap{flex:1;position:relative;min-height:0;background:var(--ui-sunken);overflow:hidden}
.stage{position:absolute;inset:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:24px}
.stage-wrap.with-ruler .stage{inset:20px 0 0 20px}
.slide-view{position:relative;flex:none;background:#fff;box-shadow:0 20px 56px rgba(0,0,0,.38)}
.sv-page{position:absolute;inset:0;overflow:hidden;transform-origin:0 0}
.sv-overlay{position:absolute;inset:0;z-index:5}

.ruler{position:absolute;background:#252A30;z-index:3;display:none;font-size:8px;color:#8C939C;overflow:hidden}
.stage-wrap.with-ruler .ruler{display:block}
.ruler-h{top:0;left:20px;right:0;height:20px}
.ruler-v{top:20px;left:0;bottom:0;width:20px}
.ruler-corner{position:absolute;top:0;left:0;width:20px;height:20px;background:#252A30;z-index:4;display:none}
.stage-wrap.with-ruler .ruler-corner{display:block}
.ruler .tick{position:absolute;background:#5A616B}
.ruler-h .tick{bottom:0;width:1px;height:4px}
.ruler-h .tick.maj{height:8px;background:#8C939C}
.ruler-v .tick{right:0;height:1px;width:4px}
.ruler-v .tick.maj{width:8px;background:#8C939C}
.ruler .lb{position:absolute;font-size:8px;line-height:1;font-variant-numeric:tabular-nums}
.ruler-h .lb{top:2px;transform:translateX(-50%)}
.ruler-v .lb{left:2px;transform:translateY(-50%) rotate(-90deg);transform-origin:center}
.ruler .cursor{position:absolute;background:var(--ui-accent)}
.ruler-h .cursor{top:0;bottom:0;width:1px}
.ruler-v .cursor{left:0;right:0;height:1px}

/* 欢迎页。和 .drop-hint 同一个坑：作者样式的 display 会盖过 [hidden] 的 display:none，
   不显式兜底的话这块面板会一直盖在画布上。凡是靠 hidden 属性控制显隐的元素，
   只要在 CSS 里给它写过 display，就必须补一条 [hidden]{display:none}。 */
.stage-empty[hidden]{display:none}
.stage-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--ui-sunken);z-index:6}
.se-inner{text-align:center;color:#EAECEF;max-width:420px}
.se-inner h2{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:0 0 10px}
.se-inner p{margin:0 0 24px;color:#A2A9B2;font-size:13px;line-height:1.7}
.se-actions{display:flex;gap:10px;justify-content:center}

/* ---- 选择框与控制柄 ---- */
.sel-box{position:absolute;border:1px solid var(--ui-accent);pointer-events:none}
.sel-box.multi{border-style:dashed;border-color:var(--ui-ink-3)}
.sel-box.locked{border-color:var(--ui-ink-4);border-style:dotted}
.handle{
  position:absolute;width:9px;height:9px;background:#fff;border:1.5px solid var(--ui-accent);
  border-radius:2px;margin:-5px 0 0 -5px;pointer-events:auto;z-index:3;
  box-shadow:0 1px 3px rgba(0,0,0,.28);
}
/* 控制点的**可点区域**单独撑大到约 22×22，视觉尺寸仍是那个 9px 小方块 ——
   放大视觉会遮挡画面、显得笨重，放大命中区才是符合 Fitts 定律的做法。
   --h-grow 由 canvas.js 按对象在屏幕上的尺寸下发：对象很小时收缩放大量，
   否则八个控制点的命中区会互相重叠、还把对象本体整个吞掉，变成"能缩放却拖不动"。 */
.handle::before{content:'';position:absolute;inset:var(--h-grow,-7px)}
/* 重叠时优先命中角点：角点能同时改两个方向，比边点有用 */
.handle[data-dir="nw"],.handle[data-dir="ne"],.handle[data-dir="se"],.handle[data-dir="sw"]{z-index:5}
.handle.rot,.handle.adj{z-index:6}
.handle.rot{border-radius:50%;border-color:var(--ui-accent);width:11px;height:11px;margin:-6px 0 0 -6px;cursor:grab}
.handle.adj{background:#E8B23A;border-color:#A87A16;border-radius:2px;transform:rotate(45deg)}
.handle[data-dir="nw"],.handle[data-dir="se"]{cursor:nwse-resize}
.handle[data-dir="ne"],.handle[data-dir="sw"]{cursor:nesw-resize}
.handle[data-dir="n"],.handle[data-dir="s"]{cursor:ns-resize}
.handle[data-dir="e"],.handle[data-dir="w"]{cursor:ew-resize}
.marquee{position:absolute;border:1px solid var(--ui-accent);background:rgba(42,117,174,.12);pointer-events:none}
.guide{position:absolute;background:#E0457B;pointer-events:none;z-index:4}
.guide.v{width:1px;top:0;bottom:0}
.guide.h{height:1px;left:0;right:0}
.guide.center{background:#E0457B}
.size-tip{
  position:absolute;background:rgba(20,23,26,.9);color:#fff;font-size:10.5px;padding:3px 8px;
  border-radius:var(--r-ctl);pointer-events:none;white-space:nowrap;z-index:6;
  font-variant-numeric:tabular-nums;backdrop-filter:blur(6px);
}
.grid-layer{position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.55}

.sv-page .ps-el.is-editing{outline:2px solid var(--ui-accent);outline-offset:0}
.sv-page .ps-el.is-hover{outline:1px dashed var(--ui-ink-4)}

/* ---- 备注 ---- */
.pane-notes{
  height:var(--h-notes);flex:none;background:var(--ui-surface);
  display:flex;flex-direction:column;box-shadow:var(--sh-panel);
}
.pane-notes.hide{display:none}
.notes-head{
  height:26px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;
  font-size:11px;font-weight:600;color:var(--ui-ink-3);border-bottom:1px solid var(--ui-line);
}
.notes-head .hint{color:var(--ui-ink-4);font-size:10.5px;font-weight:400}
.notes-body{flex:1;overflow:auto;padding:10px 14px;font-size:13px;line-height:1.75;outline:0;user-select:text}
.notes-body:empty::before{content:attr(data-placeholder);color:var(--ui-ink-4)}
.notes-body:focus{background:var(--ui-surface-2)}

/* ---- 格式窗格 ---- */
.fp-head{
  height:36px;flex:none;display:flex;align-items:center;padding:0 8px 0 14px;
  font-weight:600;font-size:12.5px;
}
.fp-head span{flex:1}
.fp-close{width:26px;height:26px;border:0;background:transparent;border-radius:var(--r-ctl);font-size:15px;color:var(--ui-ink-3)}
.fp-close:hover{background:var(--ui-hover)}
.fp-tabs{display:flex;gap:3px;padding:0 10px 8px;flex:none;flex-wrap:wrap}
.fp-tabs button{
  border:0;background:transparent;padding:4px 10px;border-radius:var(--r-pill);
  font-size:11.5px;color:var(--ui-ink-3);
}
.fp-tabs button:hover{background:var(--ui-hover);color:var(--ui-ink)}
.fp-tabs button.on{background:var(--ui-accent-wash);color:var(--ui-accent-ink);font-weight:600}
.fp-body{flex:1;overflow:auto;padding:0 0 24px}
.fp-empty{padding:28px 18px;color:var(--ui-ink-4);text-align:center;line-height:1.9;font-size:12px}

.fp-sec{border-top:1px solid var(--ui-line)}
.fp-sec:first-child{border-top:0}
.fp-sec>h4{
  margin:0;padding:9px 14px;font-size:11.5px;font-weight:600;color:var(--ui-ink-2);
  display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;
}
.fp-sec>h4:hover{color:var(--ui-ink)}
.fp-sec>h4::before{
  content:'';width:5px;height:5px;border-right:1.5px solid var(--ui-ink-4);
  border-bottom:1.5px solid var(--ui-ink-4);transform:rotate(-45deg);transition:transform .14s;margin-left:2px;
}
.fp-sec.open>h4::before{transform:rotate(45deg)}
.fp-sec>.fp-in{display:none;padding:0 14px 12px}
.fp-sec.open>.fp-in{display:block}

.fr{display:flex;align-items:center;gap:8px;margin:7px 0;min-height:26px}
.fr>label{width:68px;flex:none;color:var(--ui-ink-3);font-size:11.5px}
.fr>label.wide{width:100px}
.fr .grow{flex:1;min-width:0}
.fr .radio-row{display:flex;gap:12px;flex-wrap:wrap}
.f-in{
  height:27px;border:1px solid var(--ui-line-2);border-radius:var(--r-ctl);
  padding:0 9px;background:var(--ui-surface);width:100%;
}
.f-in:hover{border-color:var(--ui-ink-4)}
.f-in:focus{outline:0;border-color:var(--ui-accent);box-shadow:0 0 0 3px var(--ui-accent-wash)}
.f-num{width:66px;text-align:right;padding-right:7px;font-variant-numeric:tabular-nums}
.f-range{flex:1;min-width:60px;accent-color:var(--ui-accent)}
.f-check{display:flex;align-items:center;gap:6px;font-size:11.5px;cursor:pointer}
.f-check input{accent-color:var(--ui-accent);width:14px;height:14px}
.f-hint{color:var(--ui-ink-4);font-size:11px;line-height:1.7;margin:6px 0 2px}
.f-hint code{background:var(--ui-surface-2);padding:1px 5px;border-radius:4px;font-size:10.5px}

.seg{display:flex;background:var(--ui-surface-2);border-radius:var(--r-ctl);padding:2px;gap:2px}
.seg button{
  border:0;background:transparent;padding:3px 9px;font-size:11.5px;border-radius:5px;
  color:var(--ui-ink-3);display:flex;align-items:center;justify-content:center;
}
.seg button.on{background:var(--ui-surface);color:var(--ui-ink);font-weight:600;box-shadow:0 1px 2px rgba(20,23,26,.12)}
.seg button:hover:not(.on){color:var(--ui-ink)}

.color-btn{
  width:100%;height:27px;border:1px solid var(--ui-line-2);border-radius:var(--r-ctl);
  background:var(--ui-surface);display:flex;align-items:center;gap:8px;padding:0 8px;
}
.color-btn .sw{
  width:15px;height:15px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);overflow:hidden;
  background-image:linear-gradient(45deg,#e2e4e8 25%,transparent 25%,transparent 75%,#e2e4e8 75%),
                   linear-gradient(45deg,#e2e4e8 25%,transparent 25%,transparent 75%,#e2e4e8 75%);
  background-size:6px 6px;background-position:0 0,3px 3px;
}
.color-btn .sw i{display:block;width:100%;height:100%}
.color-btn .txt{flex:1;text-align:left;font-size:11.5px;color:var(--ui-ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.color-btn:hover{border-color:var(--ui-ink-4)}

.palette{padding:10px;width:246px}
.palette h5{margin:2px 0 6px;font-size:10.5px;color:var(--ui-ink-4);font-weight:600;letter-spacing:.02em}
.palette .grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-bottom:10px}
.palette .sw{width:100%;aspect-ratio:1;border:0;border-radius:4px;cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.palette .sw:hover{box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),0 0 0 2px var(--ui-accent)}
.palette .sw.on{box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),0 0 0 2px var(--ui-ink)}
.palette .row{display:flex;gap:8px;align-items:center;margin-top:8px}
.palette .more{
  border:0;background:transparent;padding:6px 8px;border-radius:var(--r-ctl);
  font-size:11.5px;display:flex;align-items:center;gap:8px;width:100%;color:var(--ui-ink-2);
}
.palette .more:hover{background:var(--ui-hover)}

/* ============================== 状态栏 ============================== */
.statusbar{
  height:var(--h-status);flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;background:var(--ui-field);font-size:11px;color:var(--ui-ink-3);
}
.sb-left,.sb-right{display:flex;align-items:center;gap:10px}
.sb-sep{width:1px;height:12px;background:var(--ui-line-2)}
#sb-page{font-variant-numeric:tabular-nums}
#sb-msg{color:var(--ui-ink-4)}
#sb-msg.warn{color:var(--ui-danger)}
#sb-msg.ok{color:var(--ui-ok)}
.view-btns{display:flex;gap:2px}
.view-btns button{
  width:26px;height:22px;border:0;background:transparent;border-radius:5px;
  display:flex;align-items:center;justify-content:center;color:var(--ui-ink-3);
}
.view-btns button:hover{background:rgba(20,23,26,.06);color:var(--ui-ink)}
.view-btns button.on{background:var(--ui-accent-wash);color:var(--ui-accent-ink)}
.zoom-btn{
  width:22px;height:22px;border:0;background:transparent;border-radius:5px;font-size:13px;line-height:1;
  display:flex;align-items:center;justify-content:center;color:var(--ui-ink-3);
}
.zoom-btn:hover{background:rgba(20,23,26,.06);color:var(--ui-ink)}
#zoom-range{width:100px;accent-color:var(--ui-accent)}
.zoom-val{width:40px;text-align:right;font-variant-numeric:tabular-nums}

/* ============================== 浮层 ============================== */
#overlay-root{position:fixed;inset:0;pointer-events:none;z-index:100}
.pop{
  position:absolute;background:var(--ui-surface);border-radius:12px;
  box-shadow:var(--sh-pop);pointer-events:auto;max-height:76vh;overflow:auto;
  border:1px solid rgba(20,23,26,.06);
}
.menu{min-width:206px;padding:6px}
.menu button,.menu .mi{
  width:100%;border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:var(--r-ctl);
  display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ui-ink-2);
}
.menu button:hover:not(:disabled){background:var(--ui-hover);color:var(--ui-ink)}
.menu button:disabled{color:var(--ui-ink-4);cursor:default}
.menu button.danger{color:var(--ui-danger)}
.menu button.danger:hover{background:#FCEDEC}
.menu .key{margin-left:auto;color:var(--ui-ink-4);font-size:10.5px}
.menu .sep{height:1px;background:var(--ui-line);margin:6px 8px}
.menu .grp{padding:7px 10px 3px;font-size:10.5px;color:var(--ui-ink-4);font-weight:600}
.menu button.on{background:var(--ui-accent-wash);color:var(--ui-accent-ink)}

.shape-pop{width:312px;padding:10px}
.shape-pop h5,.tpl-pop h5,.icon-pop h5{margin:8px 0 6px;font-size:10.5px;color:var(--ui-ink-4);font-weight:600}
.shape-pop .grid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.shape-pop .sh{
  aspect-ratio:1;border:0;background:transparent;border-radius:var(--r-ctl);
  display:flex;align-items:center;justify-content:center;padding:4px;color:var(--ui-ink-2);
}
.shape-pop .sh:hover{background:var(--ui-accent-wash);color:var(--ui-accent)}
.shape-pop .sh svg{width:100%;height:100%;overflow:visible}
.shape-pop .sh svg path,.shape-pop .sh svg rect,.shape-pop .sh svg ellipse{fill:currentColor;stroke:none}
.shape-pop .sh svg .st{fill:none;stroke:currentColor;stroke-width:6}

/* 版式库 */
.tpl-pop{width:536px;padding:10px 12px}
.tpl-pop .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tpl-pop .tpl{
  border:1px solid var(--ui-line);background:var(--ui-surface);border-radius:var(--r-ctl);
  padding:0;display:flex;flex-direction:column;overflow:hidden;text-align:left;
  transition:box-shadow .12s ease,border-color .12s ease;
}
.tpl-pop .tpl:hover{border-color:var(--ui-accent);box-shadow:0 0 0 2px var(--ui-accent-wash)}
.tpl-pop .tpl .pv{display:block;line-height:0;border-bottom:1px solid var(--ui-line)}
.tpl-pop .tpl .cap{padding:6px 8px;font-size:11px;color:var(--ui-ink-2)}

/* 插入表格 */
.tbl-pick{width:248px;padding:10px}
.tbl-pick .lb{font-size:11.5px;color:var(--ui-ink-2);text-align:center;padding-bottom:8px;font-weight:600}
.tbl-pick .g{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.tbl-pick .g i{display:block;aspect-ratio:1;background:var(--ui-surface-2);border-radius:3px;cursor:pointer;box-shadow:inset 0 0 0 1px var(--ui-line-2)}
.tbl-pick .g i.on{background:var(--ui-accent);box-shadow:none}
.tbl-pick .more{
  margin-top:10px;width:100%;border:0;background:transparent;padding:7px 8px;border-radius:var(--r-ctl);
  display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ui-ink-2);
}
.tbl-pick .more:hover{background:var(--ui-hover)}

/* 图标库 */
.icon-pop{width:356px;padding:10px}
.icon-pop>.f-in{width:100%;margin-bottom:10px}
.icon-pop .list{max-height:54vh;overflow:auto}
.icon-pop .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.icon-pop .ic{
  aspect-ratio:1;border:0;background:transparent;border-radius:var(--r-ctl);
  display:flex;align-items:center;justify-content:center;padding:6px;color:var(--ui-ink-2);
}
.icon-pop .ic:hover{background:var(--ui-accent-wash);color:var(--ui-accent)}
.icon-pop .ic svg{width:100%;height:100%;overflow:visible}
.icon-pop .ic svg .st{fill:none;stroke:currentColor;stroke-width:6}

/* 切换效果库 */
.tr-pop{width:436px;padding:10px 12px}
.tr-pop h5{margin:8px 0 6px;font-size:10.5px;color:var(--ui-ink-4);font-weight:600}
.tr-pop .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tr-pop .tr{
  border:1px solid var(--ui-line);background:var(--ui-surface);border-radius:var(--r-ctl);
  display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px 6px;color:var(--ui-ink-3);
}
.tr-pop .tr:hover{border-color:var(--ui-accent);box-shadow:0 0 0 2px var(--ui-accent-wash);color:var(--ui-accent)}
.tr-pop .tr.on{border-color:var(--ui-accent);background:var(--ui-accent-wash);color:var(--ui-accent-ink)}
.tr-pop .tr .pv{line-height:0}
.tr-pop .tr .pv svg{width:58px;height:33px}
.tr-pop .tr .cap{font-size:10.5px}

/* 文字效果 */
.wa-pop{width:352px;padding:12px}
.wa-pop .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wa-pop .wa{
  border:1px solid var(--ui-line);background:var(--ui-surface);border-radius:var(--r-ctl);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:12px 4px 7px;
}
.wa-pop .wa:hover{border-color:var(--ui-accent);box-shadow:0 0 0 2px var(--ui-accent-wash)}
.wa-pop .wa .cap{font-size:10px;color:var(--ui-ink-4)}

/* 对话框 */
.dlg-mask{position:absolute;inset:0;background:rgba(20,23,26,.42);pointer-events:auto;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.dlg{
  background:var(--ui-surface);border-radius:14px;box-shadow:0 24px 64px rgba(20,23,26,.34);
  min-width:360px;max-width:min(700px,92vw);max-height:86vh;display:flex;flex-direction:column;
}
.dlg h3{margin:0;padding:16px 20px 12px;font-size:15px;font-weight:600;letter-spacing:-.015em}
.dlg .dlg-body{padding:0 20px 16px;overflow:auto;font-size:12.5px;line-height:1.8;user-select:text;color:var(--ui-ink-2)}
.dlg .dlg-body b{color:var(--ui-ink)}
.dlg .dlg-foot{padding:12px 20px 16px;display:flex;justify-content:flex-end;gap:8px}

.btn{
  height:30px;padding:0 16px;border:1px solid var(--ui-line-2);background:var(--ui-surface);
  border-radius:var(--r-ctl);font-size:12px;font-weight:500;color:var(--ui-ink-2);
  transition:background .12s ease,border-color .12s ease;
}
.btn:hover{background:var(--ui-hover);border-color:var(--ui-ink-4);color:var(--ui-ink)}
.btn.primary{background:var(--ui-accent);border-color:var(--ui-accent);color:#fff}
.btn.primary:hover{background:var(--ui-accent-deep);border-color:var(--ui-accent-deep)}
.btn.danger{color:var(--ui-danger);border-color:#EBC9C6}
.btn.danger:hover{background:#FCEDEC}

.toast{
  position:absolute;left:50%;bottom:52px;transform:translateX(-50%);
  background:rgba(20,23,26,.94);color:#fff;padding:10px 18px;border-radius:var(--r-pill);font-size:12px;
  pointer-events:none;box-shadow:0 8px 28px rgba(0,0,0,.32);max-width:70vw;backdrop-filter:blur(8px);
}
.toast.warn{background:var(--ui-danger)}
.toast.ok{background:var(--ui-ok)}

/* 拖放提示。
   注意这里必须显式写 display:none 兜底：作者样式里的 display:flex 会盖过
   UA 对 [hidden] 的 display:none，光靠 hidden 属性是关不掉的 —— 这块全屏蒙版
   曾经因此一直挂在最上层，把画布糊住，看起来像"预览不渲染"。
   现在用 .is-on 类控制显隐，hidden 属性只作语义标记。 */
.drop-hint{display:none}
.drop-hint.is-on{
  position:fixed;inset:0;z-index:200;background:rgba(20,23,26,.32);
  display:flex;align-items:center;justify-content:center;pointer-events:none;backdrop-filter:blur(3px);
}
.drop-hint div{
  background:var(--ui-surface);padding:18px 30px;border-radius:14px;font-size:13.5px;font-weight:600;
  box-shadow:var(--sh-pop);box-shadow:0 0 0 2px var(--ui-accent),var(--sh-pop);
}

.keys{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:8px 16px;align-items:center}
.keys kbd{
  background:var(--ui-surface-2);box-shadow:inset 0 0 0 1px var(--ui-line-2),0 1px 0 var(--ui-line-2);
  border-radius:5px;padding:2px 7px;font:11px/1.6 var(--font-ui);white-space:nowrap;color:var(--ui-ink-2);
}
.keys .h{grid-column:1/-1;font-weight:600;color:var(--ui-accent);padding-top:10px;font-size:11.5px}

/* 放映 */
.show-root{position:fixed;inset:0;z-index:300;background:#000;pointer-events:auto}
.show-root iframe{width:100%;height:100%;border:0;display:block}
.show-exit{
  position:fixed;top:14px;right:16px;z-index:301;background:rgba(20,23,26,.6);color:#fff;
  border:0;border-radius:var(--r-pill);padding:7px 16px;font-size:12px;backdrop-filter:blur(8px);
}
.show-exit:hover{background:rgba(20,23,26,.8)}

</style>
</head>
<body>

<!-- ============================ 标题栏 + 快速访问工具栏 ============================ -->
<header class="titlebar">
  <div class="qat" id="qat"></div>
  <div class="doc-title" id="doc-title">
    <span id="doc-name">未命名演示文稿</span><span id="doc-dirty" class="dirty-dot" hidden>•</span>
    <span class="doc-sub" id="doc-sub"></span>
  </div>
  <div class="titlebar-right">
    <button class="tb-btn" id="btn-help" title="快捷键一览 (F1)">?</button>
  </div>
</header>

<!-- ================================== 功能区 ================================== -->
<nav class="ribbon-tabs" id="ribbon-tabs"></nav>
<div class="ribbon" id="ribbon"></div>

<!-- ================================== 主工作区 ================================== -->
<main class="main">
  <!-- 左：幻灯片缩略图窗格 -->
  <aside class="pane pane-thumbs" id="pane-thumbs">
    <div class="thumbs-scroll" id="thumbs"></div>
    <div class="pane-foot" id="thumbs-foot"></div>
  </aside>
  <div class="splitter" id="split-thumbs" data-target="thumbs"></div>

  <!-- 中：画布 + 备注 -->
  <section class="center">
    <div class="stage-wrap" id="stage-wrap">
      <div class="ruler ruler-h" id="ruler-h"></div>
      <div class="ruler ruler-v" id="ruler-v"></div>
      <div class="ruler-corner"></div>
      <div class="stage" id="stage">
        <div class="slide-view" id="slide-view">
          <div class="sv-page" id="sv-page"></div>
          <div class="sv-overlay" id="sv-overlay"></div>
        </div>
      </div>
      <div class="stage-empty" id="stage-empty" hidden>
        <div class="se-inner">
          <h2>HTML PPT Editor</h2>
          <p>把 .html 演示文稿拖到这里打开，或者新建一份</p>
          <div class=" se-actions">
            <button class="btn primary" id="empty-new">新建空白演示文稿</button>
            <button class="btn" id="empty-open">打开文件…</button>
          </div>
        </div>
      </div>
    </div>

    var tx = node.querySelector('.ps-tx');
    if (tx && e.text) {

      if (tx.style.fontSize) e.text.size = px(tx.style.fontSize);
      if (tx.style.color) e.text.color = tx.style.color;

  }

  function readCanvasSlide(sec) {
    var shell = readSlideShell(sec);
    var host = sec.querySelector('.ps-canvas');
    var els = host ? U.$$(':scope > .ps-el', host).map(readCanvasElement) : [];
    var s = M.newSlide({
      title: shell.title, mode: 'canvas', notes: shell.notes, section: shell.section,
      transition: shell.transition,
      elements: els, attrs: shell.attrs, classes: shell.classes

  }

  /* ------------------------------------------------------------ 主入口 */
  /**
   * @param {string} html 单文件 deck 的完整 HTML 文本
   * @param {string} [filename]
   * @returns {{deck:Object, warnings:string[]}}
   */
  function parse(html, filename) {
    var warnings = [];
    var doc = new DOMParser().parseFromString(html, 'text/html');
    if (!doc || !doc.body) throw new Error('无法解析该 HTML 文件');

    /* ---- head ---- */
    var title = (doc.querySelector('title') || {}).textContent || (filename || '未命名演示文稿').replace(/\.html?$/i, '');
    var lang = doc.documentElement.getAttribute('lang') || 'zh-CN';

    /* 首尾空白一律去掉：序列化时会自己补换行，不修剪的话每存一次就多一圈空行。
       带 ps- 前缀 id 的样式块是 studio 每次导出重新生成的（主题覆盖 / 画布运行时），
       不能吃进 deck.css，否则「打开→保存」若干次后会叠出一堆重复规则。 */
    /* 换行统一成 \n：不这么做的话，CRLF 的源文件经过一次 DOM 往返会被规范化成 LF，
       于是「打开→保存」两次的输出长度对不上，看起来像内容漂移。 */
    var cssParts = [], themeCSS = '';
    U.$$('style', doc).forEach(function (s) {
      var t = s.textContent.replace(/\r\n/g, '\n').replace(/^\s*\n/, '').replace(/\s+$/, '');
      if (!t) return;
      /* 凡是 id 以 ps- 打头的样式块，都是 serializer 每次导出重新生成的
         （主题覆盖 / 画布运行时 / 切换效果 …），一律不吃进 deck.css，
         否则「打开→保存」几轮之后会叠出一堆重复规则。以后新增运行时样式
         只要沿用这个 id 前缀，就不用再改这里。 */
      if (s.id === 'ps-theme') { themeCSS = t; return; }
      if (/^ps-/.test(s.id || '')) return;
      cssParts.push(t);
    });

    var headExtra = [];
    U.$$('head > *', doc).forEach(function (n) {
      var tag = n.tagName.toLowerCase();
      if (tag === 'style' || tag === 'title') return;
      if (tag === 'meta') {
        var ch = n.getAttribute('charset'), nm = (n.getAttribute('name') || '').toLowerCase();
        if (ch != null || nm === 'viewport') return;   // 这两条 serializer 会重新写
      }
      if (tag === 'script') return;                    // 脚本统一归到 runtime
      headExtra.push(n.outerHTML);
    });

    /* ---- 定位 .deck ---- */
    var deckNode = doc.querySelector('.deck');
    if (!deckNode) {
      warnings.push('未找到 .deck 容器，已按「整个 body 视作一页」导入。');
    }

    /* ---- 脚本：ps-doc 单拎出来，其余全部当 runtime 原样保留 ---- */
    var docJSON = null, runtimeParts = [];
    U.$$('script', doc).forEach(function (s) {
      if (s.id === DOC_ID) {
        try { docJSON = JSON.parse(s.textContent); }
        catch (err) { warnings.push('内嵌工程数据（ps-doc）损坏，已退回按外来 deck 解析。'); }
        return;
      }
      if ((s.getAttribute('type') || '').indexOf('json') >= 0) return;
      if (/^ps-/.test(s.id || '')) return;   // 同上：ps- 前缀的脚本块由导出时重新生成
      if (s.src) { warnings.push('外链脚本 ' + s.src + ' 未被内联，导出后可能失效。'); return; }
      var js = s.textContent.replace(/\r\n/g, '\n').replace(/^\s*\n/, '').replace(/\s+$/, '');
      if (js) runtimeParts.push(js);
    });

    /* ---- body 里 .deck 之外的骨架（顶栏、编辑条等）原样留住 ---- */
    var pre = [], post = [], seenDeck = false;
    Array.prototype.forEach.call(doc.body.childNodes, function (n) {
      if (n === deckNode) { seenDeck = true; return; }
      if (n.nodeType === 1 && n.tagName.toLowerCase() === 'script') return;
      var frag = n.nodeType === 1 ? n.outerHTML : (n.nodeType === 3 ? n.nodeValue : '');
      if (n.nodeType === 3 && !frag.trim()) return;
      (seenDeck ? post : pre).push(frag);
    });

    var css = cssParts.join('\n\n');
    /* 主题：先从主样式表里读基线，再让 ps-theme 覆盖块盖上去 */
    var theme = U.assign(extractTheme(css), themeCSS ? extractTheme(themeCSS) : {});
    var deck = M.newDeck({
      title: title.trim(), lang: lang,
      css: css,
      runtime: runtimeParts.join('\n\n'),
      headExtra: headExtra.join('\n'),
      preDeckHTML: pre.join('\n').replace(/^\s+|\s+$/g, ''),
      postDeckHTML: post.join('\n').replace(/^\s+|\s+$/g, ''),
      theme: theme,
      themeAliases: detectAliases(css),
      origin: docJSON ? 'studio' : 'import'
    });

    /* ---- 幻灯片 ---- */
    var sections = deckNode ? U.$$(':scope > section.slide, :scope > .slide', deckNode) : [];
    if (!sections.length && !deckNode) {
      var s0 = M.newSlide({ title: deck.title, mode: 'flow' });
      s0.raw = doc.body.innerHTML;
      deck.slides = [s0];
      return { deck: deck, warnings: warnings };
    }

    deck.slides = sections.map(function (sec) {
      var isCanvas = sec.getAttribute('data-mode') === 'canvas';
      if (isCanvas) return readCanvasSlide(sec);
      var shell = readSlideShell(sec);
      /* 流式页上可能叠了自由对象层，同样要读回来 */
      var over = sec.querySelector('.ps-stage.ps-over');
      var host = over ? (over.querySelector('.ps-canvas') || over) : null;
      return M.newSlide({
        title: shell.title, mode: 'flow', notes: shell.notes, raw: shell.raw,
        section: shell.section, transition: shell.transition,
        attrs: shell.attrs, classes: shell.classes,
        elements: host ? U.$$(':scope > .ps-el', host).map(readCanvasElement) : []
      });
    });

    /* ---- 有工程数据就用它覆盖元数据（画布元素以 JSON 为准，flow raw 仍用 DOM） ---- */
    if (docJSON && Array.isArray(docJSON.slides)) {
      if (docJSON.sizeKey && M.SIZES[docJSON.sizeKey]) {
        deck.sizeKey = docJSON.sizeKey;
        deck.size = { w: M.SIZES[docJSON.sizeKey].w, h: M.SIZES[docJSON.sizeKey].h };
      }
      if (docJSON.size) deck.size = docJSON.size;
      if (docJSON.theme) deck.theme = U.assign({}, deck.theme, docJSON.theme);
      if (docJSON.themeAliases) deck.themeAliases = docJSON.themeAliases;
      if (docJSON.title) deck.title = docJSON.title;

      if (docJSON.slides.length !== deck.slides.length) {
        warnings.push('工程数据与页面数量不一致（' + docJSON.slides.length + ' vs ' + deck.slides.length + '），已按页面为准合并。');
      }
      deck.slides.forEach(function (s, i) {
        var j = docJSON.slides[i];
        if (!j) return;
        s.id = j.id || s.id;
        s.mode = j.mode || s.mode;
        s.title = j.title != null ? j.title : s.title;
        s.layout = j.layout || s.layout;
        s.hidden = !!j.hidden;
        s.background = j.background || null;
        if (j.transition) s.transition = j.transition;
        if (j.notes != null) s.notes = j.notes;
        if (j.section !== undefined) s.section = j.section;
        /* 有工程数据就以它为准 —— 从 DOM 反读只是没有 ps-doc 时的兜底，会丢主题引用、
           效果、锁定等模型里才有的信息。流式页上的叠加对象同样适用。 */
        if (Array.isArray(j.elements)) s.elements = j.elements;
      });
    }

    if (!deck.slides.length) {
      deck.slides = [M.newSlide({ title: '幻灯片 1', mode: 'canvas' })];
      warnings.push('文件中没有任何 .slide，已新建一张空白页。');
    }
    return { deck: deck, warnings: warnings };
  }

  return { parse: parse, extractTheme: extractTheme, detectAliases: detectAliases, DOC_ID: DOC_ID };
})();

</script>
<script>
/* ===== inlined: js/core/serializer.js ===== */
/* ===========================================================================
   HTML PPT Editor :: core/serializer.js
   DeckModel → 单文件 deck HTML（导出即可放映，双击就能演）。

   保真策略：
   · 导入进来的 CSS / runtime / body 骨架原样吐回，不做任何重排重写；
   · 主题令牌若被改过，只在样式表末尾追加一条 body{} 覆盖规则 —— 靠层叠生效，
     不去动原文件里那段带注释的品牌色声明，避免把人家的注释改烂；
   · 画布页额外写出 .ps-* 运行时（CSS + 缩放脚本），且只在真有画布页时写；
   · 末尾内嵌 <script type="application/json" id="ps-doc"> 工程数据，
     下次用 studio 打开可无损续编（flow 页的 raw 不进 JSON，避免体积翻倍）。
   =========================================================================== */
var PS = window.PS || (window.PS = {});

PS.serializer = (function () {
  'use strict';
  var U = PS.util, M = PS.model, R = PS.render;

  /* JSON 里若出现 <\/script 会提前关掉标签，必须转义 */
  function safeJSON(obj) {
    return JSON.stringify(obj).replace(/<\/script/gi, '<\\/script').replace(/<!\--/g, '<\\u0021--');
  }

  /**
   * 主题覆盖块。两种情况要写：
   *  a) 有令牌被改过；
   *  b) 这份 deck 的样式表里根本没有 --ps-* 规范令牌（导入的外来 deck），
   *     此时必须补齐，否则对象上的 var(--ps-accent) 解析不出颜色。
   * 若原 deck 用的是别名令牌，规范名与别名一起写 —— 它自己的组件引用的是别名，
   * 不一起写的话「改主题」只会让新加的对象变色，原有组件纹丝不动。
   */
  function themeOverrideCSS(deck) {
    var changed = [], all = [];
    M.THEME_KEYS.forEach(function (t) {
      var v = deck.theme[t.k] || M.DEFAULT_THEME[t.k];
      all.push({ k: t.k, v: v });
      if (deck.theme[t.k] && deck.theme[t.k] !== M.DEFAULT_THEME[t.k]) changed.push(t.k);
    });
    var aliases = deck.themeAliases || [];
    var needBase = aliases.length > 0 || (deck.css || '').indexOf('--ps-accent') < 0;
    if (!changed.length && !needBase) return '';

    var lines = [];
    (needBase ? all : all.filter(function (t) { return changed.indexOf(t.k) >= 0; }))
      .forEach(function (t) {
        lines.push('  ' + t.k + ':' + t.v + ';');
        (M.ALIASES_OF[t.k] || []).forEach(function (a) {
          if (aliases.indexOf(a) >= 0) lines.push('  ' + a + ':' + t.v + ';');
        });
      });
    if (!lines.length) return '';
    return '\n/* ---- HTML PPT Editor :: 主题令牌覆盖 ---- */\nbody{\n' + lines.join('\n') + '\n}\n';
  }

  function slideHTML(slide, deck, isFirst) {
    var classes = (slide.classes || ['slide']).slice();
    if (classes.indexOf('slide') < 0) classes.unshift('slide');
    if (isFirst) classes.push('is-active');

    var attrs = ' class="' + classes.join(' ') + '"';
    if (slide.title) attrs += ' data-title="' + U.escAttr(slide.title) + '"';
    if (slide.mode === 'canvas') attrs += ' data-mode="canvas"';
    if (slide.hidden) attrs += ' data-hidden="1"';
    if (slide.section != null) attrs += ' data-section="' + U.escAttr(slide.section) + '"';
    if (slide.transition && slide.transition.type && slide.transition.type !== 'none') {
      attrs += ' data-transition="' + slide.transition.type + '"' +
        ' data-transition-dur="' + (slide.transition.dur || 500) + '"' +
        ' data-transition-dir="' + (slide.transition.dir || 'left') + '"';
    }
    for (var k in slide.attrs) {
      if (!Object.prototype.hasOwnProperty.call(slide.attrs, k)) continue;
      if (/^(class|data-title|data-mode|data-hidden|data-section|data-transition|data-transition-dur|data-transition-dir)$/.test(k)) continue;
      attrs += ' ' + k + '="' + U.escAttr(slide.attrs[k]) + '"';
    }

    var body = R.slideInnerHTML(slide, deck);
    var notes = slide.notes ? '\n  <aside class="notes">' + slide.notes + '</aside>' : '';
    return '<section' + attrs + '>\n' + body + notes + '\n</section>';
  }

  /** 工程数据：足够无损续编，又不重复存 flow 页的大段 raw */
  function projectJSON(deck) {
    return {
      v: 1,
      app: 'html-ppt-editor',
      title: deck.title,
      sizeKey: deck.sizeKey,
      size: deck.size,
      theme: deck.theme,
      themeAliases: deck.themeAliases || [],
      slides: deck.slides.map(function (s) {
        var o = {
          id: s.id, mode: s.mode, title: s.title, layout: s.layout,
          hidden: !!s.hidden, transition: s.transition
        };
        if (s.section != null) o.section = s.section;
        if (s.background) o.background = s.background;
        /* flow 页也可能挂了叠加对象，一并存 */
        if (s.elements && s.elements.length) o.elements = s.elements;
        else if (s.mode === 'canvas') o.elements = [];
        return o;
      })
    };
  }

  /**
   * @param {Object} deck
   * @param {Object} [opt] {includeProject:boolean 默认 true}
   * @returns {string} 完整 HTML 文本
   */
  function toHTML(deck, opt) {
    opt = opt || {};
    /* 只要有画布页、或有挂了自由对象的流式页，就得带上 .ps-* 运行时 */
    var hasCanvas = deck.slides.some(function (s) {
      return s.mode === 'canvas' || (s.elements && s.elements.length);
    });
    var hasTransition = PS.transition && PS.transition.used(deck);

    var css = deck.css || (PS.template ? PS.template.css : '');
    var runtime = deck.runtime || (PS.template ? PS.template.js : '');

    var themeCSS = themeOverrideCSS(deck).replace(/^\s*\n/, '').replace(/\s+$/, '');

    var sections = deck.slides.map(function (s, i) { return slideHTML(s, deck, i === 0); }).join('\n\n');

    var out = [];
    out.push('<!DOCTYPE html>');
    out.push('<html lang="' + (deck.lang || 'zh-CN') + '">');
    out.push('<head>');
    out.push('<meta charset="UTF-8">');
    out.push('<meta name="viewport" content="width=device-width, initial-scale=1">');
    out.push('<title>' + U.escHTML(deck.title) + '</title>');
    if (deck.headExtra) out.push(deck.headExtra);
    out.push('<style>');
    out.push(css);
    out.push('</style>');
    /* 主题覆盖与画布运行时各自带 id 独立成块 —— parser 按 id 跳过它们，
       所以反复「打开→保存」不会把这两段重复追加进 deck.css。 */
    if (themeCSS) {
      out.push('<style id="ps-theme">');
      out.push(themeCSS);
      out.push('</style>');
    }
    if (hasCanvas) {
      out.push('<style id="ps-canvas-css">');
      out.push(R.CANVAS_CSS);
      out.push('</style>');
    }
    if (hasTransition) {
      out.push('<style id="ps-tr-css">');
      out.push(PS.transition.CSS);
      out.push('</style>');
    }
    out.push('</head>');
    out.push('<body>');
    if (deck.preDeckHTML) out.push(deck.preDeckHTML);
    out.push('');
    out.push('<div class="deck">');
    out.push(sections);
    out.push('</div>');
    if (deck.postDeckHTML) out.push(deck.postDeckHTML);
    out.push('');
    if (opt.includeProject !== false) {
      out.push('<script type="application/json" id="' + PS.parser.DOC_ID + '">');
      out.push(safeJSON(projectJSON(deck)));
      out.push('<' + '/script>');
    }
    out.push('<script>');
    out.push(runtime);
    out.push('<' + '/script>');
    if (hasCanvas) {
      out.push('<script id="ps-canvas-js">');
      out.push(R.CANVAS_JS);
      out.push('<' + '/script>');
    }
    out.push('</body>');
    out.push('</html>');
    return out.join('\n');
  }

  /** 建议文件名 */
  function filenameFor(deck) {
    var t = (deck.title || 'presentation').replace(/[\\\/:*?"<>|]/g, '_').trim() || 'presentation';
    return t + '.html';
  }

  return { toHTML: toHTML, projectJSON: projectJSON, filenameFor: filenameFor, themeOverrideCSS: themeOverrideCSS };
})();

</script>
<script>
/* ===== inlined: runtime/template.js ===== */
/* ===========================================================================
   HTML PPT Editor :: runtime/template.js  —— 自动生成，请勿手工编辑
   由 tools\gen-template.ps1 从 src/runtime/base.css + runtime.js 生成。
   新建演示文稿时用它作默认样式表与放映运行时；导入既有 deck 时用文件自带的那份。
   =========================================================================== */
var PS = window.PS || (window.PS = {});
PS.template = {
  css: "/* ===========================================================================\n   HTML PPT Editor :: 默认基础样式表（本工具自带，随新建的演示文稿一起导出）\n\n   只做两件事：\n   1) 定义主题令牌 --ps-*  —— 全文档配色的唯一开关，改一处全局跟随；\n   2) 提供放映外壳 .deck/.slide 及其配套（备注、页码、进度条、总览、打印）。\n\n   页面内容本身不在这里 —— 画布页的对象样式由 render.js 生成并内联，\n   所以这份表很薄，换主题、改版式都不需要动它。\n   =========================================================================== */\n\n*,*::before,*::after{box-sizing:border-box}\nhtml,body{margin:0;padding:0;height:100%}\nhtml{background:#000}\nimg,svg,video,canvas{max-width:100%;display:block}\n\nbody{\n  /* ---------- 主题令牌 · 强调色 ----------\n     主色1 #2A75AE / 主色2 #0086D6 / 主色3 #3C8FCE 三支蓝构成主色系，\n     另外三档（strong / soft / wash / deep）由主色1 推导，保证明度阶梯均匀。 */\n  --ps-accent:#2A75AE;          /* 主色1：标题锚点、主要色块 */\n  --ps-accent-strong:#225E8B;   /* 主色1 压暗：封面、章节页、结尾 */\n  --ps-accent-mid:#3C8FCE;      /* 主色3：次要强调、辅助色块 */\n  --ps-accent-soft:#C3D8E8;     /* 主色1 淡化：徽章、进度底、分隔 */\n  --ps-accent-wash:#F0F5F9;     /* 极浅底：标签底、结论块底 */\n  --ps-accent-deep:#13354E;     /* 最深：封面/结尾渐变深端 */\n\n  /* ---------- 主题令牌 · 墨色四级（--ps-ink-4 用次色2 中性灰） ---------- */\n  --ps-ink:#1A1A1A;             /* 正文 */\n  --ps-ink-2:#2D3748;           /* 次级 */\n  --ps-ink-3:#4A5568;           /* 三级、说明文字 */\n  --ps-ink-4:#7F7F7F;           /* 次色2：弱化、脚注 */\n\n  /* ---------- 主题令牌 · 结构色 ---------- */\n  --ps-rule:#DCE6EE;            /* 分隔线 */\n  --ps-rule-soft:#EDF2F7;       /* 浅分隔线 */\n  --ps-canvas:#FFFFFF;          /* 页面底色 */\n  --ps-canvas-alt:#F3F5F7;      /* 交替底色：两张浅色页相邻时用它岔开节奏 */\n  --ps-surface:#FFFFFF;         /* 卡片底色 */\n\n  /* ---------- 主题令牌 · 暗场 ----------\n     整屏近黑是版式节奏的主要手段：靠底色切换分段，不靠边框和装饰线。 */\n  --ps-dark:#16181C;            /* 暗场底色 */\n  --ps-dark-2:#1E2229;          /* 暗场次级：两张暗页相邻时的微差 */\n  --ps-on-dark:#FFFFFF;         /* 暗场上的主文字 */\n  --ps-on-dark-muted:#A6ADB6;   /* 暗场上的次要文字 */\n  --ps-accent-on-dark:#5FA9E4;  /* 暗场强调色：主色在近黑上会发闷，提亮一档 */\n\n  /* ---------- 主题令牌 · 语义色（--ps-info 用主色2，--ps-good 用次色1） ---------- */\n  --ps-bad:#C4453A;             /* 警示 */\n  --ps-warn:#D98A12;            /* 关注 */\n  --ps-good:#29736F;            /* 次色1：达成 */\n  --ps-gold:#A8781C;            /* 强调 */\n  --ps-info:#0086D6;            /* 主色2：信息、高亮 */\n  --ps-violet:#6D48C4;          /* 特殊 */\n\n  /* ---------- 字号阶梯 ----------\n     clamp(下限, 视口比例, 上限)：笔记本 / 大屏 / 会议室投影仪共用一份排版，\n     字既不会小到看不清，也不会大到撑破版心。\n     大字号一律配负字距：字号越大，字面间的视觉空隙越显松，收紧才成句。 */\n  --ps-fs-hero:clamp(44px,5.6vw,108px);\n  --ps-fs-display:clamp(32px,3.9vw,74px);\n  --ps-fs-title:clamp(24px,2.7vw,46px);\n  --ps-fs-lead:clamp(17px,1.7vw,30px);\n  --ps-fs-sub:clamp(15px,1.4vw,24px);\n  --ps-fs-body:clamp(14px,1.18vw,19px);\n  --ps-fs-sm:clamp(12px,0.98vw,16px);\n  --ps-fs-xs:clamp(10px,0.8vw,13px);\n  --ps-fs-num:clamp(40px,4.6vw,88px);\n\n  /* ---------- 字重阶梯 ----------\n     只用 300 / 400 / 600 / 700 四档，刻意跳过 500：\n     中间档会让\"轻\"和\"重\"都不明确，层级反而糊掉。 */\n  --ps-w-light:300;\n  --ps-w-regular:400;\n  --ps-w-medium:600;\n  --ps-w-bold:700;\n\n  /* ---------- 字距 ---------- */\n  --ps-ls-hero:-0.028em;\n  --ps-ls-display:-0.022em;\n  --ps-ls-title:-0.015em;\n  --ps-ls-body:-0.005em;\n\n  /* ---------- 结构量 ----------\n     8 的倍数为骨架；整屏留白按 section 走，不靠边框分区。 */\n  --ps-pad-x:7vw;\n  --ps-pad-y:8vh;\n  --ps-gap:24px;\n  --ps-section:80px;\n  --ps-radius:0px;         /* 整屏色块不圆角：底色变化本身就是分隔 */\n  --ps-radius-card:14px;\n  --ps-radius-pill:999px;\n\n  /* ---------- 唯一的一处投影 ----------\n     只给\"实物/画面\"用，卡片、按钮、文字一律不投影：\n     阴影是为了让画面有重量，不是拿来做层级的。 */\n  --ps-shadow-art:0 18px 48px rgba(0,0,0,.22);\n\n  background:#000;\n  color:var(--ps-ink);\n  font-family:\u0027PingFang SC\u0027,\u0027Microsoft YaHei\u0027,\u0027Noto Sans SC\u0027,-apple-system,BlinkMacSystemFont,\u0027Segoe UI\u0027,sans-serif;\n  -webkit-font-smoothing:antialiased;\n  -moz-osx-font-smoothing:grayscale;\n}\n\n/* ============================== 放映舞台 ============================== */\n.deck{position:relative;width:100vw;height:100vh;overflow:hidden;background:#000}\n.slide{\n  position:absolute;inset:0;\n  display:flex;flex-direction:column;\n  padding:var(--ps-pad-y) var(--ps-pad-x);\n  background:var(--ps-canvas);\n  color:var(--ps-ink);\n  font-size:var(--ps-fs-body);\n  opacity:0;pointer-events:none;\n  transform:translateX(24px);\n  transition:opacity .38s cubic-bezier(.4,0,.2,1),transform .38s cubic-bezier(.4,0,.2,1);\n  overflow:hidden;\n}\n.slide.is-active{opacity:1;pointer-events:auto;transform:none;z-index:2}\n.slide.is-prev{transform:translateX(-24px)}\n\n/* 基础排版：给不带任何组件的朴素页兜底 */\n.slide h1{font-size:var(--ps-fs-title);line-height:1.1;letter-spacing:var(--ps-ls-title);\n  margin:0 0 .45em;color:var(--ps-ink);font-weight:var(--ps-w-medium)}\n.slide h2{font-size:var(--ps-fs-lead);line-height:1.25;letter-spacing:var(--ps-ls-title);\n  margin:0 0 .5em;color:var(--ps-ink-2);font-weight:var(--ps-w-regular)}\n.slide p{margin:0 0 .8em;line-height:1.6;letter-spacing:var(--ps-ls-body)}\n.slide ul,.slide ol{margin:0 0 .8em;padding-left:1.4em;line-height:1.9}\n.slide a{color:var(--ps-accent);text-decoration:none}\n.slide strong{font-weight:var(--ps-w-medium);color:inherit}\n.slide code,.slide kbd,.slide pre{font-family:\u0027JetBrains Mono\u0027,\u0027Cascadia Code\u0027,Consolas,monospace}\n\n/* ---- 暗场页：整屏底色一换，文字色跟着翻转，不用逐个元素改 ---- */\n.slide.is-dark{background:var(--ps-dark);color:var(--ps-on-dark)}\n.slide.is-dark h1,.slide.is-dark h2{color:var(--ps-on-dark)}\n.slide.is-dark a{color:var(--ps-accent-on-dark)}\n.slide.is-alt{background:var(--ps-canvas-alt)}\n\n/* ============================== 备注 ============================== */\n/* 备注永远不出现在观众屏上，只在备注抽屉（N）和演讲者视图里显示 */\n.notes{display:none!important}\n.ps-notes-drawer{\n  position:fixed;left:0;right:0;bottom:0;max-height:44vh;z-index:40;\n  background:rgba(22,24,29,.96);color:#E8EBF2;\n  padding:20px 32px;font-size:16px;line-height:1.75;\n  border-top:1px solid rgba(255,255,255,.12);\n  transform:translateY(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);\n  overflow:auto;\n}\n.ps-notes-drawer.is-open{transform:none}\n.ps-notes-drawer:empty::before{content:\u0027这一页没有备注\u0027;color:#8A929E}\n\n/* ============================== 页码 / 进度条 ============================== */\n.ps-page-num{\n  position:fixed;right:calc(var(--ps-pad-x) * .6);bottom:calc(var(--ps-pad-y) * .5);\n  z-index:20;font-size:var(--ps-fs-xs);color:var(--ps-ink-4);letter-spacing:.06em;\n  font-variant-numeric:tabular-nums;\n}\n.ps-progress{position:fixed;left:0;right:0;bottom:0;height:3px;z-index:20;background:rgba(0,0,0,.06)}\n.ps-progress\u003espan{display:block;height:100%;width:0;background:var(--ps-accent);transition:width .3s ease}\n\n/* ============================== 总览（O 键） ============================== */\n.ps-overview{\n  position:fixed;inset:0;z-index:50;display:none;overflow:auto;padding:36px;\n  background:rgba(12,14,18,.93);backdrop-filter:blur(10px);\n}\n.ps-overview.is-open{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;align-content:start}\n.ps-ov-item{\n  position:relative;aspect-ratio:16/9;background:#fff;border-radius:8px;overflow:hidden;\n  cursor:pointer;border:2px solid transparent;transition:transform .16s ease,border-color .16s ease;\n}\n.ps-ov-item:hover{transform:scale(1.035)}\n.ps-ov-item.is-current{border-color:var(--ps-accent-mid)}\n.ps-ov-item iframe{width:100%;height:100%;border:0;pointer-events:none;transform-origin:0 0}\n.ps-ov-item .n{\n  position:absolute;top:6px;left:8px;z-index:2;font-size:11px;font-weight:700;color:#fff;\n  background:rgba(0,0,0,.55);border-radius:3px;padding:1px 6px;\n}\n.ps-ov-item .t{\n  position:absolute;left:0;right:0;bottom:0;z-index:2;padding:14px 10px 6px;font-size:11px;color:#fff;\n  background:linear-gradient(transparent,rgba(0,0,0,.7));\n  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\n}\n.ps-ov-item.is-hidden{opacity:.45}\n\n/* ============================== 提示条 ============================== */\n.ps-hint{\n  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;\n  background:rgba(22,24,29,.9);color:#fff;font-size:13px;padding:7px 16px;border-radius:5px;\n  pointer-events:none;opacity:0;transition:opacity .25s ease;\n}\n.ps-hint.is-on{opacity:1}\n\n.ps-hidden{display:none!important}\n\n/* ============================== 打印 / 导出 PDF ============================== */\n@media print{\n  html,body{background:#fff}\n  .deck{width:auto;height:auto;overflow:visible}\n  .slide{\n    position:relative;inset:auto;opacity:1!important;transform:none!important;\n    page-break-after:always;break-after:page;\n    width:100%;height:100vh;\n  }\n  .slide:last-child{page-break-after:auto;break-after:auto}\n  .ps-progress,.ps-overview,.ps-notes-drawer,.ps-hint,.ps-page-num{display:none!important}\n}\n\n/* ============================== 无障碍 ============================== */\n@media (prefers-reduced-motion:reduce){\n  .slide{transition:none}\n  .ps-notes-drawer{transition:none}\n}",
  js: "/* ===========================================================================\n   HTML PPT Editor :: 放映运行时（本工具自带，随导出的演示文稿一起写出）\n\n   零依赖，单文件内联即可放映。提供：\n     ← → / 空格 / PgUp PgDn / Home End    翻页\n     F   全屏          N  备注抽屉        O  幻灯片总览\n     S   演讲者视图（新窗口，当前页 + 下一页 + 备注 + 计时，BroadcastChannel 同步）\n     B   黑屏          W  白屏            Esc 关闭浮层\n     URL #/N 深链      进度条与页码自动维护\n   放映时会跳过 data-hidden=\"1\" 的页。\n   =========================================================================== */\n(function () {\n  \u0027use strict\u0027;\n\n  function ready(fn) {\n    if (document.readyState !== \u0027loading\u0027) fn();\n    else document.addEventListener(\u0027DOMContentLoaded\u0027, fn);\n  }\n\n  ready(function () {\n    var deck = document.querySelector(\u0027.deck\u0027);\n    if (!deck) return;\n    var slides = [].slice.call(deck.querySelectorAll(\u0027.slide\u0027));\n    if (!slides.length) return;\n\n    /* 放映序列：隐藏页不参与，但仍留在 DOM 里（导出文件同时也是存档） */\n    var order = slides.filter(function (s) { return s.getAttribute(\u0027data-hidden\u0027) !== \u00271\u0027; });\n    if (!order.length) order = slides;\n\n    var idx = 0;\n    var chan = null;\n    try { chan = new BroadcastChannel(\u0027ps-deck-\u0027 + (document.title || \u0027deck\u0027)); } catch (e) {}\n\n    /* ------------------------------------------------------- 画布页缩放 */\n    function fitCanvases() {\n      var list = document.querySelectorAll(\u0027.ps-canvas\u0027);\n      for (var i = 0; i \u003c list.length; i++) {\n        var c = list[i], host = c.parentNode;\n        if (!host) continue;\n        var bw = host.clientWidth, bh = host.clientHeight;\n        if (!bw || !bh) continue;\n        var w = parseFloat(c.getAttribute(\u0027data-w\u0027)) || 1280;\n        var h = parseFloat(c.getAttribute(\u0027data-h\u0027)) || 720;\n        c.style.setProperty(\u0027--ps-k\u0027, Math.min(bw / w, bh / h));\n      }\n    }\n\n    /* ------------------------------------------------------------ 外壳 */\n    var progress = el(\u0027div\u0027, \u0027ps-progress\u0027, \u0027\u003cspan\u003e\u003c/span\u003e\u0027);\n    var pageNum = el(\u0027div\u0027, \u0027ps-page-num\u0027, \u0027\u0027);\n    var drawer = el(\u0027div\u0027, \u0027ps-notes-drawer\u0027, \u0027\u0027);\n    var overview = el(\u0027div\u0027, \u0027ps-overview\u0027, \u0027\u0027);\n    var hint = el(\u0027div\u0027, \u0027ps-hint\u0027, \u0027\u0027);\n    [progress, pageNum, drawer, overview, hint].forEach(function (n) { document.body.appendChild(n); });\n\n    function el(tag, cls, html) {\n      var n = document.createElement(tag);\n      if (cls) n.className = cls;\n      if (html != null) n.innerHTML = html;\n      return n;\n    }\n\n    var hintTimer = null;\n    function say(text, ms) {\n      hint.textContent = text;\n      hint.classList.add(\u0027is-on\u0027);\n      clearTimeout(hintTimer);\n      hintTimer = setTimeout(function () { hint.classList.remove(\u0027is-on\u0027); }, ms || 1400);\n    }\n\n    /* -------------------------------------------------- 页面切换效果\n       每页的效果写在 data-transition 上，配套的 keyframes 由导出时写进\n       \u003cstyle id=\"ps-tr-css\"\u003e。这里只负责挑动画名、挂类、到点摘掉。 */\n    function animNames(type, dir) {\n      dir = dir || \u0027left\u0027;\n      switch (type) {\n        case \u0027fade\u0027: return [\u0027ps-fade-in\u0027, \u0027ps-fade-out\u0027];\n        case \u0027dissolve\u0027: return [\u0027ps-dissolve-in\u0027, \u0027ps-dissolve-out\u0027];\n        case \u0027zoom\u0027: return [\u0027ps-zoom-in\u0027, \u0027ps-zoom-out\u0027];\n        case \u0027push\u0027: return [\u0027ps-push-in-\u0027 + dir, \u0027ps-push-out-\u0027 + dir];\n        case \u0027wipe\u0027: return [\u0027ps-wipe-in-\u0027 + dir, \u0027ps-hold\u0027];\n        case \u0027cover\u0027: return [\u0027ps-cover-in-\u0027 + dir, \u0027ps-hold\u0027];\n        case \u0027uncover\u0027: return [\u0027ps-fade-in\u0027, \u0027ps-uncover-out-\u0027 + dir];\n        case \u0027split\u0027: return [\u0027ps-split-in\u0027, \u0027ps-hold\u0027];\n        case \u0027reveal\u0027: return [\u0027ps-reveal-in\u0027, \u0027ps-hold\u0027];\n        case \u0027flip\u0027: return [\u0027ps-flip-in-\u0027 + dir, \u0027ps-flip-out-\u0027 + dir];\n        case \u0027cube\u0027: return [\u0027ps-cube-in-\u0027 + dir, \u0027ps-cube-out-\u0027 + dir];\n        case \u0027fall\u0027: return [\u0027ps-fall-in\u0027, \u0027ps-fall-out\u0027];\n        case \u0027rise\u0027: return [\u0027ps-rise-in\u0027, \u0027ps-rise-out\u0027];\n        default: return null;\n      }\n    }\n    var trTimer = null;\n    function clearTr() {\n      clearTimeout(trTimer);\n      slides.forEach(function (s) {\n        s.classList.remove(\u0027ps-tr-in\u0027, \u0027ps-tr-out\u0027);\n        s.style.animationName = \u0027\u0027;\n        s.style.removeProperty(\u0027--ps-td\u0027);\n      });\n      deck.classList.remove(\u0027ps-tr-3d\u0027);\n    }\n    /** 进场页决定用什么效果 —— 与 PowerPoint 一致：切换属于\"要出现的那一页\" */\n    function runTransition(fromEl, toEl) {\n      clearTr();\n      if (!toEl) return;\n      var type = toEl.getAttribute(\u0027data-transition\u0027);\n      if (!type || type === \u0027none\u0027) return;\n      var names = animNames(type, toEl.getAttribute(\u0027data-transition-dir\u0027));\n      if (!names) return;\n      var dur = parseInt(toEl.getAttribute(\u0027data-transition-dur\u0027), 10) || 500;\n      if (type === \u0027flip\u0027 || type === \u0027cube\u0027) deck.classList.add(\u0027ps-tr-3d\u0027);\n\n      toEl.style.setProperty(\u0027--ps-td\u0027, dur + \u0027ms\u0027);\n      toEl.style.animationName = names[0];\n      toEl.classList.add(\u0027ps-tr-in\u0027);\n      if (fromEl \u0026\u0026 fromEl !== toEl \u0026\u0026 names[1] !== \u0027ps-hold\u0027) {\n        /* 离场页要在动画期间继续可见，否则只剩新页在动，看不出\"切换\" */\n        fromEl.classList.add(\u0027is-active\u0027, \u0027ps-tr-out\u0027);\n        fromEl.style.setProperty(\u0027--ps-td\u0027, dur + \u0027ms\u0027);\n        fromEl.style.animationName = names[1];\n      }\n      trTimer = setTimeout(function () {\n        if (fromEl \u0026\u0026 fromEl !== toEl) fromEl.classList.remove(\u0027is-active\u0027);\n        clearTr();\n      }, dur + 40);\n    }\n\n    /* ------------------------------------------------------------ 翻页 */\n    function show(i, silent) {\n      i = Math.max(0, Math.min(order.length - 1, i));\n      var prev = idx;\n      var fromEl = order[prev];\n      idx = i;\n      clearTr();\n      slides.forEach(function (s) { s.classList.remove(\u0027is-active\u0027, \u0027is-prev\u0027); });\n      if (prev \u003e idx \u0026\u0026 order[prev]) order[prev].classList.add(\u0027is-prev\u0027);\n      order[idx].classList.add(\u0027is-active\u0027);\n      if (prev !== idx) runTransition(fromEl, order[idx]);\n\n      pageNum.textContent = (idx + 1) + \u0027 / \u0027 + order.length;\n      progress.firstChild.style.width = ((idx + 1) / order.length * 100) + \u0027%\u0027;\n      var note = order[idx].querySelector(\u0027.notes\u0027);\n      drawer.innerHTML = note ? note.innerHTML : \u0027\u0027;\n\n      if (!silent) {\n        try { history.replaceState(null, \u0027\u0027, \u0027#/\u0027 + (idx + 1)); } catch (e) {}\n        if (chan) chan.postMessage({ type: \u0027goto\u0027, idx: idx });\n      }\n      fitCanvases();\n    }\n    function next() { if (idx \u003c order.length - 1) show(idx + 1); else say(\u0027已经是最后一页\u0027); }\n    function prev() { if (idx \u003e 0) show(idx - 1); else say(\u0027已经是第一页\u0027); }\n\n    /* ------------------------------------------------------------ 总览 */\n    var ovBuilt = false;\n    function buildOverview() {\n      if (ovBuilt) return;\n      ovBuilt = true;\n      order.forEach(function (s, i) {\n        var item = el(\u0027div\u0027, \u0027ps-ov-item\u0027 + (s.getAttribute(\u0027data-hidden\u0027) === \u00271\u0027 ? \u0027 is-hidden\u0027 : \u0027\u0027));\n        item.appendChild(el(\u0027span\u0027, \u0027n\u0027, String(i + 1))); ;} else {acc+=Date.now()-t0;paused=true;pp.textContent=\"继续\";} };\u0027 +\n        \u0027 setInterval(function(){ var ms=acc+(paused?0:Date.now()-t0); var s=Math.floor(ms/1000);\u0027 +\n        \u0027   document.getElementById(\"clock\").textContent=String(Math.floor(s/60)).padStart(2,\"0\")+\":\"+String(s%60).padStart(2,\"0\");\u0027 +\n        \u0027   document.getElementById(\"wall\").textContent=new Date().toLocaleTimeString(); },500);\u0027 +\n        \u0027 window.addEventListener(\"resize\",fit); paint(); }\u0027 +\n        \u0027window.__psBoot=boot; if(window.__psMeta)boot();\u0027 +\n        \u0027})();\u0027;\n    }\n\n    /* --------------------------------- 单页模式（演讲者视图的预览用） */\n    var only = /[?\u0026]ps-only=(\\d+)/.exec(location.search);\n    if (only) {\n      var k = parseInt(only[1], 10) - 1;\n      slides.forEach(function (s, i) { s.classList.toggle(\u0027is-active\u0027, order.indexOf(s) === k); });\n      [progress, pageNum, drawer, overview, hint].forEach(function (n) { n.style.display = \u0027none\u0027; });\n      fitCanvases();\n      window.addEventListener(\u0027resize\u0027, fitCanvases);\n      return;   // 单页预览不装键盘与同步\n    }\n\n    /* ------------------------------------------------------------ 键盘 */\n    document.addEventListener(\u0027keydown\u0027, function (e) {\n      if (e.target \u0026\u0026 /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;\n      if (e.ctrlKey || e.metaKey || e.altKey) return;\n      var k = e.key;\n      if (k === \u0027ArrowRight\u0027 || k === \u0027PageDown\u0027 || k === \u0027 \u0027 || k === \u0027Enter\u0027) { e.preventDefault(); next(); }\n      else if (k === \u0027ArrowLeft\u0027 || k === \u0027PageUp\u0027 || k === \u0027Backspace\u0027) { e.preventDefault(); prev(); }\n      else if (k === \u0027Home\u0027) { e.preventDefault(); show(0); }\n      else if (k === \u0027End\u0027) { e.preventDefault(); show(order.length - 1); }\n      else if (k === \u0027Escape\u0027) { overview.classList.remove(\u0027is-open\u0027); drawer.classList.remove(\u0027is-open\u0027); if (blank) toggleBlank(); }\n      else {\n        switch (k.toLowerCase()) {\n          case \u0027f\u0027:\n            if (document.fullscreenElement) document.exitFullscreen();\n            else document.documentElement.requestFullscreen \u0026\u0026 document.documentElement.requestFullscreen();\n            break;\n          case \u0027n\u0027: drawer.classList.toggle(\u0027is-open\u0027); break;\n          case \u0027o\u0027: toggleOverview(); break;\n          case \u0027s\u0027: openPresenter(); break;\n          case \u0027b\u0027: toggleBlank(\u0027#000\u0027); break;\n          case \u0027w\u0027: toggleBlank(\u0027#fff\u0027); break;\n          case \u0027g\u0027: {\n            var v = window.prompt(\u0027跳转到第几页？(1-\u0027 + order.length + \u0027)\u0027, String(idx + 1));\n            if (v) show(parseInt(v, 10) - 1);\n            break;\n          }\n          case \u0027h\u0027: say(\u0027← → 翻页 · F 全屏 · N 备注 · O 总览 · S 演讲者视图 · B/W 黑白屏 · G 跳页\u0027, 3600); break;\n        }\n      }\n    });\n\n    /* -------------------------------------------------- 触屏 / 点击翻页 */\n    var tx = 0, ty = 0;\n    document.addEventListener(\u0027touchstart\u0027, function (e) {\n      tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY;\n    }, { passive: true });\n    document.addEventListener(\u0027touchend\u0027, function (e) {\n      var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;\n      if (Math.abs(dx) \u003e 60 \u0026\u0026 Math.abs(dx) \u003e Math.abs(dy)) dx \u003c 0 ? next() : prev();\n    }, { passive: true });\n\n    /* ------------------------------------------------------------ 同步 */\n    if (chan) {\n      chan.onmessage = function (e) {\n        if (e.data \u0026\u0026 e.data.type === \u0027goto\u0027 \u0026\u0026 e.data.idx !== idx) show(e.data.idx, true);\n      };\n    }\n    window.addEventListener(\u0027hashchange\u0027, function   /** 把版式套到一张幻灯片上（会替换该页现有对象） */
  function apply(slide, key, deck) {
    var L = byKey(key) || byKey('blank');
    var prevDeck = PS.store.deck;
    /* build() 里要读 deck.size，新建文档时它还没进 store，临时借用一下 */
    if (deck && !prevDeck) PS.store.state.deck = deck;
    try {
      slide.elements = L.build(deck || PS.store.deck) || [];
      slide.layout = L.key;
      /* 暗场页由整屏色块负责，背景本身保持跟随主题，缩略图与放映都一致 */
      slide.background = null;
      slide.classes = ['slide'].concat(L.dark ? ['is-dark'] : []);
      if (!slide.title && L.title) slide.title = L.title;
    } finally {
      if (deck && !prevDeck) PS.store.state.deck = prevDeck;
    }
    return slide;
  }

<script>

   原生组件继续按响应式排版，自由对象（箭头、标注、遮罩、批注框）浮在它上面。
   两种编辑目标靠「编辑目标」开关切换，同一时刻只有一个吃鼠标事件，不打架。

        + '<p>该转换按计划在 <b>P3 阶段</b>提供，届时会带转换预览和逐组件对照。</p>'
        + '<p>如果你现在只是想在这一页上加箭头、标注或遮罩，不需要转换 —— 直接用'
        + '<b>「叠加自由对象」</b>即可，原组件排版完全不受影响。</p>',
