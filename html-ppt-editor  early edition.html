    for (var c = 0; c < e.cols; c++) {
      out += '<col style="width:' + U.round(e.colW[c] / totalW * 100, 3) + '%">';
    }
    out += '</colgroup><tbody>';
    for (var r = 0; r < e.rows; r++) {
      out += '<tr style="height:' + U.round(e.rowH[r] / totalH * 100, 3) + '%">';
      for (var j = 0; j < e.cols; j++) {
        var cell = e.cells[r][j] || defCell();
        if (cell.merged) continue;                       // 被合并吃掉的格子不输出
        var span = cell.span || { r: 1, c: 1 };
        out += '<td data-r="' + r + '" data-c="' + j + '"' +
          (span.r > 1 ? ' rowspan="' + span.r + '"' : '') +
          (span.c > 1 ? ' colspan="' + span.c + '"' : '') +
          ' style="' + cellStyle(e, r, j) + '">' + (cell.html || '') + '</td>';
      }
      out += '</tr>';
    }
    return out + '</tbody></table>';
  }

  /* ------------------------------------------------------------ 模型自愈 */
  /**
   * 把表格模型修回自洽：rows/cols 必须等于 cells 的实际形状，colW/rowH 长度跟上。
   * 以 cells（真实数据）为准，宁可让"幽灵行/列"重新露面也不丢用户内容。
   * 老版本的 deleteRow/deleteCol 在光标越界时会把 rows-- 却没真删，
   * 存下来的文件就是坏的 —— 这里让它一打开（render 会调 html()）就自动修好。
   */
  function heal(e) {
    if (!e || e.type !== 'table') return false;
    var fixed = false;
    if (!Array.isArray(e.cells)) { e.cells = []; fixed = true; }
    if (!e.cells.length) { e.cells.push([defCell()]); fixed = true; }

    var rows = e.cells.length, cols = 0, i, j;
    for (i = 0; i < rows; i++) {
      if (!Array.isArray(e.cells[i])) { e.cells[i] = []; fixed = true; }
      if (e.cells[i].length > cols) cols = e.cells[i].length;
    }
    if (cols < 1) cols = 1;
    for (i = 0; i < rows; i++) {
      for (j = 0; j < cols; j++) {
        if (!e.cells[i][j] || typeof e.cells[i][j] !== 'object') { e.cells[i][j] = defCell(); fixed = true; }
      }
      if (e.cells[i].length > cols) { e.cells[i].length = cols; fixed = true; }
    }
    if (e.rows !== rows) { e.rows = rows; fixed = true; }
    if (e.cols !== cols) { e.cols = cols; fixed = true; }

    if (!Array.isArray(e.colW)) { e.colW = []; fixed = true; }
    if (!Array.isArray(e.rowH)) { e.rowH = []; fixed = true; }
    while (e.colW.length < cols) { e.colW.push(1); fixed = true; }
    while (e.rowH.length < rows) { e.rowH.push(1); fixed = true; }
    if (e.colW.length > cols) { e.colW.length = cols; fixed = true; }
    if (e.rowH.length > rows) { e.rowH.length = rows; fixed = true; }
    if (healSpans(e)) fixed = true;
    return fixed;
  }

  /** 区域 (r,c,sr,sc) 内除原点外是否已被别人占用 */
  function regionTaken(cov, r, c, sr, sc) {
    for (var i = 0; i < sr; i++) {
      for (var j = 0; j < sc; j++) if ((i || j) && cov[r + i][c + j]) return true;
    }
    return false;
  }

  /**
   * merged / span 这对字段的**引用完整性**收敛。
   *
   * 合并是两个字段合起来表达的：原点格带 `span`，被吃掉的格带 `merged:true`，
   * 渲染器见到 `merged` 就跳过不画。一旦原点所在的行/列被删掉，
   * `merged` 就成了**孤儿** —— 没有任何存活的 span 覆盖它，渲染器却照旧跳过，
   * 于是那一格的内容留在模型里、也留在导出文件里，却在画布上永远画不出来。
   * 形状自愈（rows/cols/colW/rowH）管不到这里，`rows===cells.length` 也照样成立，
   * 所以这条必须单独收敛。
   *
   * 规则：**宁可让格子重新露出来，也不能让内容静默看不见。**
   * 行优先扫一遍，只认「被存活原点真正覆盖」的 merged；其余一律清掉。
   * 越界的 span 夹紧，和前面已占区域重叠的 span 收缩。
   * 只删不加属性 —— 不给没有 merged/span 的格子凭空添字段，避免序列化膨胀。
   */
  function healSpans(e) {
    var rows = e.rows, cols = e.cols, fixed = false, r, c, i, j;
    var cov = [];
    for (r = 0; r < rows; r++) { cov.push([]); for (c = 0; c < cols; c++) cov[r].push(false); }

    for (r = 0; r < rows; r++) {
      for (c = 0; c < cols; c++) {
        var cell = e.cells[r][c];
        if (cov[r][c]) {
          /* 确实被覆盖：补上 merged，并且它自己不许再往外覆盖别人 */
          if (!cell.merged) { cell.merged = true; fixed = true; }
          if (cell.span && (cell.span.r > 1 || cell.span.c > 1)) { cell.span = { r: 1, c: 1 }; fixed = true; }
          continue;
        }
        /* 没被任何存活原点覆盖 —— 孤儿标记，清掉让这一格重新可见 */
        if (cell.merged) { delete cell.merged; fixed = true; }
        var sp = cell.span; if (!sp) continue;
        var sr = U.clamp(sp.r | 0 || 1, 1, rows - r);
        var sc = U.clamp(sp.c | 0 || 1, 1, cols - c);
        while (sc > 1 && regionTaken(cov, r, c, sr, sc)) sc--;
        while (sr > 1 && regionTaken(cov, r, c, sr, sc)) sr--;
        if (sr !== sp.r || sc !== sp.c) fixed = true;
        if (sr === 1 && sc === 1) { delete cell.span; }
        else cell.span = { r: sr, c: sc };
        for (i = 0; i < sr; i++) for (j = 0; j < sc; j++) if (i || j) cov[r + i][c + j] = true;
      }
    }
    return fixed;
  }

  /**
   * 删行/删列前先把**跨过被删那一行/列**的合并区收窄一格，
   * 免得删完之后合并区顺势往外多吃一格（那一格有内容就又看不见了）。
   * 原点自己就在被删行/列上的情况不用管：原点没了，
   * 它留下的 merged 会被 healSpans 当孤儿清掉，格子重新露面。
   */
  function shrinkSpans(e, dim, at) {
    for (var r = 0; r < e.cells.length; r++) {
      for (var c = 0; c < e.cells[r].length; c++) {
        var sp = e.cells[r][c] && e.cells[r][c].span; if (!sp) continue;
        if (dim === 'col') { if (c < at && at < c + sp.c) sp.c = Math.max(1, sp.c - 1); }
        else { if (r < at && at < r + sp.r) sp.r = Math.max(1, sp.r - 1); }
      }
    }
  }
  /** 插行/插列如果插在合并区**内部**，合并区要跟着长一格（和 PowerPoint 一致） */
  function growSpans(e, dim, at) {
    for (var r = 0; r < e.cells.length; r++) {
      for (var c = 0; c < e.cells[r].length; c++) {
        var sp = e.cells[r][c] && e.cells[r][c].span; if (!sp) continue;
        if (dim === 'col') { if (c < at && at < c + sp.c) sp.c++; }
        else { if (r < at && at < r + sp.r) sp.r++; }
      }
    }
  }

  /* ------------------------------------------------------------ 编辑操作 */
  function isTbl(e) { return !!e && e.type === 'table' && !e.locked; }

  function sel() {
    var els = S.selElements().filter(isTbl);
    var e = els[0] || null;
    if (e) { heal(e); bindCursor(e); }
    return e;
  }
  /** 当前正在编辑/选中的单元格坐标，由 canvas 记录 */
  var cursor = { r: 0, c: 0 };
  /** 光标属于哪张表 —— 换了表就必须归零，否则会拿 B 表的坐标去改 A 表 */
  var cursorId = null;

  function curTableId() {
    var els = S.selElements ? S.selElements().filter(isTbl) : [];
    return els[0] ? els[0].id : null;
  }
  /** 把 cursor 绑到 e 上：换表归零，并夹进 e 的合法范围 */
  function bindCursor(e) {
    if (!e) return cursor;
    if (cursorId !== e.id) { cursor = { r: 0, c: 0 }; cursorId = e.id; }
    cursor.r = U.clamp(cursor.r, 0, e.rows - 1);
    cursor.c = U.clamp(cursor.c, 0, e.cols - 1);
    return cursor;
  }
  function setCursor(r, c, id) {
    cursor = { r: Math.max(0, r | 0), c: Math.max(0, c | 0) };
    cursorId = id || curTableId();
  }
  /** 传入表格元素时按该表夹紧；不传则按当前选中的表 */
  function getCursor(e) {
    if (e && e.type === 'table') { heal(e); bindCursor(e); }
    else sel();
    return { r: cursor.r, c: cursor.c };
  }

  function commit(label) { S.commit(label || '编辑表格'); }

  function insertRow(where) {
    var e = sel(); if (!e) return;
    var at = where === 'above' ? cursor.r : cursor.r + 1;
    at = U.clamp(at, 0, e.rows);
    var row = [];
    for (var c = 0; c < e.cols; c++) row.push(defCell());
    growSpans(e, 'row', at);
    e.cells.splice(at, 0, row);
    e.rowH.splice(at, 0, 1);
    e.rows = e.cells.length;       // 计数一律以真实数据为准，永不脱钩
    heal(e);
    /* 行多了整体长高，保持单行高度手感 */
    e.h = U.round(e.h * (e.rows / (e.rows - 1)), 1);
    commit('插入行');
  }
  function insertCol(where) {
    var e = sel(); if (!e) return;
    var at = where === 'left' ? cursor.c : cursor.c + 1;
    at = U.clamp(at, 0, e.cols);
    growSpans(e, 'col', at);
    e.cells.forEach(function (row) { row.splice(at, 0, defCell()); });
    e.colW.splice(at, 0, 1);
    e.cols = e.cells[0].length;
    heal(e);
    commit('插入列');
  }
  function deleteRow() {
    var e = sel(); if (!e) return;
    if (e.rows <= 1) { PS.ui.toast('至少保留一行', 'warn'); return; }
    var at = U.clamp(cursor.r, 0, e.rows - 1);
    shrinkSpans(e, 'row', at);     // 先收窄跨过这一行的合并区
    e.cells.splice(at, 1);
    e.rowH.splice(at, 1);
    e.rows = e.cells.length;       // 不再无条件 rows--，越界也不会写坏模型
    heal(e);                       // 再清掉失去原点的孤儿 merged，别让内容画不出来
    cursor.r = U.clamp(cursor.r, 0, e.rows - 1);
    commit('删除行');
  }
  function deleteCol() {
    var e = sel(); if (!e) return;
    if (e.cols <= 1) { PS.ui.toast('至少保留一列', 'warn'); return; }
    var at = U.clamp(cursor.c, 0, e.cols - 1);
    shrinkSpans(e, 'col', at);     // 先收窄跨过这一列的合并区
    e.cells.forEach(function (row) { row.splice(at, 1); });
    e.colW.splice(at, 1);
    e.cols = e.cells[0].length;
    heal(e);                       // 再清掉失去原点的孤儿 merged（B-表格-3 的正主）
    cursor.c = U.clamp(cursor.c, 0, e.cols - 1);
    commit('删除列');
  }
  function distribute(dim) {
    var e = sel(); if (!e) return;
    if (dim === 'cols') e.colW = e.colW.map(function () { return 1; });
    else e.rowH = e.rowH.map(function () { return 1; });
    commit(dim === 'cols' ? '平均分布各列' : '平均分布各行');
  }
  function setStyle(key) {
    var e = sel(); if (!e) return;
    e.tstyle.style = key;
    commit('更改表格样式');
  }
  function toggleOpt(name) {
    var e = sel(); if (!e) return;
    e.tstyle[name] = !e.tstyle[name];
    commit('切换表格选项');
  }
  function setProp(patch) {
    var e = sel(); if (!e) return;
    U.assign(e.tstyle, patch);
    commit('设置表格属性');
  }
  function setCell(patch) {
    var e = sel(); if (!e) return;
    var cell = e.cells[cursor.r] && e.cells[cursor.r][cursor.c];
    if (!cell) return;
    U.assign(cell, patch);
    commit('设置单元格');
  }
  /** 合并：把光标所在格与右/下相邻格合并（简化版，够用且不易出错） */
  /** 取当前光标格；取不到就提示而不是抛异常 */
  function curCell(e) {
    var cell = e.cells[cursor.r] && e.cells[cursor.r][cursor.c];
    if (!cell) { PS.ui.toast('请先在表格里点一个单元格', 'warn'); return null; }
    return cell;
  }
  function mergeRight() {
    var e = sel(); if (!e) return;
    var cell = curCell(e); if (!cell) return;
    var span = cell.span || { r: 1, c: 1 };
    var nc = cursor.c + span.c;
    if (nc >= e.cols) { PS.ui.toast('右边没有可合并的单元格', 'warn'); return; }
    for (var i = 0; i < span.r; i++) {
      var t = e.cells[cursor.r + i] && e.cells[cursor.r + i][nc];
      if (!t || t.merged) { PS.ui.toast('相邻单元格已被合并，先取消再试', 'warn'); return; }
    }
    for (var k = 0; k < span.r; k++) e.cells[cursor.r + k][nc].merged = true;
    cell.span = { r: span.r, c: span.c + 1 };
    commit('合并单元格');
  }
  function mergeDown() {
    var e = sel(); if (!e) return;
    var cell = curCell(e); if (!cell) return;
    var span = cell.span || { r: 1, c: 1 };
    var nr = cursor.r + span.r;
    if (nr >= e.rows) { PS.ui.toast('下面没有可合并的单元格', 'warn'); return; }
    for (var i = 0; i < span.c; i++) {
      var d = e.cells[nr] && e.cells[nr][cursor.c + i];
      if (!d || d.merged) { PS.ui.toast('相邻单元格已被合并，先取消再试', 'warn'); return; }
    }
    for (var k = 0; k < span.c; k++) e.cells[nr][cursor.c + k].merged = true;
    cell.span = { r: span.r + 1, c: span.c };
    commit('合并单元格');
  }
  function unmerge() {
    var e = sel(); if (!e) return;
    var cell = curCell(e); if (!cell) return;
    if (!cell.span || (cell.span.r === 1 && cell.span.c === 1)) { PS.ui.toast('这一格没有被合并', 'warn'); return; }
    for (var i = 0; i < cell.span.r; i++) {
      for (var j = 0; j < cell.span.c; j++) {
        var t = e.cells[cursor.r + i] && e.cells[cursor.r + i][cursor.c + j];
        if (t) delete t.merged;    // 删属性而不是置 false —— 不给序列化添肥肉
      }
    }
    delete cell.span;
    heal(e);
    commit('取消合并');
  }

  /* ------------------------------------------------------ 插入用网格选择器 */
  function picker(anchor) {
    var MAXR = 8, MAXC = 10;
    var box = U.el('div', { class: 'tbl-pick' });
    var label = U.el('div', { class: 'lb', text: '拖过网格选择表格大小' });
    var grid = U.el('div', { class: 'g' });
    var cellsEl = [];
    for (var r = 0; r < MAXR; r++) {
      for (var c = 0; c < MAXC; c++) {
        var b = U.el('i', { 'data-r': r, 'data-c': c });
        grid.appendChild(b);
        cellsEl.push(b);
      }
    }
    function mark(r, c) {
      cellsEl.forEach(function (n) {
        var nr = +n.getAttribute('data-r'), nc = +n.getAttribute('data-c');
        n.classList.toggle('on', nr <= r && nc <= c);
      });
      label.textContent = (r + 1) + ' × ' + (c + 1) + ' 表格';
    }
    grid.addEventListener('mousemove', function (e) {
      var t = e.target.closest('i'); if (!t) return;
      mark(+t.getAttribute('data-r'), +t.getAttribute('data-c'));
    });
    grid.addEventListener('click', function (e) {
      var t = e.target.closest('i'); if (!t) return;
      h.close();
      insert(+t.getAttribute('data-r') + 1, +t.getAttribute('data-c') + 1);
    });
    box.appendChild(label);
    box.appendChild(grid);
    var more = U.el('button', { class: 'more', type: 'button' });
    more.innerHTML = PS.icon('table') + '<span>插入表格…（自定义行列）</span>';
    more.addEventListener('click', function () { h.close(); customDialog(); });
    box.appendChild(more);
    var h = PS.ui.popup(anchor, box);
    return h;
  }

  function insert(rows, cols) {
    var slide = PS.shape.ensureCanvas(); if (!slide) return;
    var e = create(rows, cols);
    slide.elements = (slide.elements || []).concat([e]);
    S.selectElements([e.id]);
    setCursor(0, 0);
    S.commit('插入表格 ' + rows + '×' + cols);
    return e;
  }

  function customDialog() {
    var rIn = U.el('input', { class: 'f-in', type: 'number', value: 3, min: 1, max: 40 });
    var cIn = U.el('input', { class: 'f-in', type: 'number', value: 4, min: 1, max: 20 });
    var body = U.el('div', null, [
      U.el('div', { class: 'fr' }, [U.el('label', { text: '行数', class: 'wide' }), rIn]),
      U.el('div', { class: 'fr' }, [U.el('label', { text: '列数', class: 'wide' }), cIn])
    ]);
    PS.ui.dialog({
      title: '插入表格', body: body, enterConfirm: true,
      buttons: [
        { label: '确定', primary: true, on: function () { insert(parseInt(rIn.value, 10), parseInt(cIn.value, 10)); } },
        { label: '取消' }
      ]
    });
  }

  return {
    STYLES: STYLES, styleOf: styleOf, create: create, html: html, cellStyle: cellStyle, insert: insert,
    picker: picker, customDialog: customDialog,
    sel: sel, setCursor: setCursor, getCursor: getCursor, heal: heal,
    insertRow: insertRow, insertCol: insertCol, deleteRow: deleteRow, deleteCol: deleteCol,
    distribute: distribute, setStyle: setStyle, toggleOpt: toggleOpt, setProp: setProp, setCell: setCell,
    mergeRight: mergeRight, mergeDown: mergeDown, unmerge: unmerge
  };
})();

</script>
<script>
/* ===== inlined: js/edit/chart.js ===== */
/* ===========================================================================
   HTML PPT Editor :: edit/chart.js
   图表。纯 SVG 生成，零依赖 —— 导出的 HTML 里就是一段静态 SVG，
   任何浏览器打开都能看，不需要图表库，也不怕离线。

   模型：
     e.type      'chart'
     e.chartType 'column'|'bar'|'line'|'area'|'pie'|'doughnut'|'scatter'|'radar'
     e.data      { categories:[], series:[{ name, values:[], color }] }
     e.copt      { title, legend, legendPos, gridX, gridY, dataLabels, stacked,
                   smooth, innerRadius, yMin, yMax, decimals, unit, fontSize }

   系列配色默认走主题引用，换主题时图表跟着变。
   =========================================================================== */
var PS = window.PS || (window.PS = {});

PS.chart = (function () {
  'use strict';
  var U = PS.util, M = PS.model, S = PS.store;

  var TYPES = [
    { key: 'column', name: '簇状柱形图', group: '柱形' },
    { key: 'bar', name: '条形图', group: '柱形' },
    { key: 'line', name: '折线图', group: '折线' },
    { key: 'area', name: '面积图', group: '折线' },
    { key: 'pie', name: '饼图', group: '饼图' },
    { key: 'doughnut', name: '圆环图', group: '饼图' },
    { key: 'scatter', name: '散点图', group: '其他' },
    { key: 'radar', name: '雷达图', group: '其他' }
  ];

  /* 默认系列配色：主色三支 + 次色 + 语义色，够 8 个系列不重样 */
  var PALETTE = [
    'theme:--ps-accent', 'theme:--ps-info', 'theme:--ps-accent-mid',
    'theme:--ps-good', 'theme:--ps-warn', 'theme:--ps-ink-4',
    'theme:--ps-violet', 'theme:--ps-gold'
  ];

  function defData() {
    return {
      categories: ['一季度', '二季度', '三季度', '四季度'],
      series: [
        { name: '系列 1', values: [42, 58, 51, 67], color: PALETTE[0] },
        { name: '系列 2', values: [31, 39, 46, 44], color: PALETTE[1] }
      ]
    };
  }
  function defOpt() {
    return {
      title: '', legend: true, legendPos: 'bottom',
      gridX: false, gridY: true, dataLabels: false,
      stacked: false, smooth: false, innerRadius: 0.58,
      yMin: null, yMax: null, decimals: 0, unit: '', fontSize: 13
    };
  }

  function create(type, opt) {
    opt = opt || {};
    var deck = S.deck;
    var w = opt.w || Math.round(deck.size.w * 0.56);
    var h = opt.h || Math.round(deck.size.h * 0.52);
    var e = M.newElement('chart', {
      x: opt.x != null ? opt.x : Math.round((deck.size.w - w) / 2),
      y: opt.y != null ? opt.y : Math.round((deck.size.h - h) / 2),
      w: w, h: h
    });
    e.chartType = type || 'column';
    e.data = opt.data || defData();
    e.copt = U.assign(defOpt(), opt.copt || {});
    e.fill = { type: 'none' };
    e.line = { type: 'none', color: 'theme:--ps-rule', width: 0, dash: 'solid' };
    e.text = null;
    return e;
  }

  /* ------------------------------------------------------------ 工具 */
  function col(e, i) {
    var s = e.data.series[i];
    return PS.render.cssColor((s && s.color) || PALETTE[i % PALETTE.length]);
  }
  function ink(v) { return PS.render.cssColor('theme:--ps-ink-3'); }
  function rule() { return PS.render.cssColor('theme:--ps-rule'); }
  function esc(s) { return U.escHTML(s); }
  function fmt(v, o) {
    var n = Number(v) || 0;
    return (o.decimals ? n.toFixed(o.decimals) : String(Math.round(n))) + (o.unit || '');
  }
  /** 取一个「好看」的刻度步长（1/2/5 × 10^n） */
  function niceStep(range, target) {
    var raw = range / (target || 5);
    var mag = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
    var norm = raw / mag;
    var step = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10;
    return step * mag;
  }
  function extent(e) {
    var o = e.copt, vals = [];
    e.data.series.forEach(function (s) { (s.values || []).forEach(function (v) { vals.push(Number(v) || 0); }); });
    if (o.stacked && e.data.categories.length) {
      vals = e.data.categories.map(function (_, i) {
        return e.data.series.reduce(function (n, s) { return n + (Number(s.values[i]) || 0); }, 0);
      });
    }
    var min = Math.min.apply(null, vals.concat([0]));
    var max = Math.max.apply(null, vals.concat([0]));
    if (o.yMin != null) min = o.yMin;
    if (o.yMax != null) max = o.yMax;
    if (max === min) max = min + 1;
    var step = niceStep(max - min, 5);
    if (o.yMin == null) min = Math.floor(min / step) * step;
    if (o.yMax == null) max = Math.ceil(max / step) * step;
    return { min: min, max: max, step: step };
  }

  /* ------------------------------------------------------------ 渲染 */
  /**
   * @returns {string} 完整 <svg>，viewBox 与元素尺寸一致，随元素缩放
   */
  function svg(e) {
    var W = Math.max(80, e.w), H = Math.max(60, e.h);
    var o = e.copt || defOpt();
    var fs = o.fontSize || 13;
    var pad = { t: o.title ? fs * 2.6 : 16, r: 18, b: 16, l: 18 };
    var legendH = o.legend && e.data.series.length ? fs * 2.2 : 0;
    if (o.legend && (o.legendPos === 'bottom')) pad.b += legendH;
    if (o.legend && (o.legendPos === 'top')) pad.t += legendH;

    var body = '';
    var head = '';
    if (o.title) {
      head += '<text x="' + (W / 2) + '" y="' + (fs * 1.6) + '" text-anchor="middle" ' +
        'font-size="' + (fs * 1.25) + '" font-weight="700" fill="' + PS.render.cssColor('theme:--ps-accent-strong') + '">' +
        esc(o.title) + '</text>';
    }

    var kind = e.chartType;
    if (kind === 'pie' || kind === 'doughnut') body = pieLike(e, W, H, pad, o, fs);
    else if (kind === 'radar') body = radar(e, W, H, pad, o, fs);
    else if (kind === 'scatter') body = scatter(e, W, H, pad, o, fs);
    else body = cartesian(e, W, H, pad, o, fs);

    if (o.legend && e.data.series.length) body += legend(e, W, H, o, fs, pad);

    return '<svg class="ps-fig ps-chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" ' +
      'font-family="' + M.FONTS[0].replace(/"/g, "'") + '">' + head + body + '</svg>';
  }

  /* ---- 图例 ---- */
  function legend(e, W, H, o, fs, pad) {
    var items = e.data.series.map(function (s, i) { return { t: s.name || ('系列 ' + (i + 1)), c: col(e, i) }; });
    if ((e.chartType === 'pie' || e.chartType === 'doughnut')) {
      items = e.data.categories.map(function (c, i) {
        return { t: c, c: PS.render.cssColor(PALETTE[i % PALETTE.length]) };
      });
    }
    var y = o.legendPos === 'top' ? (o.title ? fs * 2.8 : 12) + fs : H - fs * 0.9;
    var gap = 16, boxW = fs * 0.85;
    var widths = items.map(function (it) { return boxW + 6 + it.t.length * fs * 0.62 + gap; });
    var total = widths.reduce(function (a, b) { return a + b; }, 0) - gap;
    var x = Math.max(6, (W - total) / 2);
    var out = '';
    items.forEach(function (it, i) {
      out += '<rect x="' + x + '" y="' + (y - boxW + 1) + '" width="' + boxW + '" height="' + boxW +
        '" rx="2" fill="' + it.c + '"/>';
      out += '<text x="' + (x + boxW + 6) + '" y="' + y + '" font-size="' + fs * 0.92 + '" fill="' + ink() + '">' + esc(it.t) + '</text>';
      x += widths[i];
    });
    return out;
  }

  /* ---- 柱 / 条 / 折线 / 面积：共用直角坐标系 ---- */
  function cartesian(e, W, H, pad, o, fs) {
    var horiz = e.chartType === 'bar';
    var ext = extent(e);
    var cats = e.data.categories, series = e.data.series;

    /* 轴标签占位 */
    var axisW = fs * 3.4, axisH = fs * 2;
    var L = pad.l + (horiz ? Math.max(axisW, maxLabelW(cats, fs)) : axisW);
    var B = H - pad.b - axisH;
    var T = pad.t, R = W - pad.r;
    var pw = Math.max(10, R - L), ph = Math.max(10, B - T);

    var out = '';
    var ticks = [];
    for (var v = ext.min; v <= ext.max + 1e-9; v += ext.step) ticks.push(+v.toFixed(6));

    /* 网格与数值轴 */
    ticks.forEach(function (t) {
      var p = (t - ext.min) / (ext.max - ext.min);
      if (horiz) {
        var x = L + p * pw;
        if (o.gridY) out += '<line x1="' + x + '" y1="' + T + '" x2="' + x + '" y2="' + B + '" stroke="' + rule() + '" stroke-width="1"/>';
        out += '<text x="' + x + '" y="' + (B + fs * 1.35) + '" text-anchor="middle" font-size="' + fs * 0.85 + '" fill="' + ink() + '">' + fmt(t, o) + '</text>';
      } else {
        var y = B - p * ph;
        if (o.gridY) out += '<line x1="' + L + '" y1="' + y + '" x2="' + R + '" y2="' + y + '" stroke="' + rule() + '" stroke-width="1"/>';
        out += '<text x="' + (L - 8) + '" y="' + (y + fs * 0.35) + '" text-anchor="end" font-size="' + fs * 0.85 + '" fill="' + ink() + '">' + fmt(t, o) + '</text>';
      }
    });
    /* 零线加重 */
    var zp = (0 - ext.min) / (ext.max - ext.min);
    if (zp >= 0 && zp <= 1) {
      if (horiz) out += '<line x1="' + (L + zp * pw) + '" y1="' + T + '" x2="' + (L + zp * pw) + '" y2="' + B + '" stroke="' + ink() + '" stroke-width="1.2"/>';
      else out += '<line x1="' + L + '" y1="' + (B - zp * ph) + '" x2="' + R + '" y2="' + (B - zp * ph) + '" stroke="' + ink() + '" stroke-width="1.2"/>';
    }

    var n = cats.length || 1;
    var slot = (horiz ? ph : pw) / n;

    /* 类别轴标签 */
    cats.forEach(function (c, i) {
      var mid = (horiz ? T : L) + slot * (i + 0.5);
      if (horiz) out += '<text x="' + (L - 8) + '" y="' + (mid + fs * 0.35) + '" text-anchor="end" font-size="' + fs * 0.85 + '" fill="' + ink() + '">' + esc(c) + '</text>';
      else out += '<text x="' + mid + '" y="' + (B + fs * 1.4) + '" text-anchor="middle" font-size="' + fs * 0.85 + '" fill="' + ink() + '">' + esc(c) + '</text>';
    });

    function pos(v) { return (v - ext.min) / (ext.max - ext.min); }

    if (e.chartType === 'column' || e.chartType === 'bar') {
      var m = series.length || 1;
      var groupPad = slot * 0.18;
      var bw = o.stacked ? (slot - groupPad * 2) : (slot - groupPad * 2) / m;
      var stackAcc = cats.map(function () { return 0; });
      series.forEach(function (s, si) {
        cats.forEach(function (c, i) {
          var v = Number(s.values[i]) || 0;
          var base = o.stacked ? stackAcc[i] : 0;
          var p0 = pos(Math.min(base, base + v)), p1 = pos(Math.max(base, base + v));
          if (o.stacked) stackAcc[i] += v;
          var off = o.stacked ? groupPad : groupPad + si * bw;
          if (horiz) {
            var y = T + slot * i + off, x = L + p0 * pw, ww = Math.max(1, (p1 - p0) * pw);
            out += '<rect x="' + x + '" y="' + y + '" width="' + ww + '" height="' + Math.max(1, bw) + '" fill="' + col(e, si) + '"/>';
            if (o.dataLabels) out += '<text x="' + (x + ww + 5) + '" y="' + (y + bw / 2 + fs * 0.34) + '" font-size="' + fs * 0.82 + '" fill="' + ink() + '">' + fmt(v, o) + '</text>';
          } else {
            var x2 = L + slot * i + off, y2 = B - p1 * ph, hh = Math.max(1, (p1 - p0) * ph);
            out += '<rect x="' + x2 + '" y="' + y2 + '" width="' + Math.max(1, bw) + '" height="' + hh + '" fill="' + col(e, si) + '"/>';
            if (o.dataLabels) out += '<text x="' + (x2 + bw / 2) + '" y="' + (y2 - 5) + '" text-anchor="middle" font-size="' + fs * 0.82 + '" fill="' + ink() + '">' + fmt(v, o) + '</text>';
          }
        });
      });
    } else {
      /* 折线 / 面积 */
      series.forEach(function (s, si) {
        var pts = cats.map(function (c, i) {
          var v = Number(s.values[i]) || 0;
          return { x: L + slot * (i + 0.5), y: B - pos(v) * ph, v: v };
        });
        var d = pathOf(pts, o.smooth);
        if (e.chartType === 'area') {
          var zy = B - pos(Math.max(0, ext.min)) * ph;
          out += '<path d="' + d + ' L' + pts[pts.length - 1].x + ',' + zy + ' L' + pts[0].x + ',' + zy + ' Z" fill="' + col(e, si) + '" opacity=".18"/>';
        }
        out += '<path d="' + d + '" fill="none" stroke="' + col(e, si) + '" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
        pts.forEach(function (p) {
          out += '<circle cx="' + p.x + '" cy="' + p.y + '" r="3.4" fill="#fff" stroke="' + col(e, si) + '" stroke-width="2"/>';
          if (o.dataLabels) out += '<text x="' + p.x + '" y="' + (p.y - 9) + '" text-anchor="middle" font-size="' + fs * 0.82 + '" fill="' + ink() + '">' + fmt(p.v, o) + '</text>';
        });
      });
    }
    return out;
  }
  function maxLabelW(cats, fs) {
    var m = 0;
    cats.forEach(function (c) { m = Math.max(m, String(c).length); });
    return Math.min(m * fs * 0.62, 120);
  }
  function pathOf(pts, smooth) {
    if (!pts.length) return '';
    if (!smooth || pts.length < 3) {
      return 'M' + pts.map(function (p) { return p.x + ',' + p.y; }).join(' L');
    }
    var d = 'M' + pts[0].x + ',' + pts[0].y;
    for (var i = 0; i < pts.length - 1; i++) {
      var p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      var c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
      var c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
      d += ' C' + c1x + ',' + c1y + ' ' + c2x + ',' + c2y + ' ' + p2.x + ',' + p2.y;
    }
    return d;
  }

  /* ---- 饼 / 环 ---- */
  function pieLike(e, W, H, pad, o, fs) {
    var s = e.data.series[0] || { values: [] };
    var cats = e.data.categories;
    var total = cats.reduce(function (n, c, i) { return n + Math.abs(Number(s.values[i]) || 0); }, 0);
    if (!total) return '<text x="' + W / 2 + '" y="' + H / 2 + '" text-anchor="middle" font-size="' + fs + '" fill="' + ink() + '">没有数据</text>';

    var cx = W / 2, cy = pad.t + (H - pad.t - pad.b) / 2;
    var R = Math.max(10, Math.min(W, H - pad.t - pad.b) / 2 - 12);
    var inner = e.chartType === 'doughnut' ? R * (o.innerRadius || .58) : 0;
    var a = -Math.PI / 2, out = '';

    cats.forEach(function (c, i) {
      var v = Math.abs(Number(s.values[i]) || 0);
      if (!v) return;
      var ang = v / total * Math.PI * 2;
      var a2 = a + ang, big = ang > Math.PI ? 1 : 0;
      var x1 = cx + R * Math.cos(a), y1 = cy + R * Math.sin(a);
      var x2 = cx + R * Math.cos(a2), y2 = cy + R * Math.sin(a2);
      var d;
      if (inner) {
        var ix1 = cx + inner * Math.cos(a2), iy1 = cy + inner * Math.sin(a2);
        var ix2 = cx + inner * Math.cos(a), iy2 = cy + inner * Math.sin(a);
        d = 'M' + x1 + ',' + y1 + ' A' + R + ',' + R + ' 0 ' + big + ' 1 ' + x2 + ',' + y2 +
          ' L' + ix1 + ',' + iy1 + ' A' + inner + ',' + inner + ' 0 ' + big + ' 0 ' + ix2 + ',' + iy2 + ' Z';
      } else {
        d = 'M' + cx + ',' + cy + ' L' + x1 + ',' + y1 + ' A' + R + ',' + R + ' 0 ' + big + ' 1 ' + x2 + ',' + y2 + ' Z';
      }
      out += '<path d="' + d + '" fill="' + PS.render.cssColor(PALETTE[i % PALETTE.length]) + '" stroke="#fff" stroke-width="1.5"/>';
      if (o.dataLabels) {
        var am = a + ang / 2, lr = inner ? (R + inner) / 2 : R * 0.66;
        out += '<text x="' + (cx + lr * Math.cos(am)) + '" y="' + (cy + lr * Math.sin(am) + fs * 0.34) +
          '" text-anchor="middle" font-size="' + fs * 0.85 + '" fill="#fff" font-weight="600">' +
          Math.round(v / total * 100) + '%</text>';
      }
      a = a2;
    });
    if (inner && o.title === '') {
      out += '<text x="' + cx + '" y="' + (cy + fs * 0.4) + '" text-anchor="middle" font-size="' + fs * 1.5 +
        '" font-weight="700" fill="' + PS.render.cssColor('theme:--ps-accent-strong') + '">' + fmt(total, o) + '</text>';
    }
    return out;
  }

  /* ---- 散点 ---- */
  function scatter(e, W, H, pad, o, fs) {
    var axisW = fs * 3.4, axisH = fs * 2;
    var L = pad.l + axisW, B = H - pad.b - axisH, T = pad.t, R = W - pad.r;
    var pw = Math.max(10, R - L), ph = Math.max(10, B - T);
    /* x 用第一个系列，y 用其余系列 —— 与 PowerPoint 的散点数据组织一致 */
    var xs = (e.data.series[0] || { values: [] }).values.map(Number);
    var out = '', xmin = Math.min.apply(null, xs.concat([0])), xmax = Math.max.apply(null, xs.concat([1]));
    var ext = extent({ data: { categories: [], series: e.data.series.slice(1) }, copt: o });
    var xstep = niceStep(xmax - xmin, 5);
    xmin = Math.floor(xmin / xstep) * xstep; xmax = Math.ceil(xmax / xstep) * xstep;

    for (var xv = xmin; xv <= xmax + 1e-9; xv += xstep) {
      var x = L + (xv - xmin) / (xmax - xmin) * pw;
      if (o.gridX) out += '<line x1="' + x + '" y1="' + T + '" x2="' + x + '" y2="' + B + '" stroke="' + rule() + '"/>';
      out += '<text x="' + x + '" y="' + (B + fs * 1.35) + '" text-anchor="middle" font-size="' + fs * 0.85 + '" fill="' + ink() + '">' + fmt(xv, o) + '</text>';
    }
    for (var yv = ext.min; yv <= ext.max + 1e-9; yv += ext.step) {
      var y = B - (yv - ext.min) / (ext.max - ext.min) * ph;
      if (o.gridY) out += '<line x1="' + L + '" y1="' + y + '" x2="' + R + '" y2="' + y + '" stroke="' + rule() + '"/>';
      out += '<text x="' + (L - 8) + '" y="' + (y + fs * 0.34) + '" text-anchor="end" font-size="' + fs * 0.85 + '" fill="' + ink() + '">' + fmt(yv, o) + '</text>';
    }
    e.data.series.slice(1).forEach(function (s, si) {
      s.values.forEach(function (v, i) {
        if (xs[i] == null) return;
        var x = L + (xs[i] - xmin) / (xmax - xmin) * pw;
        var y = B - ((Number(v) || 0) - ext.min) / (ext.max - ext.min) * ph;
        out += '<circle cx="' + x + '" cy="' + y + '" r="5" fill="' + col(e, si + 1) + '" opacity=".82"/>';
      });
    });
    return out;
  }

  /* ---- 雷达 ---- */
  function radar(e, W, H, pad, o, fs) {
    var cats = e.data.categories, n = cats.length;
    if (n < 3) return '<text x="' + W / 2 + '" y="' + H / 2 + '" text-anchor="middle" font-size="' + fs + '" fill="' + ink() + '">雷达图至少需要 3 个类别</text>';
    var cx = W / 2, cy = pad.t + (H - pad.t - pad.b) / 2;
    var R = Math.max(20, Math.min(W, H - pad.t - pad.b) / 2 - fs * 2.4);
    var ext = extent(e);
    var out = '';
    function pt(i, p) {
      var a = -Math.PI / 2 + i / n * Math.PI * 2;
      return { x: cx + R * p * Math.cos(a), y: cy + R * p * Math.sin(a), a: a };
    }
    /* 蛛网 */
    for (var ring = 1; ring <= 4; ring++) {
      var pts = [];
      for (var i = 0; i < n; i++) { var q = pt(i, ring / 4); pts.push(q.x + ',' + q.y); }
      out += '<polygon points="' + pts.join(' ') + '" fill="none" stroke="' + rule() + '" stroke-width="1"/>';
    }
    for (var k = 0; k < n; k++) {
      var q2 = pt(k, 1);
      out += '<line x1="' + cx + '" y1="' + cy + '" x2="' + q2.x + '" y2="' + q2.y + '" stroke="' + rule() + '"/>';
      var lp = pt(k, 1.14);
      out += '<text x="' + lp.x + '" y="' + (lp.y + fs * 0.34) + '" text-anchor="middle" font-size="' + fs * 0.85 + '" fill="' + ink() + '">' + esc(cats[k]) + '</text>';
    }
    e.data.series.forEach(function (s, si) {
      var pts = [];
      for (var i = 0; i < n; i++) {
        var v = (Number(s.values[i]) || 0);
        var p = (v - ext.min) / (ext.max - ext.min);
        var q = pt(i, U.clamp(p, 0, 1));
        pts.push(q.x + ',' + q.y);
      }
      out += '<polygon points="' + pts.join(' ') + '" fill="' + col(e, si) + '" fill-opacity=".16" stroke="' + col(e, si) + '" stroke-width="2.2" stroke-linejoin="round"/>';
    });
    return out;
  }

  /* ------------------------------------------------------------ 插入 */
  function insert(type) {
    var slide = PS.shape.ensureCanvas(); if (!slide) return;
    var e = create(type);
    slide.elements = (slide.elements || []).concat([e]);
    S.selectElements([e.id]);
    S.commit('插入图表');
    return e;
  }

  function typeMenu(anchor) {
    var box = U.el('div', { class: 'shape-pop', style: { width: '270px' } });
    var h;
    var groups = [];
    TYPES.forEach(function (t) {
      var g = groups.filter(function (x) { return x.name === t.group; })[0];
      if (!g) { g = { name: t.group, items: [] }; groups.push(g); }
      g.items.push(t);
    });
    groups.forEach(function (g) {
      box.appendChild(U.el('h5', { text: g.name }));
      var grid = U.el('div', { class: 'grid', style: { gridTemplateColumns: 'repeat(4,1fr)' } });
      g.items.forEach(function (t) {
        var b = U.el('button', { class: 'sh', type: 'button', title: t.name, html: thumb(t.key) });
        b.addEventListener('click', function () { h.close(); insert(t.key); });
        grid.appendChild(b);
      });
      box.appendChild(grid);
    });
    h = PS.ui.popup(anchor, box);
    return h;
  }
  /** 类型选择器里的小示意图 */
  function thumb(key) {
    var f = 'fill="currentColor"';
    switch (key) {
      case 'column': return '<svg viewBox="0 0 100 100"><rect x="14" y="46" width="16" height="42" ' + f + '/><rect x="40" y="26" width="16" height="62" ' + f + '/><rect x="66" y="58" width="16" height="30" ' + f + '/></svg>';
      case 'bar': return '<svg viewBox="0 0 100 100"><rect x="12" y="16" width="52" height="16" ' + f + '/><rect x="12" y="42" width="76" height="16" ' + f + '/><rect x="12" y="68" width="36" height="16" ' + f + '/></svg>';
      case 'line': return '<svg viewBox="0 0 100 100"><path d="M12,74 L36,44 L58,58 L88,20" class="st"/></svg>';
      case 'area': return '<svg viewBox="0 0 100 100"><path d="M12,74 L36,44 L58,58 L88,20 L88,88 L12,88 Z" ' + f + '/></svg>';
      case 'pie': return '<svg viewBox="0 0 100 100"><path d="M50,50 L50,10 A40,40 0 0,1 86,66 Z" ' + f + '/><path d="M50,50 L86,66 A40,40 0 1,1 50,10 Z" ' + f + ' opacity=".45"/></svg>';
      case 'doughnut': return '<svg viewBox="0 0 100 100"><path d="M50,10 A40,40 0 1,1 49.9,10 Z M50,30 A20,20 0 1,0 49.9,30 Z" ' + f + '/></svg>';
      case 'scatter': return '<svg viewBox="0 0 100 100"><circle cx="26" cy="66" r="7" ' + f + '/><circle cx="48" cy="40" r="7" ' + f + '/><circle cx="70" cy="54" r="7" ' + f + '/><circle cx="84" cy="26" r="7" ' + f + '/></svg>';
      case 'radar': return '<svg viewBox="0 0 100 100"><polygon points="50,12 86,38 72,82 28,82 14,38" class="st"/><polygon points="50,30 72,44 64,68 36,68 28,44" ' + f + ' opacity=".5"/></svg>';
      default: return '<svg viewBox="0 0 100 100"><rect x="20" y="20" width="60" height="60" ' + f + '/></svg>';
    }
  }

  /* ------------------------------------------------------ 数据编辑器 */
  function editData() {
    var e = (S.selElements().filter(function (x) { return x.type === 'chart'; }))[0];
    if (!e) { PS.ui.toast('先选中一个图表', 'warn'); return; }
    var data = U.deepClone(e.data);

    var wrap = U.el('div');
    var tableBox = U.el('div', { style: { overflow: 'auto', maxHeight: '46vh', border: '1px solid var(--ui-line)', borderRadius: '4px' } });
    wrap.appendChild(U.el('div', {
      class: 'f-hint',
      html: e.chartType === 'scatter'
        ? '散点图：<b>第一个系列作为 X 值</b>，其余系列各画一组点。'

    function tdStyle() { return 'padding:4px;border:1px solid var(--ui-line)'; }
    function th(t) { return U.el('th', { style: thStyle(), text: t }); }

    PS.ui.dialog({

  }

  function setType(t) {
    var els = S.selElements().filter(function (x) { return x.type === 'chart'; });
    if (!els.length) return;

  }
  function setOpt(patch) {

<script>
/* ===== inlined: js/ui/canvas.js ===== */
/* ===========================================================================

  var editingElId = null;     // 正在编辑的元素 id（不依赖 store，store 那半可能已被清）
  var exiting = false;        // 退出编辑的重入保护
  var drag = null;            // 当前拖拽会话
  var RULER = 20;             // 标尺厚度，与 studio.css 里的 .ruler 尺寸保持一致
  var lastSpot = null;        // 上一次点击的位置，用于"原地连点逐层下钻"

   * 这一下点的还是刚才那个位置吗 —— 用于"原地连点逐层下钻"。
   * 时间窗要避开双击：双击本身就是同一位置连点两下，
   * 如果不把 350ms 以内的第二次点击排除掉，双击进文字编辑就会被下钻抢走。
   */

    if (!lastSpot || S.sel.elIds.length !== 1) return false;
    var dt = Date.now() - lastSpot.t;
    return Math.abs(lastSpot.x - pt.x) < 4 && Math.abs(lastSpot.y - pt.y) < 4

  }

  /* ------------------------------------------------------------ 初始化 */
  function init() {
    view = document.getElementById('slide-view');
    page = document.getElementById('sv-page');
    overlay = document.getElementById('sv-overlay');
    stage = document.getElementById('stage');
    wrap = document.getElementById('stage-wrap');
    emptyEl = document.getElementById('stage-empty');

    overlay.addEventListener('mousedown', onOverlayDown);
    overlay.addEventListener('dblclick', onOverlayDblClick);
    overlay.addEventListener('mousemove', onOverlayMove);
    overlay.addEventListener('contextmenu', onContextMenu);
    stage.addEventListener('mousedown', function (e) {
      /* 画布外围的灰色工作区：与 PowerPoint 一致 —— 先**干净地**退出文字编辑，再取消选中。
         以前这里直接 clearElSelection()，只清掉 store 那半个编辑态，
         canvas 这半还留着，之后敲的字全被静默丢弃。 */

  function deckCSS() {

      /* 编辑器内的辅助样式：只在 iframe 里生效，不会写进导出文件 */
      /* 必须显式给 html/body 高度：紧接着那条 .deck{height:100%} 是我们注入的，

      '\n.deck{width:100%;height:100%}' +
      '\n.slide{transition:none!important;animation:none!important}' +
      '\n' +
      '\n[data-ps-edit]{outline:1px dotted rgba(15,108,189,.55);outline-offset:1px;cursor:text}' +
      '\n[data-ps-edit]:hover{background:rgba(15,108,189,.07)}' +

  function buildFrame(key) {
    /* 旧 iframe 一销毁，editingNode 就是个悬空引用了。不清掉的话

    fdoc.addEventListener('focusout', onFrameBlur, true);

  function render() {
    var deck = S.deck;
    emptyEl.hidden = !!deck;
    if (!deck) { if (frame) { frame.remove(); frame = null; frameKey = ''; } return; }
    var slide = S.curSlide();
    if (!slide) return;

    var W = deck.size.w, H = deck.size.h;
    /* CSS/主题变了要重建 iframe（整份样式表重写），换页只重写内容 */
    var key = deck.id + '|' + deck.css.length + '|' + JSON.stringify(deck.theme) + '|' + W + 'x' + H;
    if (key !== frameKey) buildFrame(key);

    var deckEl = fdoc.querySelector('.deck');
    var sec = deckEl.querySelector('section.slide');
    var wantClasses = (slide.classes || ['slide']).concat(['is-active']).join(' ');
    if (!sec) {
      sec = fdoc.createElement('section');
      deckEl.appendChild(sec);
    }
    if (sec.className !== wantClasses) sec.className = wantClasses;
    if (sec.getAttribute('data-title') !== slide.title) sec.setAttribute('data-title', slide.title || '');
    if (slide.mode === 'canvas') sec.setAttribute('data-mode', 'canvas'); else sec.removeAttribute('data-mode');

    /* 正在输入时不能重写 innerHTML，否则光标会被打飞。
       但这不该让「改字号 / 改颜色 / 改对齐」也等到失焦才生效 ——
       所以改成：编辑中只把样式就地刷到正在编辑的那个对象上，不动它的内容。 */
    /* data-ps-slide = "这段 DOM 现在装的是哪一页"。写回时拿它做归属校验，
       避免把上一页的 HTML 写进当前页。页 id 变了也必须重写，
       否则两页内容碰巧同指纹时会留下过期的归属标记。 */

      sec.setAttribute('data-ps-slide', slide.id);
      sec.setAttribute('data-ps-sig', sig(slide));

    view.style.height = Math.round(H * zoom) + 'px';

    if (!S.deck) return;
    overlay.innerHTML = '';
    var slide = S.curSlide();
    if (!slide) return;

  function css(node, b) {

  function handlesFor(b, e) {
    var rot = e ? (e.rot || 0) : 0;
    var host = U.el('div', { style: { position: 'absolute', left: (b.x * zoom) + 'px', top: (b.y * zoom) + 'px', width: (b.w * zoom) + 'px', height: (b.h * zoom) + 'px' } });
    if (rot) { host.style.transform = 'rotate(' + rot + 'deg)'; host.style.transformOrigin = 'center'; }
    host.style.pointerEvents = 'none';

    /* 控制点命中区的放大量：正常给 7px（视觉 9px → 命中约 23×23），
       但对象在屏上很小时必须收着点，否则八个控制点的放大区互相重叠、
       连对象本体都被吞掉，就成了「能缩放但选不中也拖不动」，比不放大还糟。
       边中点控制点的命中半径是 4.5+grow，它的中心就落在边框上（距中心 shortPx/2），
       要让本体中间始终留得下手，就得 4.5+grow < shortPx/2 − 2（2px 余量）。

    var shortPx = Math.min(b.w, b.h) * zoom;

    DIRS.forEach(function (d) {
      if (e && e.type === 'line' && ['n', 's', 'nw', 'ne', 'sw', 'se'].indexOf(d[0]) >= 0) return;
      var hd = U.el('div', { class: 'handle', 'data-dir': d[0] });
      hd.style.left = (d[1] * 100) + '%';
      hd.style.top = (d[2] * 100) + '%';
      host.appendChild(hd);
    });
    if (e) {
      var rt = U.el('div', { class: 'handle rot', 'data-dir': 'rot', title: '拖动旋转（按住 Shift 每 15° 吸附）' });
      rt.style.left = '50%'; rt.style.top = '-24px';
      host.appendChild(rt);
      /* 黄色可调手柄：圆角/箭头颈宽等 */
      if (e.type === 'shape' && PS.shapes.get(e.shape) && !PS.shapes.isLine(e.shape) && e.adjust != null) {
        var aj = U.el('div', { class: 'handle adj', 'data-dir': 'adj', title: '拖动调整形状（' + PS.shapes.name(e.shape) + '）' });
        aj.style.left = U.clamp(e.adjust, 0, 1) * 100 + '%';
        aj.style.top = '0%';
        host.appendChild(aj);
      }
    }

  }

  function drawGrid() {
    var deck = S.deck, g = S.view.gridSize || 8;
    var layer = U.el('div', { class: 'grid-layer' });
    layer.style.backgroundImage =
      'linear-gradient(to right, rgba(0,0,0,.09) 1px, transparent 1px),' +
      'linear-gradient(to bottom, rgba(0,0,0,.09) 1px, transparent 1px)';
    layer.style.backgroundSize = (g * zoom) + 'px ' + (g * zoom) + 'px';
    overlay.appendChild(layer);
  }

  function showGuides(guides) {
    U.$$('.guide', overlay).forEach(function (n) { n.remove(); });
    guides.forEach(function (g) {
      var n = U.el('div', { class: 'guide ' + g.axis + (g.kind === 'center' ? ' center' : '') });
      if (g.axis === 'v') n.style.left = (g.pos * zoom) + 'px';
      else n.style.top = (g.pos * zoom) + 'px';
      overlay.appendChild(n);
