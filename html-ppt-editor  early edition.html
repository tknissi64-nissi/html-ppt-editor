/* ===========================================================================
   HTML PPT Editor :: ui/statusbar.js
   底部状态栏：页码 / 页面模式（含流式页的编辑目标切换）/ 提示 / 视图按钮 / 缩放。
   =========================================================================== */
var PS = window.PS || (window.PS = {});

PS.statusbar = (function () {
  'use strict';
  var U = PS.util, S = PS.store;

  var pageEl, modeEl, msgEl, viewEl, rangeEl, valEl;

  function init() {
    pageEl = document.getElementById('sb-page');
    modeEl = document.getElementById('sb-mode');
    msgEl = document.getElementById('sb-msg');
    viewEl = document.getElementById('view-btns');
    rangeEl = document.getElementById('zoom-range');
    valEl = document.getElementById('zoom-val');

    [
      { icon: 'view-normal', title: '普通视图', mode: 'normal' },
      { icon: 'view-sorter', title: '幻灯片浏览', mode: 'sorter' },
      { icon: 'view-notes', title: '备注窗格', toggle: 'notes' },
      { icon: 'view-reading', title: '阅读视图（放映）', show: true }
    ].forEach(function (v) {
      var b = U.el('button', { type: 'button', title: v.title, html: PS.icon(v.icon) });
      b.addEventListener('click', function () {
        if (v.show) PS.slideshow.start(S.curIndex());
        else if (v.toggle === 'notes') PS.notes.toggle();
        else PS.app.setViewMode(v.mode);
      });
      b.setAttribute('data-mode', v.mode || '');
      viewEl.appendChild(b);
    });

    document.getElementById('zoom-in').addEventListener('click', function () { PS.canvas.setZoom(PS.canvas.getZoom() * 1.15); });
    document.getElementById('zoom-out').addEventListener('click', function () { PS.canvas.setZoom(PS.canvas.getZoom() / 1.15); });
    document.getElementById('zoom-fit').addEventListener('click', function () { PS.canvas.fit(); });
    rangeEl.addEventListener('input', function () { PS.canvas.setZoom(parseFloat(rangeEl.value) / 100, true); paintZoom(); });

    modeEl.addEventListener('click', function () {
      var s = S.curSlide();
      if (!s || s.mode !== 'flow') return;
      PS.flow.toggleLayer();
    });
    /* 手型光标只在真的点得动的时候给（流式页可切换编辑目标）；
       画布页点了没有任何效果，给手型属于骗手感 —— 见 paint() 里按页类型设置。 */

    S.on('select', paint);
    S.on('slides', paint);
    S.on('deck', paint);
    S.on('view', paint);
    S.on('view-zoom', paintZoom);
    paint(); paintZoom();
  }

  function paint() {
    if (!S.deck) { pageEl.textContent = '未打开文件'; modeEl.textContent = ''; modeEl.style.cursor = 'default'; return; }
    var i = S.curIndex(), n = S.deck.slides.length;
    var sel = S.sel.elIds.length;
    pageEl.textContent = '第 ' + (i + 1) + ' 张，共 ' + n + ' 张' + (sel ? ' · 已选 ' + sel + ' 个对象' : '');
    var s = S.curSlide();
    if (!s) { modeEl.textContent = ''; modeEl.style.cursor = 'default'; return; }
    modeEl.style.cursor = s.mode === 'flow' ? 'pointer' : 'default';
    if (s.mode === 'canvas') {
      modeEl.textContent = '自由画布页';
      modeEl.title = '这一页的对象是绝对定位，放映时整页等比缩放';
    } else {
      modeEl.textContent = '流式组件页 · 编辑目标：' + (S.state.flowLayer ? '自由对象' : '文字') + '（点此切换）';
      modeEl.title = '流式组件页保持 clamp() 响应式排版；自由对象浮在其上，不影响原排版';
    }
    U.$$('button', viewEl).forEach(function (b) {
      var m = b.getAttribute('data-mode');
      if (m) b.classList.toggle('on', S.view.mode === m);
    });
  }

  function paintZoom() {
    var z = Math.round(PS.canvas.getZoom() * 100);
    if (document.activeElement !== rangeEl) rangeEl.value = U.clamp(z, 10, 400);
    valEl.textContent = z + '%';
  }

  function msg(text, kind, ms) {
    msgEl.textContent = text || '';
    msgEl.className = kind || '';
    if (ms) setTimeout(function () { if (msgEl.textContent === text) { msgEl.textContent = ''; msgEl.className = ''; } }, ms);
  }

  return { init: init, paint: paint, msg: msg };
})();

</script>
<script>
/* ===== inlined: js/feature/transition.js ===== */
/* ===========================================================================
   HTML PPT Editor :: feature/transition.js
   页面切换效果。

   实现方式：切换只是一段 CSS keyframes。编辑器把每页的选择写进
   slide.transition，导出时落成 data-transition / data-transition-dur 属性，
   放映运行时读属性给页面加动画类 —— 导出的文件自带效果，不依赖本编辑器。

   刻意克制：只做真正用得上的十来种。转场是给内容让路的，不是拿来炫技的，
   所以没有"百叶窗""棋盘"那类会打断阅读的效果。
   =========================================================================== */
var PS = window.PS || (window.PS = {});

PS.transition = (function () {
  'use strict';
  var U = PS.util, S = PS.store;

  /* key / 名称 / 分组 / 是否有方向 */
  var TYPES = [
    { key: 'none', name: '无', group: '细微' },
    { key: 'fade', name: '淡入', group: '细微' },
    { key: 'dissolve', name: '溶解', group: '细微' },
    { key: 'zoom', name: '缩放', group: '细微' },
    { key: 'push', name: '推入', group: '华丽', dir: true },
    { key: 'wipe', name: '擦除', group: '华丽', dir: true },
    { key: 'cover', name: '覆盖', group: '华丽', dir: true },
    { key: 'uncover', name: '揭开', group: '华丽', dir: true },
    { key: 'split', name: '分割', group: '华丽' },
    { key: 'reveal', name: '揭幕', group: '华丽' },
    { key: 'flip', name: '翻转', group: '动感', dir: true },
    { key: 'cube', name: '立方体', group: '动感', dir: true },
    { key: 'fall', name: '落下', group: '动感' },
    { key: 'rise', name: '升起', group: '动感' }
  ];
  var DIRS = [
    { key: 'left', name: '自右向左' },
    { key: 'right', name: '自左向右' },
    { key: 'up', name: '自下向上' },
    { key: 'down', name: '自上向下' }
  ];

  function byKey(k) {
    for (var i = 0; i < TYPES.length; i++) if (TYPES[i].key === k) return TYPES[i];
    return TYPES[0];
  }
  function hasDir(k) { return !!byKey(k).dir; }

  /* -------------------------------------------------------------------
     放映端用的 CSS。导出时随文件写出（只在真有切换效果时写）。
     每种效果一对 keyframes：进场的那页用 in，离场的那页用 out。
     ------------------------------------------------------------------- */
  var CSS = [
    '/* ---- HTML PPT Editor :: 页面切换 ---- */',
    '.slide[data-transition]{--ps-td:.5s}',
    '.ps-tr-in,.ps-tr-out{animation-duration:var(--ps-td,.5s);animation-fill-mode:both;',
    '  animation-timing-function:cubic-bezier(.4,0,.2,1)}',
    '.ps-tr-out{z-index:1}.ps-tr-in{z-index:2}',
    /* 有些效果需要父层建立 3D 场景 */
    '.deck.ps-tr-3d{perspective:1600px;perspective-origin:50% 50%}',
    '.ps-tr-in,.ps-tr-out{backface-visibility:hidden;transform-style:preserve-3d}',

    '@keyframes ps-fade-in{from{opacity:0}to{opacity:1}}',
    '@keyframes ps-fade-out{from{opacity:1}to{opacity:0}}',

    '@keyframes ps-dissolve-in{from{opacity:0;filter:blur(10px)}to{opacity:1;filter:none}}',
    '@keyframes ps-dissolve-out{from{opacity:1;filter:none}to{opacity:0;filter:blur(10px)}}',

    '@keyframes ps-zoom-in{from{opacity:0;transform:scale(1.09)}to{opacity:1;transform:none}}',
    '@keyframes ps-zoom-out{from{opacity:1;transform:none}to{opacity:0;transform:scale(.94)}}',

    /* 推入：两页一起走，像卷轴 */
    '@keyframes ps-push-in-left{from{transform:translateX(100%)}to{transform:none}}',
    '@keyframes ps-push-out-left{from{transform:none}to{transform:translateX(-100%)}}',
    '@keyframes ps-push-in-right{from{transform:translateX(-100%)}to{transform:none}}',
    '@keyframes ps-push-out-right{from{transform:none}to{transform:translateX(100%)}}',
    '@keyframes ps-push-in-up{from{transform:translateY(100%)}to{transform:none}}',
    '@keyframes ps-push-out-up{from{transform:none}to{transform:translateY(-100%)}}',
    '@keyframes ps-push-in-down{from{transform:translateY(-100%)}to{transform:none}}',
    '@keyframes ps-push-out-down{from{transform:none}to{transform:translateY(100%)}}',

    /* 擦除：新页用裁剪露出，旧页不动 */
    '@keyframes ps-wipe-in-left{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0)}}',
    '@keyframes ps-wipe-in-right{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}',
    '@keyframes ps-wipe-in-up{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0)}}',
    '@keyframes ps-wipe-in-down{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}',
    '@keyframes ps-hold{from{opacity:1}to{opacity:1}}',

    /* 覆盖：新页盖上来，旧页不动 */
    '@keyframes ps-cover-in-left{from{transform:translateX(100%)}to{transform:none}}',
    '@keyframes ps-cover-in-right{from{transform:translateX(-100%)}to{transform:none}}',
    '@keyframes ps-cover-in-up{from{transform:translateY(100%)}to{transform:none}}',
    '@keyframes ps-cover-in-down{from{transform:translateY(-100%)}to{transform:none}}',

    /* 揭开：旧页滑走露出新页 */
    '@keyframes ps-uncover-out-left{from{transform:none}to{transform:translateX(-100%)}}',
    '@keyframes ps-uncover-out-right{from{transform:none}to{transform:translateX(100%)}}',
    '@keyframes ps-uncover-out-up{from{transform:none}to{transform:translateY(-100%)}}',
    '@keyframes ps-uncover-out-down{from{transform:none}to{transform:translateY(100%)}}',

    '@keyframes ps-split-in{from{clip-path:inset(0 50% 0 50%)}to{clip-path:inset(0)}}',
    '@keyframes ps-reveal-in{from{clip-path:inset(50% 0 50% 0)}to{clip-path:inset(0)}}',

    '@keyframes ps-flip-in-left{from{transform:rotateY(90deg);opacity:0}to{transform:none;opacity:1}}',
    '@keyframes ps-flip-out-left{from{transform:none;opacity:1}to{transform:rotateY(-90deg);opacity:0}}',
    '@keyframes ps-flip-in-right{from{transform:rotateY(-90deg);opacity:0}to{transform:none;opacity:1}}',
    '@keyframes ps-flip-out-right{from{transform:none;opacity:1}to{transform:rotateY(90deg);opacity:0}}',
    '@keyframes ps-flip-in-up{from{transform:rotateX(-90deg);opacity:0}to{transform:none;opacity:1}}',
    '@keyframes ps-flip-out-up{from{transform:none;opacity:1}to{transform:rotateX(90deg);opacity:0}}',
    '@keyframes ps-flip-in-down{from{transform:rotateX(90deg);opacity:0}to{transform:none;opacity:1}}',
    '@keyframes ps-flip-out-down{from{transform:none;opacity:1}to{transform:rotateX(-90deg);opacity:0}}',

    '@keyframes ps-cube-in-left{from{transform:translateX(60%) rotateY(60deg)}to{transform:none}}',
    '@keyframes ps-cube-out-left{from{transform:none}to{transform:translateX(-60%) rotateY(-60deg)}}',
    '@keyframes ps-cube-in-right{from{transform:translateX(-60%) rotateY(-60deg)}to{transform:none}}',
    '@keyframes ps-cube-out-right{from{transform:none}to{transform:translateX(60%) rotateY(60deg)}}',
    '@keyframes ps-cube-in-up{from{transform:translateY(60%) rotateX(-60deg)}to{transform:none}}',
    '@keyframes ps-cube-out-up{from{transform:none}to{transform:translateY(-60%) rotateX(60deg)}}',
    '@keyframes ps-cube-in-down{from{transform:translateY(-60%) rotateX(60deg)}to{transform:none}}',
    '@keyframes ps-cube-out-down{from{transform:none}to{transform:translateY(60%) rotateX(-60deg)}}',

    '@keyframes ps-fall-in{from{opacity:0;transform:translateY(-9%) scale(1.03)}to{opacity:1;transform:none}}',
    '@keyframes ps-fall-out{from{opacity:1;transform:none}to{opacity:0;transform:translateY(6%) scale(.97)}}',
    '@keyframes ps-rise-in{from{opacity:0;transform:translateY(9%) scale(.97)}to{opacity:1;transform:none}}',
    '@keyframes ps-rise-out{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-6%) scale(1.03)}}',

    /* 系统开了「减弱动效」时把时长压到 1ms：切换照常发生、只是瞬间完成。
       比 animation:none 好——后者会把动画整个掐掉，某些效果（擦除/覆盖）
       依赖 fill-mode 的终态，掐掉反而会露出中间态。 */
    '@media (prefers-reduced-motion:reduce){.ps-tr-in,.ps-tr-out{animation-duration:1ms!important}}'
  ].join('\n');

  /** 某个效果的进/出动画名（放映运行时用同一份规则，保证编辑器预览与放映一致） */
  function animNames(type, dir) {
    dir = dir || 'left';
    switch (type) {
      case 'fade': return ['ps-fade-in', 'ps-fade-out'];
      case 'dissolve': return ['ps-dissolve-in', 'ps-dissolve-out'];
      case 'zoom': return ['ps-zoom-in', 'ps-zoom-out'];
      case 'push': return ['ps-push-in-' + dir, 'ps-push-out-' + dir];
      case 'wipe': return ['ps-wipe-in-' + dir, 'ps-hold'];
      case 'cover': return ['ps-cover-in-' + dir, 'ps-hold'];
      case 'uncover': return ['ps-fade-in', 'ps-uncover-out-' + dir];
      case 'split': return ['ps-split-in', 'ps-hold'];
      case 'reveal': return ['ps-reveal-in', 'ps-hold'];
      case 'flip': return ['ps-flip-in-' + dir, 'ps-flip-out-' + dir];
      case 'cube': return ['ps-cube-in-' + dir, 'ps-cube-out-' + dir];
      case 'fall': return ['ps-fall-in', 'ps-fall-out'];
      case 'rise': return ['ps-rise-in', 'ps-rise-out'];
      default: return null;
    }
  }
  function needs3D(type) { return type === 'flip' || type === 'cube'; }

  /** deck 里是否用到了切换 —— 决定导出时写不写这段 CSS/JS */
  function used(deck) {
    return deck.slides.some(function (s) {
      return s.transition && s.transition.type && s.transition.type !== 'none';
    });
  }

  /* ------------------------------------------------------------ 编辑命令 */
  function set(patch) {
    var s = S.curSlide(); if (!s) return;
    s.transition = U.assign({ type: 'none', dur: 500, dir: 'left' }, s.transition || {}, patch);
    S.commit('设置切换效果', { scope: 'slides' });
    preview();
  }
  function applyAll() {
    var s = S.curSlide(); if (!s) return;
    var t = U.deepClone(s.transition || { type: 'none', dur: 500, dir: 'left' });
    S.deck.slides.forEach(function (x) { x.transition = U.deepClone(t); });
    S.commit('切换效果应用到全部', { scope: 'slides' });
    PS.ui.toast('已把「' + byKey(t.type).name + '」应用到全部 ' + S.deck.slides.length + ' 页');
  }
  function current() {
    var s = S.curSlide();
    return (s && s.transition) || { type: 'none', dur: 500, dir: 'left' };
  }

  /**
   * 在编辑器画布上放一遍当前页的切换，用于即时预览。
   * @param explicit 用户主动点「预览一次」时传 true —— 这种情况下没得放要说一声，
   *                 不能像 set() 的顺带预览那样静默返回（新建文档默认就是「无」）。
   */
  function preview(explicit) {
    var t = current();
    if (!t.type || t.type === 'none') {
      if (explicit) PS.ui.toast('当前页的切换效果是「无」，先在左边选一个效果', 'warn');
      return;
    }
    var fdoc = PS.canvas.frameDoc;
    if (!fdoc) { if (explicit) PS.ui.toast('画布还没准备好，稍后再试', 'warn'); return; }
    var sec = fdoc.querySelector('section.slide');
    if (!sec) { if (explicit) PS.ui.toast('当前页没有可预览的内容', 'warn'); return; }
    var names = animNames(t.type, t.dir);
    if (!names) { if (explicit) PS.ui.toast('「' + byKey(t.type).name + '」没有可播放的动画', 'warn'); return; }

    /* 预览用的样式只注入编辑器的 iframe，不进模型也不进导出 */
    if (!fdoc.getElementById('ps-tr-css')) {
      var st = fdoc.createElement('style');
      st.id = 'ps-tr-css';
      st.textContent = CSS;
      fdoc.head.appendChild(st);
    }
    var deckEl = fdoc.querySelector('.deck');
    deckEl.classList.toggle('ps-tr-3d', needs3D(t.type));
    sec.classList.remove('ps-tr-in');
    void sec.offsetWidth;                       // 重排一次，动画才会重新播
    sec.style.setProperty('--ps-td', (t.dur || 500) + 'ms');
    sec.style.animationName = names[0];
    sec.classList.add('ps-tr-in');
    setTimeout(function () {
      sec.classList.remove('ps-tr-in');
      sec.style.animationName = '';
    }, (t.dur || 500) + 60);
  }

  /* ------------------------------------------------------- 功能区面板 */
  function gallery(anchor) {
    var t = current();
    var box = U.el('div', { class: 'tr-pop' });
    var h;
    var groups = [];
    TYPES.forEach(function (x) {
      var g = groups.filter(function (y) { return y.name === x.group; })[0];
      if (!g) { g = { name: x.group, items: [] }; groups.push(g); }
      g.items.push(x);
    });
    groups.forEach(function (g) {
      box.appendChild(U.el('h5', { text: g.name }));
      var grid = U.el('div', { class: 'grid' });
      g.items.forEach(function (x) {
        var b = U.el('button', { class: 'tr' + (t.type === x.key ? ' on' : ''), type: 'button', title: x.name });
        b.innerHTML = '<span class="pv">' + thumb(x.key) + '</span><span class="cap">' + U.escHTML(x.name) + '</span>';
        b.addEventListener('click', function () { h.close(); set({ type: x.key }); });
        grid.appendChild(b);
      });
      box.appendChild(grid);
    });
    h = PS.ui.popup(anchor, box);
    return h;
  }

  /** 效果示意图：两个方块的相对关系表达这个效果在做什么 */
  function thumb(key) {
    var a = 'fill="currentColor" opacity=".22"', b = 'fill="currentColor"';
    switch (key) {
      case 'none': return '<svg viewBox="0 0 60 34"><rect x="4" y="4" width="52" height="26" rx="3" ' + b + '/></svg>';
      case 'fade': return '<svg viewBox="0 0 60 34"><rect x="4" y="4" width="52" height="26" rx="3" ' + a + '/><rect x="4" y="4" width="52" height="26" rx="3" fill="currentColor" opacity=".65"/></svg>';
      case 'dissolve': return '<svg viewBox="0 0 60 34"><rect x="4" y="4" width="52" height="26" rx="3" ' + a + '/><rect x="8" y="8" width="6" height="6" ' + b + '/><rect x="22" y="14" width="6" height="6" ' + b + '/><rect x="38" y="8" width="6" height="6" ' + b + '/><rect x="44" y="20" width="6" height="6" ' + b + '/></svg>';
      case 'zoom': return '<svg viewBox="0 0 60 34"><rect x="4" y="4" width="52" height="26" rx="3" ' + a + '/><rect x="16" y="10" width="28" height="14" rx="2" ' + b + '/></svg>';
      case 'push': return '<svg viewBox="0 0 60 34"><rect x="-18" y="4" width="40" height="26" rx="3" ' + a + '/><rect x="26" y="4" width="40" height="26" rx="3" ' + b + '/><path d="M20,17 L26,17" stroke="currentColor" stroke-width="2"/></svg>';
      case 'wipe': return '<svg viewBox="0 0 60 34"><rect x="4" y="4" width="52" height="26" rx="3" ' + a + '/><rect x="30" y="4" width="26" height="26" ' + b + '/></svg>';
      case 'cover': return '<svg viewBox="0 0 60 34"><rect x="4" y="4" width="52" height="26" rx="3" ' + a + '/><rect x="24" y="4" width="32" height="26" rx="3" ' + b + '/></svg>';
      case 'uncover': return '<svg viewBox="0 0 60 34"><rect x="4" y="4" width="52" height="26" rx="3" ' + b + ' opacity=".22"/><rect x="4" y="4" width="26" height="26" rx="3" ' + b + '/></svg>';
      case 'split': return '<svg viewBox="0 0 60 34"><rect x="4" y="4" width="52" height="26" rx="3" ' + a + '/><rect x="4" y="4" width="14" height="26" ' + b + '/><rect x="42" y="4" width="14" height="26" ' + b + '/></svg>';
      case 'reveal': return '<svg viewBox="0 0 60 34"><rect x="4" y="4" width="52" height="26" rx="3" ' + a + '/><rect x="4" y="4" width="52" height="8" ' + b + '/><rect x="4" y="22" width="52" height="8" ' + b + '/></svg>';
      case 'flip': return '<svg viewBox="0 0 60 34"><path d="M30,4 L56,10 L56,24 L30,30 Z" ' + b + '/><path d="M30,4 L4,10 L4,24 L30,30 Z" ' + a + '/></svg>';
      case 'cube': return '<svg viewBox="0 0 60 34"><path d="M26,6 L54,4 L54,30 L26,28 Z" ' + b + '/><path d="M26,6 L8,12 L8,26 L26,28 Z" ' + a + '/></svg>';
      case 'fall': return '<svg viewBox="0 0 60 34"><rect x="10" y="2" width="40" height="12" rx="2" ' + a + '/><rect x="6" y="16" width="48" height="14" rx="3" ' + b + '/></svg>';
      case 'rise': return '<svg viewBox="0 0 60 34"><rect x="6" y="4" width="48" height="14" rx="3" ' + b + '/><rect x="10" y="21" width="40" height="12" rx="2" ' + a + '/></svg>';
      default: return '<svg viewBox="0 0 60 34"><rect x="4" y="4" width="52" height="26" rx="3" ' + a + '/></svg>';
    }
  }

  function dirMenu(anchor) {
    var t = current();
    if (!hasDir(t.type)) { PS.ui.toast('「' + byKey(t.type).name + '」没有方向可选', 'warn'); return; }
    PS.ui.menu(anchor, DIRS.map(function (d) {
      return { label: d.name, checked: (t.dir || 'left') === d.key, on: function () { set({ dir: d.key }); } };
    }));
  }

var PS = window.PS || (window.PS = {});

PS.exportHTML = (function () {
  'use strict';
  var U = PS.util, S = PS.store;

  var fileHandle = null;   // File System Access API 的句柄（如果拿得到）

  function supportsFS() { return typeof window.showSaveFilePicker === 'function'; }

  function build(opt) {
    return PS.serializer.toHTML(S.deck, opt);
  }

  function save(opt) {
    if (!S.deck) return;
    PS.canvas.endTextEdit();
    PS.canvas.endFlowEdit();
    var html = build(opt);
    if (fileHandle && supportsFS()) {
      writeHandle(fileHandle, html);
      return;
    }
    if (supportsFS()) { saveAs(opt); return; }
    U.download(PS.serializer.filenameFor(S.deck), html);
    S.markClean();
    PS.statusbar.msg('已导出 ' + PS.serializer.filenameFor(S.deck), 'ok', 4000);
  }

  function saveAs(opt) {
    if (!S.deck) return;
    PS.canvas.endTextEdit();
    PS.canvas.endFlowEdit();
    var html = build(opt);
    var name = PS.serializer.filenameFor(S.deck);
    if (!supportsFS()) {
      U.download(name, html);
      S.markClean();
      PS.statusbar.msg('已导出 ' + name, 'ok', 4000);
      return;
    }
    window.showSaveFilePicker({
      suggestedName: name,
      types: [{ description: 'HTML 演示文稿', accept: { 'text/html': ['.html'] } }]
    }).then(function (h) {
      fileHandle = h;
      writeHandle(h, html);
    }).catch(function (err) {
      if (err && err.name === 'AbortError') return;
      U.download(name, html);
      S.markClean();
    });
  }

  function writeHandle(h, html) {
    h.createWritable().then(function (w) {
      return w.write(new Blob([html], { type: 'text/html;charset=utf-8' })).then(function () { return w.close(); });
    }).then(function () {
      S.markClean();
      S.state.filename = h.name;
      PS.statusbar.msg('已保存到 ' + h.name, 'ok', 4000);
      PS.app.paintTitle();
    }).catch(function (err) {
      PS.ui.toast('保存失败：' + (err && err.message ? err.message : err), 'warn');
    });
  }

  function toClipboard() {
    if (!S.deck) return;
    var html = build();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(html).then(function () {
        PS.ui.toast('完整 HTML 已复制到剪贴板（' + Math.round(html.length / 1024) + ' KB）', 'ok');
      }).catch(function () { fallbackCopy(html); });
    } else fallbackCopy(html);
  }
  function fallbackCopy(html) {
    var ta = U.el('textarea', { style: { position: 'fixed', left: '-9999px' } });
    ta.value = html;
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); PS.ui.toast('已复制到剪贴板', 'ok'); }
    catch (e) { PS.ui.toast('复制失败，请改用「另存为」', 'warn'); }
    document.body.removeChild(ta);
  }

  /** 打印 / 导出 PDF：每页一张 16:9，交给浏览器的打印对话框「另存为 PDF」 */
  function printPDF() {
    if (!S.deck) return;
    var deck = S.deck;
    var css =
      '@page{size:' + deck.size.w + 'px ' + deck.size.h + 'px;margin:0}' +
      'html,body{margin:0;padding:0;background:#fff}' +
      '.pp{width:' + deck.size.w + 'px;height:' + deck.size.h + 'px;position:relative;overflow:hidden;page-break-after:always;break-after:page}' +
      '.pp:last-child{page-break-after:auto;break-after:auto}' +
      '.pp iframe{width:' + deck.size.w + 'px;height:' + deck.size.h + 'px;border:0;display:block}';

    var win = window.open('', '_blank');
    if (!win) { PS.ui.toast('浏览器拦截了弹窗，请允许弹出窗口后重试', 'warn'); return; }
    win.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>' +
      U.escHTML(deck.title) + '</title><style>' + css + '</style></head><body></body></html>');
    win.document.close();

    var pageCSS = (deck.css || (PS.template ? PS.template.css : '')) +
      '\n' + PS.serializer.themeOverrideCSS(deck) + '\n' + PS.render.CANVAS_CSS +
      /* 同画布：不给 html/body 高度，外来 deck 打印出来会是空白/全黑 */
      '\nhtml,body{height:100%!important;margin:0!important;overflow:hidden!important}' +
      '\n.deck{width:100%;height:100%}' +
      '\n.slide{transition:none!important;animation:none!important;opacity:1!important;transform:none!important}' +
      '\n';

    var printable = deck.slides.filter(function (s) { return !s.hidden; });
    printable.forEach(function (s) {
      var d = win.document.createElement('div');
      d.className = 'pp';
      var f = win.document.createElement('iframe');
      d.appendChild(f);
      win.document.body.appendChild(d);
      var fd = f.contentDocument;
      fd.open();
      fd.write('<!DOCTYPE html><html><head><meta charset="utf-8"><style>' + pageCSS + '</style></head><body>' +
        '<div class="deck"><section class="' + (s.classes || ['slide']).join(' ') + ' is-active"' +
        (s.mode === 'canvas' ? ' data-mode="canvas"' : '') + '>' +
        PS.render.slideInnerHTML(s, deck) + '</section></div></body></html>');
      fd.close();
      Array.prototype.forEach.call(fd.querySelectorAll('.ps-canvas'), function (c) { c.style.setProperty('--ps-k', 1); });
    });

    PS.ui.dialog({
      title: '打印 / 导出 PDF',
      body: '<p>已在新窗口里排好 <b>' + printable.length + '</b> 页（每页一张 ' + deck.size.w + '×' + deck.size.h + '）。'
        + (deck.slides.length !== printable.length ? '隐藏的 ' + (deck.slides.length - printable.length) + ' 页已跳过。' : '') + '</p>'
        + '<p>在那个窗口按 <kbd>Ctrl+P</kbd>，目标选「<b>另存为 PDF</b>」，并把边距设为<b>无</b>、勾选<b>背景图形</b>。</p>',
      buttons: [
        { label: '立即打开打印对话框', primary: true, on: function () { setTimeout(function () { win.focus(); win.print(); }, 300); } },
        { label: '我自己来' }
      ]
    });
  }

  function resetHandle() { fileHandle = null; }
  function hasHandle() { return !!fileHandle; }

  return {
    save: save, saveAs: saveAs, toClipboard: toClipboard, printPDF: printPDF,
    build: build, resetHandle: resetHandle, hasHandle: hasHandle, supportsFS: supportsFS
  };
})();

</script>
<script>
/* ===== inlined: js/feature/autosave.js ===== */
/* ===========================================================================
   HTML PPT Editor :: feature/autosave.js
   自动保存与崩溃恢复。存 IndexedDB（localStorage 装不下几百 KB 的 deck）。
   每 20 秒 + 每次结构性改动后落一次，保留最近 8 个快照。
   =========================================================================== */
var PS = window.PS || (window.PS = {});

PS.autosave = (function () {
  'use strict';
  var U = PS.util, S = PS.store;

  /* 库名保留旧的 html-ppt-studio：产品虽已改名 html-ppt-editor，但这是用户浏览器里
     已经存在的库，改名等于把他们攒下的草稿全部丢掉（新库是空的，旧库还占着空间）。
     这个名字用户永远看不到，不值得为对称去换。别"顺手清理"。 */
  var DB = 'html-ppt-studio', STORE = 'snapshots', KEEP = 8;
  var db = null, timer = null, lastSig = '';

  function open() {
    return new Promise(function (res, rej) {
      if (db) return res(db);
      var rq = indexedDB.open(DB, 1);
      rq.onupgradeneeded = function () {
        var d = rq.result;
        if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE, { keyPath: 'ts' });
      };
      rq.onsuccess = function () { db = rq.result; res(db); };
      rq.onerror = function () { rej(rq.error); };
    });
  }

  function init() {
    S.on('dirty', schedule);
    S.on('slides', schedule);
    timer = setInterval(function () { if (S.state.dirty) snap(); }, 20000);
    window.addEventListener('beforeunload', function (e) {
      if (!S.state.dirty) return;
      snap();
      e.preventDefault();
      e.returnValue = '演示文稿还有未保存的改动，确定要离开吗？';
      return e.returnValue;
    });
    /* 启动时若有比较新的快照，提示恢复 */
    setTimeout(checkRecovery, 800);
  }

  var schedule = null;
  (function () {
    schedule = U.debounce(function () { if (S.state.dirty) snap(); }, 3000);
  })();

  function snap() {
    if (!S.deck) return;
    var payload;
    try { payload = PS.serializer.toHTML(S.deck); } catch (e) { return; }
    var sig = payload.length + ':' + S.deck.slides.length;
    if (sig === lastSig) return;
    lastSig = sig;
    open().then(function (d) {
      var tx = d.transaction(STORE, 'readwrite');
      var st = tx.objectStore(STORE);
      st.put({
        ts: Date.now(),
        title: S.deck.title,
        slides: S.deck.slides.length,
        size: payload.length,
        html: payload
      });
      /* 只留最近 KEEP 份 */
      var all = [];
      st.openCursor().onsuccess = function (ev) {
        var c = ev.target.result;
        if (c) { all.push(c.key); c.continue(); return; }
        all.sort(function (a, b) { return b - a; });
        all.slice(KEEP).forEach(function (k) { st.delete(k); });
      };
      tx.oncomplete = function () { PS.statusbar.msg('已自动保存草稿 ' + new Date().toLocaleTimeString(), '', 2500); };
    }).catch(function () { /* 隐私模式下 IndexedDB 不可用，静默降级 */ });
  }

  function list() {
    return open().then(function (d) {
      return new Promise(function (res) {
        var out = [];
        var st = d.transaction(STORE, 'readonly').objectStore(STORE);
        st.openCursor().onsuccess = function (ev) {
          var c = ev.target.result;
          if (c) { out.push(c.value); c.continue(); return; }
          out.sort(function (a, b) { return b.ts - a.ts; });
          res(out);
        };
      });
    }).catch(function () { return []; });
  }

  function checkRecovery() {
    if (S.deck) return;
    list().then(function (rows) {
      if (!rows.length) return;
      var r = rows[0];
      var mins = Math.round((Date.now() - r.ts) / 60000);
      PS.ui.dialog({
        title: '发现自动保存的草稿',
        body: '<p>上次编辑的《<b>' + U.escHTML(r.title) + '</b>》（' + r.slides + ' 页）'
          + '有一份 ' + (mins < 1 ? '刚刚' : mins + ' 分钟前') + '的自动保存草稿。</p><p>要恢复吗？</p>',
        buttons: [
          { label: '恢复', primary: true, on: function () { restore(r); } },
          { label: '不用了' },
          { label: '查看全部草稿', on: function () { setTimeout(showRecovery, 100); } }
        ]
      });
    });
  }

  function restore(row) {
    try {
      var r = PS.parser.parse(row.html, row.title + '.html');
      PS.app.load(r.deck, row.title + '.html', r.warnings);
      PS.ui.toast('已从自动保存草稿恢复', 'ok');
    } catch (e) {
      PS.ui.toast('草稿损坏，无法恢复：' + e.message, 'warn');
    }
  }

  function showRecovery() {
    list().then(function (rows) {
      if (!rows.length) { PS.ui.toast('没有自动保存的草稿'); return; }
      var box = U.el('div');
      rows.forEach(function (r) {
        var b = U.el('button', {
          class: 'rb-sm', style: { width: '100%', height: 'auto', padding: '7px 8px', justifyContent: 'flex-start' },
          html: PS.icon('open') + '<span><b>' + U.escHTML(r.title) + '</b> · ' + r.slides + ' 页 · ' +
            Math.round(r.size / 1024) + ' KB<br><span style="color:var(--ui-ink-3);font-size:11px">' +
            new Date(r.ts).toLocaleString() + '</span></span>'
        });
        b.addEventListener('click', function () { dlg.close(); restore(r); });
        box.appendChild(b);
      });
      var dlg = PS.ui.dialog({
        title: '自动保存的草稿（最近 ' + rows.length + ' 份）',
        body: box,
        buttons: [
          {
            label: '清空全部', danger: true, on: function () {
              open().then(function (d) { d.transaction(STORE, 'readwrite').objectStore(STORE).clear(); });
              PS.ui.toast('已清空草稿');
            }
          },
          { label: '关闭', primary: true }
        ]
      });
    });
  }

  return { init: init, snap: snap, list: list, showRecovery: showRecovery };
})();

</script>
<script>
/* ===== inlined: js/app.js ===== */
/* ===========================================================================
   HTML PPT Editor :: app.js
   启动装配、全局快捷键、文件打开/拖放、窗格分隔条、查找替换、帮助。
   =========================================================================== */
var PS = window.PS || (window.PS = {});

PS.app = (function () {
  'use strict';
  var U = PS.util, M = PS.model, S = PS.store;

  /* ============================================================== 启动 */
  function boot() {
    PS.canvas.init();
    PS.thumbs.init();
    PS.notes.init();
    PS.panel.init();
    PS.ribbon.init();
    PS.statusbar.init();
    PS.autosave.init();

    bindShell();
    bindKeys();
    bindDrop();

    S.on('dirty', paintTitle);
    S.on('deck', paintTitle);
    S.on('select', function () { PS.flow.syncOnSlideChange(); });
    S.on('view', applyPanes);
    window.addEventListener('resize', U.debounce(function () {
      applyPanes();
      if (S.view.zoom === 'fit') PS.canvas.fit();
    }, 120));
    applyPanes();
    paintTitle();

    /* 没有文档时显示欢迎页 */
    document.getElementById('stage-empty').hidden = false;
    document.getElementById('empty-new').addEventListener('click', function () { newDeck(); });
    document.getElementById('empty-open').addEventListener('click', function () { openFile(); });
  }

  function bindShell() {
    document.getElementById('btn-help').addEventListener('click', showHelp);
    document.getElementById('file-input').addEventListener('change', function (e) {
      var f = e.target.files && e.target.files[0];
      if (f) readFile(f);
      e.target.value = '';
    });
    document.getElementById('image-input').addEventListener('change', function (e) {
      var f = e.target.files && e.target.files[0];
      if (f) readImage(f, e.target.dataset.replace === '1');
      e.target.value = '';
      e.target.dataset.replace = '';
    });
    splitters();
  }

  /* --------------------------------------------------------- 窗格分隔条 */
  function splitters() {
    U.$$('.splitter').forEach(function (sp) {
      sp.addEventListener('mousedown', function (e) {
        e.preventDefault();
        var target = sp.getAttribute('data-target');
        var horiz = sp.classList.contains('horiz');
        var startPos = horiz ? e.clientY : e.clientX;
        var css = getComputedStyle(document.documentElement);
        var varName = { thumbs: '--w-thumbs', format: '--w-format', notes: '--h-notes' }[target];
        var start = parseFloat(css.getPropertyValue(varName));
        sp.classList.add('dragging');
        function mm(ev) {
          var d = (horiz ? ev.clientY : ev.clientX) - startPos;
          if (target === 'format' || target === 'notes') d = -d;
          var v = U.clamp(start + d, target === 'notes' ? 40 : 120, target === 'notes' ? 400 : 520);
          document.documentElement.style.setProperty(varName, v + 'px');
          if (S.view.zoom === 'fit') PS.canvas.fit();
        }
        function mu() {
          document.removeEventListener('mousemove', mm);
          document.removeEventListener('mouseup', mu);
          sp.classList.remove('dragging');
          if (S.view.zoom === 'fit') PS.canvas.fit();
        }
        document.addEventListener('mousemove', mm);
        document.addEventListener('mouseup', mu);
      });
    });
  }

  /**
   * 三栏布局的实际显隐。
   * 左右窗格是固定宽度，窗口一窄就会把中间的画布挤成一条缝（实测能挤到 38px），
   * 那时候什么都点不准、功能区也基本看不见。所以这里按可用宽度**自动让路**：
   * 先收格式窗格，再收缩略图窗格。用户自己的开关仍然保留在 S.view 里，
   * 窗口一变宽就自动还原，不会把人的选择吃掉。
   */
  function roomFor() {
    var W = document.documentElement.clientWidth || window.innerWidth;
    var cs = getComputedStyle(document.documentElement);
    var wT = parseFloat(cs.getPropertyValue('--w-thumbs')) || 196;
    var wF = parseFloat(cs.getPropertyValue('--w-format')) || 296;
    var MIN_STAGE = 420;          // 画布至少要留这么宽才谈得上可用
    var room = { thumbs: true, format: true, cramped: false };
    if (W - wT - wF - 40 < MIN_STAGE) { room.format = false; room.cramped = true; }
    if (W - wT - 40 < MIN_STAGE) { room.thumbs = false; }
    return room;
  }

  function applyPanes() {
    var room = roomFor();
    var showThumbs = S.view.thumbsOpen && room.thumbs;
    var showFormat = S.view.panelOpen && room.format;

    document.getElementById('pane-thumbs').classList.toggle('hide', !showThumbs);
    document.getElementById('split-thumbs').style.display = showThumbs ? '' : 'none';
    document.getElementById('pane-format').classList.toggle('hide', !showFormat);
    document.getElementById('split-format').style.display = showFormat ? '' : 'none';
    document.getElementById('pane-notes').classList.toggle('hide', !S.view.notesOpen);
    document.getElementById('split-notes').style.display = S.view.notesOpen ? '' : 'none';

    /* 窄屏时功能区切紧凑：去掉分组标题、按钮变矮，让更多组挤得进来 */
    document.body.classList.toggle('compact', room.cramped);
    document.body.classList.toggle('panes-auto-hidden', showThumbs !== S.view.thumbsOpen || showFormat !== S.view.panelOpen);
  }

  function paintTitle() {
    var n = document.getElementById('doc-name');
    var d = document.getElementById('doc-dirty');
    var sub = document.getElementById('doc-sub');
    if (!S.deck) { n.textContent = '未打开演示文稿'; d.hidden = true; sub.textContent = ''; return; }
    n.textContent = S.state.filename || (S.deck.title + '.html');
    d.hidden = !S.state.dirty;
    sub.textContent = '· HTML PPT Editor' + (S.deck.origin === 'import' ? ' · 已导入外来 deck' : '');
    document.title = (S.state.dirty ? '• ' : '') + S.deck.title + ' — HTML PPT Editor';
  }

  /* ============================================================== 文件 */
  function load(deck, filename, warnings) {
    S.init(deck, filename);
    PS.exportHTML.resetHandle();
    document.getElementById('stage-empty').hidden = true;
    PS.canvas.fit();
    PS.ribbon.build();
    if (warnings && warnings.length) {
      PS.ui.dialog({
        title: '导入完成，有 ' + warnings.length + ' 条提示',
        body: '<ul style="margin:0;padding-left:18px">' + warnings.map(function (w) { return '<li>' + U.escHTML(w) + '</li>'; }).join('') + '</ul>',
        buttons: [{ label: '知道了', primary: true }]
      });
    } else {
      PS.statusbar.msg('已打开 ' + deck.slides.length + ' 页', 'ok', 4000);
    }
  }

  function newDeck() {
    proceedIfClean(function () {
      var deck = M.newDeck({ title: '未命名演示文稿' });
      deck.css = PS.template ? PS.template.css : '';
      deck.runtime = PS.template ? PS.template.js : '';
      /* 新建即套默认模板：封面 + 目录 + 一页正文，打开就能往里填内容 */
      deck.slides = PS.templates.starterSlides(deck);
      load(deck, null, null);
    });
  }

  function openFile() {
    proceedIfClean(function () { document.getElementById('file-input').click(); });
  }

  function readFile(file) {
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var r = PS.parser.parse(String(fr.result), file.name);
        load(r.deck, file.name, r.warnings);
      } catch (e) {
        PS.ui.dialog({ title: '打开失败', body: '<p>' + U.escHTML(e.message) + '</p>', buttons: [{ label: '关闭', primary: true }] });
      }
    };
    fr.readAsText(file, 'utf-8');
  }

  function proceedIfClean(fn) {
    if (!S.state.dirty) return fn();
    PS.ui.confirm('当前演示文稿有未保存的改动，继续将丢失这些改动。', { title: '未保存的改动', okLabel: '不保存，继续', danger: true })
      .then(function (ok) { if (ok) fn(); });
  }

  function bindDrop() {
    var hint = document.getElementById('drop-hint');
    /* 不要用 dragenter/dragleave 配对计数：拖过子元素时两个事件的次数对不上，
       拖到窗口外松手更是根本收不到 dragleave —— 提示层就永久糊在最上面，
       看起来像"画布不渲染了"。改成靠 dragover 心跳：只要还在拖就一直有
       dragover，一旦停了超过 160ms 就自动收起，任何异常路径都能自愈。 */
    var beat = null;
    /* 显隐一律走 .is-on 类：单靠 hidden 属性会被 CSS 里的 display:flex 盖掉 */
    function show() {
      hint.hidden = false;
      hint.classList.add('is-on');
      clearTimeout(beat);
      beat = setTimeout(hide, 160);
    }
    function hide() {
      clearTimeout(beat); beat = null;
      hint.classList.remove('is-on');
      hint.hidden = true;
    }

    window.addEventListener('dragover', function (e) {
      e.preventDefault();
      if (!e.dataTransfer || Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') < 0) return;
      e.dataTransfer.dropEffect = 'copy';
      show();
    });
    /* 兜底：这些时机一律收起 */
    ['dragend', 'dragleave', 'mouseleave', 'blur', 'focus', 'keydown'].forEach(function (evt) {
      window.addEventListener(evt, function (e) {
        if (evt === 'keydown' && e.key !== 'Escape') return;
        if (evt === 'dragleave' && e.relatedTarget) return;   // 只在真正离开窗口时收
        hide();
      });
    });
    window.addEventListener('drop', function (e) {
      e.preventDefault();
      hide();
      var f = e.dataTransfer.files && e.dataTransfer.files[0];
      if (!f) return;
      if (/^image\//.test(f.type)) { readImage(f); return; }
      if (!/\.html?$/i.test(f.name)) { PS.ui.toast('只能打开 .html 演示文稿或图片文件', 'warn'); return; }
      proceedIfClean(function () { readFile(f); });
    });
  }

  /* ============================================================== 插入 */
  function insertTextbox() {
    if (!S.deck) return;
    PS.shape.setPending({ type: 'text' });
    PS.ui.toast('在幻灯片上拖出文本框范围，或直接单击放置');
  }
  function insertImage(replace) {
    if (!S.deck) return;
    var inp = document.getElementById('image-input');
    inp.dataset.replace = replace ? '1' : '';
    inp.click();
  }
  function readImage(file, replace) {
    if (file.size > 8 * 1024 * 1024) {
      PS.ui.confirm('这张图有 ' + Math.round(file.size / 1024 / 1024) + ' MB。图片会以 base64 内嵌进 HTML，'
        + '文件体积大约会增加 ' + Math.round(file.size * 1.37 / 1024 / 1024) + ' MB。确定继续吗？', { title: '图片较大' })
        .then(function (ok) { if (ok) doReadImage(file, replace); });
      return;
    }
    doReadImage(file, replace);
  }
  function doReadImage(file, replace) {
    var fr = new FileReader();
    fr.onload = function () {
      var src = String(fr.result);
      if (replace) {
        var els = S.selElements().filter(function (e) { return e.type === 'image'; });
        if (els.length) { els.forEach(function (e) { e.src = src; }); S.commit('更换图片'); return; }
      }
      var img = new Image();
      img.onload = function () {
        var deck = S.deck;
        var maxW = deck.size.w * 0.7, maxH = deck.size.h * 0.7;
        var k = Math.min(maxW / img.width, maxH / img.height, 1);
        var w = Math.round(img.width * k), h = Math.round(img.height * k);
        PS.shape.place({ type: 'image', src: src }, {
          x: Math.round((deck.size.w - w) / 2), y: Math.round((deck.size.h - h) / 2), w: w, h: h
        });
      };
      img.onerror = function () { PS.ui.toast('这个图片文件读不出来', 'warn'); };
      img.src = src;
    };
    fr.readAsDataURL(file);
  }

  function insertLink() {
    var els = S.selElements();
    if (!els.length) { PS.ui.toast('先选中一个对象再加超链接', 'warn'); return; }
    PS.ui.prompt('插入超链接', '地址', els[0].href || '', {
      hint: '外部链接写 <code>https://…</code>；跳到本文档第 N 页写 <code>#/N</code>（deck 运行时支持这种锚点）。留空则移除链接。'
    }).then(function (v) {
      if (v == null) return;
      els.forEach(function (e) { e.href = v || null; });
      S.commit(v ? '插入超链接' : '移除超链接');
    });
  }

  function resetSlide() {
    var s = S.curSlide();
    if (!s) return;
    if (s.mode !== 'canvas') { PS.ui.toast('流式组件页没有版式占位符可重置', 'warn'); return; }
    PS.ui.confirm('把这一页恢复成「' + (PS.thumbs.LAYOUTS.filter(function (l) { return l.key === s.layout; })[0] || { name: '空白' }).name
      + '」版式的初始状态？当前这一页的所有对象都会被替换。', { title: '重置幻灯片', danger: true })
      .then(function (ok) {
        if (!ok) return;
        s.elements = [];
        PS.thumbs.applyLayout(s, s.layout || 'titleContent');
        S.commit('重置幻灯片');
      });
  }

  /* -------------------------------------------------------------- 格式刷 */
  function formatBrush() {
    var els = S.selElements();
    if (S.state.formatBrush) { S.state.formatBrush = null; PS.ribbon.refresh(); PS.statusbar.msg(''); return; }
    if (!els.length) { PS.ui.toast('先选中一个对象，再点格式刷', 'warn'); return; }
    var e = els[0];
    S.state.formatBrush = {
      fill: U.deepClone(e.fill), line: U.deepClone(e.line), effect: U.deepClone(e.effect),
      opacity: e.opacity, text: e.text ? U.deepClone(e.text) : null
    };
    PS.ribbon.refresh();
    PS.statusbar.msg('格式刷已就绪：点另一个对象即可套用格式（Esc 取消）');
  }
  /** 由 canvas 在选中变化时调用 */
  function applyBrushTo(el) {
    var b = S.state.formatBrush;
    if (!b || !el) return false;
    el.fill = U.deepClone(b.fill);
    el.line = U.deepClone(b.line);
    el.effect = U.deepClone(b.effect);
    el.opacity = b.opacity;
    if (b.text && el.text) {
      var html = el.text.html;
      el.text = U.deepClone(b.text);
      el.text.html = html;
    }
    S.state.formatBrush = null;
    PS.ribbon.refresh();
    PS.statusbar.msg('');
    S.commit('套用格式');
    return true;
  }

  /* ============================================================ 查找替换 */
  function find(withReplace) {
    if (!S.deck) return;
    var q = U.el('input', { class: 'f-in', placeholder: '要查找的文字' });
    var r = U.el('input', { class: 'f-in', placeholder: '替换为' });
    var out = U.el('div', { class: 'f-hint' });
    var body = U.el('div', null, [
      U.el('div', { class: 'fr' }, [U.el('label', { text: '查找内容', class: 'wide' }), q]),
      withReplace ? U.el('div', { class: 'fr' }, [U.el('label', { text: '替换为', class: 'wide' }), r]) : null,
      out
    ]);

    function scan(replace) {
      var needle = q.value;
      if (!needle) { out.textContent = '请输入要查找的文字'; return; }
      var hits = 0, pages = [];
      S.deck.slides.forEach(function (s, i) {
        var n = 0;
        var re = new RegExp(needle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
        if (s.raw) { var m = s.raw.match(re); n += m ? m.length : 0; }
        (s.elements || []).forEach(function (e) {
          if (e.text && e.text.html) { var m2 = e.text.html.match(re); n += m2 ? m2.length : 0; }
        });
        if (s.notes) { var m3 = s.notes.match(re); n += m3 ? m3.length : 0; }
        if (n) { hits += n; pages.push(i + 1); }

        if (replace && n) {
          var rep = r.value;
          if (s.raw) s.raw = s.raw.replace(re, rep);
          (s.elements || []).forEach(function (e) {
            if (e.text && e.text.html) e.text.html = e.text.html.replace(re, rep);
          });
          if (s.notes) s.notes = s.notes.replace(re, rep);
        }
      });
      if (replace && hits) S.commit('替换文本', { scope: 'slides' });
      out.innerHTML = hits
        ? (replace ? '已替换 ' : '找到 ') + '<b>' + hits + '</b> 处，分布在第 ' + pages.join('、') + ' 页'
        : '没有找到「' + U.escHTML(needle) + '」';
      if (hits && !replace && pages.length) S.selectSlide(S.deck.slides[pages[0] - 1].id);
    }

    q.addEventListener('keydown', function (e) { e.stopPropagation(); if (e.key === 'Enter') scan(false); });
    r.addEventListener('keydown', function (e) { e.stopPropagation(); });

    PS.ui.dialog({
      title: withReplace ? '查找和替换' : '查找',
      body: body,
      buttons: [
        withReplace ? { label: '全部替换', primary: true, on: function () { scan(true); return false; } } : null,
        { label: '查找', primary: !withReplace, on: function () { scan(false); return false; } },
        { label: '关闭' }
      ].filter(Boolean)
    });
  }

  /* ============================================================== 视图 */
  function setViewMode(mode) {
    if (mode === 'sorter') {
      S.setView({ mode: 'sorter' });
      sorterView();
      return;
    }
    S.setView({ mode: 'normal' });
  }

  /** 幻灯片浏览视图：用对话框铺一个大网格，直接拖排序 */
  function sorterView() {
    var grid = U.el('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(190px,1fr))', gap: '12px' } });
    S.deck.slides.forEach(function (s, i) {
      var cell = U.el('div', { style: { cursor: 'pointer' } });
      var box = U.el('div', {
        style: {
          aspectRatio: '16/9', border: '1px solid var(--ui-line-2)', borderRadius: '3px',
          overflow: 'hidden', position: 'relative', background: '#fff',
          outline: s.id === S.sel.slideId ? '2px solid var(--ui-accent)' : 'none'
        }
      });
      var f = U.el('iframe', { scrolling: 'no', style: { border: '0', transformOrigin: '0 0', position: 'absolute', inset: '0' } });
      box.appendChild(f);
      cell.appendChild(box);
      cell.appendChild(U.el('div', { style: { fontSize: '11px', padding: '3px 2px', color: 'var(--ui-ink-2)' }, text: (i + 1) + '. ' + (s.title || '（无标题）') }));
      cell.addEventListener('click', function () { S.selectSlide(s.id); dlg.close(); setViewMode('normal'); });
      grid.appendChild(cell);
      requestAnimationFrame(function () {
        var W = S.deck.size.w, H = S.deck.size.h;
        f.style.width = W + 'px'; f.style.height = H + 'px';
        f.style.transform = 'scale(' + (box.clientWidth / W) + ')';
        var d = f.contentDocument;
        d.open();
        d.write('<!DOCTYPE html><html><head><meta charset="utf-8"><style>' +
          (S.deck.css || '') + PS.serializer.themeOverrideCSS(S.deck) + PS.render.CANVAS_CSS +
          'html,body{height:100%!important;margin:0!important;overflow:hidden!important}.deck{width:100%;height:100%}' +
          '.slide{transition:none!important;animation:none!important;opacity:1!important;transform:none!important}' +
          '</style></head><body><div class="deck">' +
          '<section class="' + (s.classes || ['slide']).join(' ') + ' is-active"' +
          (s.mode === 'canvas' ? ' data-mode="canvas"' : '') + '>' +
          PS.render.slideInnerHTML(s, S.deck) + '</section></div></body></html>');
        d.close();
        Array.prototype.forEach.call(d.querySelectorAll('.ps-canvas'), function (c) { c.style.setProperty('--ps-k', 1); });
      });
    });
    var dlg = PS.ui.dialog({
      title: '幻灯片浏览 · 共 ' + S.deck.slides.length + ' 张',
      width: 'min(1100px,94vw)',
      body: grid,
      buttons: [{ label: '关闭', primary: true, on: function () { S.setView({ mode: 'normal' }); } }]
    });
  }

  /* ============================================================== 快捷键 */
  function bindKeys() {
    document.addEventListener('keydown', function (e) {
      var tag = (e.target.tagName || '').toLowerCase();
      var typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
      var ctrl = U.ctrlKey(e);

      /* Esc：层层退出 */
      if (e.key === 'Escape') {
        if (PS.shape.getPending()) { PS.shape.clearPending(); PS.ui.toast('已取消插入'); return; }
        if (S.state.formatBrush) { S.state.formatBrush = null; PS.ribbon.refresh(); PS.statusbar.msg(''); return; }
        if (PS.canvas.editing) { PS.canvas.endTextEdit(); PS.canvas.endFlowEdit(); return; }
        S.clearElSelection();
        return;
      }

      if (e.key === 'F1') { e.preventDefault(); showHelp(); return; }
      if (e.key === 'F5') { e.preventDefault(); PS.slideshow.start(e.shiftKey ? S.curIndex() : 0); return; }

      var arrows = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };

      if (ctrl) {
        /* Ctrl+方向键 = 精确微移 1px。必须在下面这堆字母快捷键之前处理：
           这个 if(ctrl){…} 块结尾是无条件 return，放到后面就永远轮不到它。 */
        if (arrows[e.key] && !typing) {
          e.preventDefault();
          if (S.sel.elIds.length) PS.arrange.nudge(arrows[e.key][0], arrows[e.key][1], true);
          return;
        }
        var k = e.key.toLowerCase();
        if (k === 's') { e.preventDefault(); e.shiftKey ? PS.exportHTML.saveAs() : PS.exportHTML.save(); return; }
        if (k === 'o') { e.preventDefault(); openFile(); return; }
        if (k === 'n') { e.preventDefault(); newDeck(); return; }
        if (k === 'p') { e.preventDefault(); PS.exportHTML.printPDF(); return; }
        if (k === 'z' && !e.shiftKey) { e.preventDefault(); S.undo(); return; }
        if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); S.redo(); return; }
        if (k === 'f') { e.preventDefault(); find(false); return; }
        if (k === 'h') { e.preventDefault(); find(true); return; }
        if (k === 'k') { e.preventDefault(); insertLink(); return; }
        if (k === 'm') { e.preventDefault(); PS.thumbs.addSlide(); return; }
        if (typing) return;
        if (k === 'a') { e.preventDefault(); PS.select.selectAll(); return; }
        if (k === 'c') { e.preventDefault(); PS.select.copy(); return; }
        if (k === 'x') { e.preventDefault(); PS.select.cut(); return; }
        if (k === 'v') { e.preventDefault(); PS.select.paste(); return; }
        if (k === 'd') { e.preventDefault(); PS.select.duplicate(); return; }
        if (k === 'g') { e.preventDefault(); e.shiftKey ? PS.arrange.ungroup() : PS.arrange.group(); return; }
        if (k === 'b') { e.preventDefault(); PS.text.toggleStyle('bold'); return; }
        if (k === 'i') { e.preventDefault(); PS.text.toggleStyle('italic'); return; }
        if (k === 'u') { e.preventDefault(); PS.text.toggleStyle('underline'); return; }
        if (k === 'l') { e.preventDefault(); PS.text.setAlign('left'); return; }
        if (k === 'e') { e.preventDefault(); PS.text.setAlign('center'); return; }
        if (k === 'r') { e.preventDefault(); PS.text.setAlign('right'); return; }
        if (k === 'j') { e.preventDefault(); PS.text.setAlign('justify'); return; }
        if (e.key === ']') { e.preventDefault(); PS.text.stepSize(1); return; }
        if (e.key === '[') { e.preventDefault(); PS.text.stepSize(-1); return; }
        if (e.key === '0') { e.preventDefault(); PS.canvas.fit(); return; }
        if (e.key === '=' || e.key === '+') { e.preventDefault(); PS.canvas.setZoom(PS.canvas.getZoom() * 1.15); return; }
        if (e.key === '-') { e.preventDefault(); PS.canvas.setZoom(PS.canvas.getZoom() / 1.15); return; }
        return;
      }

      if (typing) return;

      /* 对象操作 */
      if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); PS.select.remove(); return; }
      if (e.key === 'Tab') { e.preventDefault(); PS.select.cycle(e.shiftKey); return; }
      if (e.key === 'F2') {
        e.preventDefault();
        var sel = S.sel.elIds;
        if (sel.length === 1) PS.canvas.beginTextEdit(sel[0]);
        return;
      }

      /* 方向键：有选中就微移对象，没选中就翻页 */
      if (arrows[e.key]) {
        e.preventDefault();
        if (S.sel.elIds.length) PS.arrange.nudge(arrows[e.key][0], arrows[e.key][1], e.ctrlKey || e.altKey);
        else navSlide(e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 1);
        return;
      }
      if (e.key === 'PageUp') { e.preventDefault(); navSlide(-1); return; }
      if (e.key === 'PageDown') { e.preventDefault(); navSlide(1); return; }
      if (e.key === 'Home') { e.preventDefault(); gotoSlide(0); return; }
      if (e.key === 'End') { e.preventDefault(); gotoSlide(S.deck ? S.deck.slides.length - 1 : 0); return; }
    });
  }

  function navSlide(d) { gotoSlide(S.curIndex() + d); }
  function gotoSlide(i) {
    if (!S.deck) return;
    i = U.clamp(i, 0, S.deck.slides.length - 1);
    S.selectSlide(S.deck.slides[i].id);
  }

  /* ============================================================== 帮助 */
  function showHelp() {
    var rows = [
      ['h', '文件'],
      ['Ctrl+N', '新建'], ['Ctrl+O', '打开'],
      ['Ctrl+S', '保存'], ['Ctrl+Shift+S', '另存为'],
      ['Ctrl+P', '打印 / 导出 PDF'], ['F5 / Shift+F5', '从头 / 从当前放映'],
      ['h', '编辑'],
      ['Ctrl+Z / Ctrl+Y', '撤销 / 恢复'], ['Ctrl+X / C / V', '剪切 / 复制 / 粘贴'],
      ['Ctrl+D', '再制'], ['Ctrl+A', '全选对象'],
      ['Delete', '删除对象'], ['Ctrl+F / Ctrl+H', '查找 / 替换'],
      ['h', '对象'],
      ['Tab / Shift+Tab', '在对象间循环选择'], ['F2', '编辑选中对象的文字'],
      ['方向键', '微移对象（无选中时翻页）'], ['Ctrl+方向键 / Alt+方向键', '精确微移 1px'],
      ['Ctrl+G / Ctrl+Shift+G', '组合 / 取消组合'], ['拖动时按 Shift', '约束为水平或垂直移动'],
      ['缩放时按 Shift', '锁定纵横比'], ['缩放时按 Alt', '从中心缩放'],
      ['旋转时按 Shift', '每 15° 吸附'],
      ['h', '文字'],
      ['Ctrl+B / I / U', '加粗 / 倾斜 / 下划线'],
      ['Ctrl+L / E / R / J', '左 / 中 / 右 / 两端对齐'],
      ['Ctrl+] / Ctrl+[', '增大 / 减小字号'],
      ['双击对象', '进入文字编辑'],
      ['h', '视图'],
      ['Ctrl+0', '适应窗口'], ['Ctrl+= / Ctrl+-', '放大 / 缩小'],
      ['Ctrl+滚轮', '缩放画布'], ['Ctrl+M', '新建幻灯片'],
      ['Esc', '逐层退出：取消插入 → 退出编辑 → 取消选择'],
      ['h', '放映时（deck 自带运行时）'],
      ['← →', '翻页'], ['F', '全屏'], ['S', '演讲者视图'],
      ['N', '备注抽屉'], ['O', '幻灯片总览'], ['T', '切换主题']
    ];
    var html = '<div class="keys">';
    rows.forEach(function (r) {
      if (r[0] === 'h') { html += '<div class="h">' + r[1] + '</div>'; return; }
      html += '<kbd>' + U.escHTML(r[0]) + '</kbd><span>' + U.escHTML(r[1]) + '</span>';
    });
    html += '</div>';
    PS.ui.dialog({ title: '快捷键一览', width: 'min(760px,92vw)', body: html, buttons: [{ label: '关闭', primary: true }] });
  }

  function showAbout() {
    PS.ui.dialog({
      title: '关于 HTML PPT Editor',
      body: '<p>给 HTML 形式的演示文稿做的可视化编辑器，界面与常用功能对标 Microsoft PowerPoint。</p>'
        + '<p><b>两种页面模式</b></p>'
        + '<ul style="padding-left:18px;margin:4px 0">'
        + '<li><b>流式组件页</b>：保留原生 <code>rs-*</code> 组件与 <code>clamp()</code> 响应式字号，'
        + '笔记本和会议室投影仪共用一份排版永不越界。可直接改文字，也可叠加自由对象。</li>'
        + '<li><b>自由画布页</b>：绝对定位，和 PowerPoint 一样随手拖摆，放映时整页等比缩放。</li>'
        + '</ul>'
        + '<p><b>保真承诺</b>：导入既有 deck 时，样式表、运行时、页面骨架全部原样保留；'
        + '改主题只追加 <code>&lt;style id="ps-theme"&gt;</code> 覆盖块，不动原文件里那段带注释的品牌色声明。'
        + '反复「打开→保存」体积不膨胀。</p>'
        + '<p><b>当前阶段</b>：P1（骨架 + 画布对象编辑 + 往返保真）。'
        + '图表 / 表格 / 图标库在 P2，组件属性面板在 P3，动画与切换在 P4。</p>',
      buttons: [{ label: '关闭', primary: true }]
    });
  }

  return {
    boot: boot, load: load, newDeck: newDeck, openFile: openFile,
    insertTextbox: insertTextbox, insertImage: insertImage, insertLink: insertLink,
    resetSlide: resetSlide, formatBrush: formatBrush, applyBrushTo: applyBrushTo,
    find: find, setViewMode: setViewMode, showHelp: showHelp, showAbout: showAbout,
    paintTitle: paintTitle, gotoSlide: gotoSlide
  };
})();

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', PS.app.boot);
else PS.app.boot();

</script>
</body>
</html>
